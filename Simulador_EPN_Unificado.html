<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aula Virtual Vinculación EPN — Simuladores de admisión 2026-B</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Open Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.5;color:#1d2125;background:#fff}
a{color:#0f6cbf;text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit}

/* ---------- NAVBAR ---------- */
.navbar{background:#0e2a47;color:#fff;height:50px;display:flex;align-items:center;padding:0 16px;gap:22px;position:sticky;top:0;z-index:60}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand .shield{width:26px;height:30px;background:#fff;color:#0e2a47;border-radius:3px 3px 12px 12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;letter-spacing:-.5px}
.brand .btxt{display:flex;flex-direction:column;line-height:1.05}
.brand .btxt .l1{display:flex;align-items:baseline;gap:5px}
.brand .btxt b{font-size:19px;letter-spacing:.5px}
.brand .btxt i{display:block;font-size:9px;font-style:normal;letter-spacing:1.2px;opacity:.85;margin-top:2px}
.brand .btxt .sub{font-size:8px;letter-spacing:1.5px;opacity:.75}
.navlinks{display:flex;gap:20px;font-size:14px}
.navlinks a{color:#fff;opacity:.95;cursor:pointer}
.navlinks a.active{font-weight:700;text-decoration:none}
.navright{margin-left:auto;display:flex;align-items:center;gap:14px}
.icon-btn{background:none;border:0;color:#fff;font-size:15px;cursor:pointer;opacity:.9;padding:4px;border-radius:50%}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.avatar{width:28px;height:28px;border-radius:50%;background:#c9d6e2;color:#0e2a47;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}

/* ---------- LAYOUT ---------- */
.wrap{display:flex;min-height:calc(100vh - 50px);align-items:flex-start}
.drawer{width:250px;flex:0 0 250px;border-right:1px solid #dee2e6;padding:14px 0 40px;background:#fff;font-size:14px;position:sticky;top:50px;max-height:calc(100vh - 50px);overflow:auto}
.drawer .closex{background:none;border:0;font-size:16px;color:#0f6cbf;cursor:pointer;padding:0 16px 8px}
.drawer h6{margin:6px 0 4px;padding:0 16px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer}
.drawer ul{list-style:none;margin:0;padding:0}
.drawer li a{display:block;padding:7px 16px 7px 30px;color:#0f6cbf;border-left:3px solid transparent;cursor:pointer}
.drawer li a:hover{background:#f2f6fa;text-decoration:none}
.drawer li a.active{background:#cfe2f3;color:#0e2a47;font-weight:600;border-radius:0 6px 6px 0;text-decoration:none}
.main{flex:1 1 auto;min-width:0;padding:16px 24px 60px}
.rightblock{width:190px;flex:0 0 190px;padding:16px 16px 40px 0}

/* ---------- PAGE HEAD ---------- */
.pagehead{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.actv-icon{width:34px;height:34px;border-radius:6px;background:#f7a1c4;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;flex:0 0 34px}
h1.title{font-size:26px;margin:0;font-weight:700;color:#1d2125}
.crumbs{margin-left:auto;font-size:12.5px;color:#5b6b7a;padding-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs a{color:#0f6cbf}
.closepage{background:none;border:0;font-size:16px;color:#495057;cursor:pointer}

/* ---------- SUMMARY TABLE ---------- */
table.quizreviewsummary{width:100%;border-collapse:collapse;margin:10px 0 22px;font-size:14px}
table.quizreviewsummary th{width:33%;text-align:right;font-weight:700;padding:5px 12px;border-bottom:1px solid #f0f0f0;color:#1d2125;vertical-align:top}
table.quizreviewsummary td{padding:5px 12px;border-bottom:1px solid #f0f0f0}

/* ---------- QUESTION ---------- */
.que{display:flex;gap:0;border:1px solid #cfe0e0;background:#e7f3f3;border-radius:4px;margin:0 0 22px;overflow:hidden}
.que .info{flex:0 0 92px;background:#fff;padding:10px 8px 12px 10px;font-size:11.5px;color:#3d4b57;line-height:1.35}
.que .info h3{font-size:12px;margin:0 0 5px;font-weight:700}
.que .info h3 span{font-size:14px}
.que .info .state{margin-bottom:3px}
.que .info .grade{margin-bottom:8px}
.que .info .topic{margin-bottom:8px;font-size:10.5px;color:#7a8a99}
.que .info .flag{color:#0f6cbf;font-size:11px;display:inline-flex;gap:4px;align-items:center;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.que .info .flag u{text-decoration:underline}
.que .info .flag.on{color:#b3261e}
.que .content{flex:1 1 auto;padding:14px 18px 18px;min-width:0}
.qtext{font-size:15px;margin-bottom:14px}
.qtext p{margin:0 0 8px}
.stembox{background:#fff;border:1px solid #cfe0e0;border-radius:4px;padding:10px 14px;margin-bottom:12px;font-size:14.5px;line-height:1.6}
.answer{margin:0}
.answer .option{display:flex;gap:9px;align-items:flex-start;padding:5px 4px;border-radius:4px;cursor:pointer}
.answer .option:hover{background:rgba(255,255,255,.55)}
.answer .option input{margin:5px 0 0;flex:0 0 auto;accent-color:#0f6cbf}
.answer .option .optlabel{flex:0 0 auto;color:#3d4b57;padding-top:1px}
.answer .option .opttext{flex:1 1 auto}
.answer .option.correctopt{background:#dff3e2;box-shadow:inset 0 0 0 1px #b6dfc0}
.answer .option.wrongopt{background:#fbe0de;box-shadow:inset 0 0 0 1px #efb9b4}
.feedback{margin-top:12px;font-size:13.5px;border-top:1px dashed #b9d4d4;padding-top:10px}
.feedback .right{color:#25683a;font-weight:600}
.feedback .wrong{color:#a1231a;font-weight:600}
.figure{display:flex;justify-content:center;margin:6px 0 14px}
.figure svg{background:#fff;border-radius:4px;max-width:100%;height:auto}

/* ---------- NAV BLOCK ---------- */
.block{border:1px solid #e0e3e6;border-radius:6px;padding:12px 14px 14px;font-size:13px;background:#fff}
.block h5{margin:0 0 10px;font-size:15px;font-weight:700}
.block .user{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.block .user .av{width:56px;height:56px;border-radius:50%;background:#e9ecef;color:#495057;display:flex;align-items:center;justify-content:center;font-size:20px}
.block .user .uname{font-size:11.5px;color:#3d4b57}
.block .quizname{font-size:20px;font-weight:700;margin:6px 0 8px}
.qnbuttons{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.qnbutton{width:22px;text-align:center;font-size:11px;color:#0f6cbf;cursor:pointer;background:none;border:0;padding:0;line-height:1.2}
.qnbutton .num{border:1px solid #adb5bd;border-bottom:0;border-radius:2px 2px 0 0;display:block;background:#fff}
.qnbutton .bar{display:block;height:11px;border:1px solid #adb5bd;border-radius:0 0 2px 2px;background:#dee2e6}
.qnbutton.answered .bar{background:#495057;border-color:#495057}
.qnbutton.current .num,.qnbutton.current .bar{border-color:#0f6cbf;border-width:2px}
.qnbutton.current .num{font-weight:700;color:#0e2a47}
.qnbutton.flagged .num{background:#ffe9c7}
.qnbutton.correct .bar{background:#1f7a3f;border-color:#1f7a3f}
.qnbutton.incorrect .bar{background:#b3261e;border-color:#b3261e}
.block .blocklink{display:block;margin-top:6px;font-size:13px;cursor:pointer}

/* ---------- BUTTONS ---------- */
.btn{display:inline-block;border:1px solid #0f6cbf;background:#0f6cbf;color:#fff;padding:7px 16px;border-radius:4px;font-size:14px;cursor:pointer}
.btn:hover{background:#0d5ca3}
.btn.sec{background:#fff;color:#0f6cbf}
.btn.sec:hover{background:#eaf2fa}
.btn.ghost{background:#f8f9fa;color:#1d2125;border-color:#ced4da}
.btn.ghost:hover{background:#e9ecef}
.btn.danger{background:#b3261e;border-color:#b3261e}
.navbtns{display:flex;justify-content:space-between;gap:10px;margin:6px 0 30px}
.finishlink{text-align:right;margin:4px 0 18px;font-size:14px}

/* ---------- ACTIVITY NAV FOOTER ---------- */
.actnav{border:1px solid #e0e3e6;border-radius:6px;display:flex;align-items:center;gap:14px;padding:10px 16px;margin:26px 0 0;font-size:13px;background:#fff}
.actnav .side{flex:1 1 0;min-width:0}
.actnav .side.r{text-align:right}
.actnav .lbl{color:#5b6b7a;font-size:12px}
.actnav select{padding:5px 8px;border:1px solid #ced4da;border-radius:4px;font-size:13px;min-width:210px}
.actnav .arrow{color:#adb5bd;font-size:18px}
.actnav .next{display:inline-block;background:#cfe2f3;border-radius:4px;padding:6px 12px;color:#0f6cbf}

/* ---------- FOOTER ---------- */
.sitefooter{background:#0e2a47;color:#fff;padding:22px 26px 26px;margin-top:34px;display:flex;gap:30px;font-size:13px}
.sitefooter b{display:block;margin-bottom:8px}
.sitefooter .mid{flex:1 1 auto;text-align:center}
.sitefooter .contactbtn{display:inline-block;border:1px solid #fff;border-radius:4px;padding:6px 14px;color:#fff;margin-bottom:8px}
.sitefooter .soc{display:flex;gap:8px}
.sitefooter .soc i{width:24px;height:24px;border-radius:50%;background:#1b6ec2;display:flex;align-items:center;justify-content:center;font-size:12px;font-style:normal}

/* ---------- HOME ---------- */
.homehero{background:#0e2a47;color:#fff;padding:34px 26px}
.homehero h2{margin:0 0 6px;font-size:27px}
.homehero p{margin:0;opacity:.85;font-size:14px}
.homehero .stats{display:flex;gap:26px;margin-top:16px;flex-wrap:wrap}
.homehero .stats div b{display:block;font-size:22px}
.homehero .stats div span{font-size:12px;opacity:.8;letter-spacing:.5px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:22px}
.card{border:1px solid #e0e3e6;border-radius:8px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.card .cimg{height:88px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff}
.card .cbody{padding:12px 14px 16px;flex:1 1 auto;display:flex;flex-direction:column}
.card h3{margin:0 0 4px;font-size:16px}
.card p{margin:0 0 12px;font-size:13px;color:#5b6b7a;flex:1 1 auto}
.card .cbtns{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#e9ecef;color:#495057;margin-bottom:8px;align-self:flex-start}
.badge.ok{background:#dff3e2;color:#25683a}

/* ---------- MODAL ---------- */
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;overflow:auto}
.modal{background:#fff;border-radius:8px;max-width:560px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25);overflow:hidden;margin:auto}
.modal header{padding:14px 18px;border-bottom:1px solid #e9ecef;font-weight:700;font-size:17px;display:flex;align-items:center}
.modal header button{margin-left:auto;background:none;border:0;font-size:18px;cursor:pointer;color:#495057}
.modal .body{padding:16px 18px}
.modal .foot{padding:12px 18px;border-top:1px solid #e9ecef;display:flex;justify-content:flex-end;gap:10px;background:#f8f9fa}
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;font-size:13.5px;margin-bottom:4px}
.field input,.field select{width:100%;padding:7px 9px;border:1px solid #ced4da;border-radius:4px;font-size:14px}
.field .hint{font-size:12px;color:#6c757d;margin-top:3px}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:10px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid #ced4da;background:#fff;border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;color:#3d4b57}
.pill:hover{background:#f1f3f5}
.pill.on{background:#0f6cbf;border-color:#0f6cbf;color:#fff;font-weight:600}
.pill.f1.on{background:#1f7a3f;border-color:#1f7a3f}
.pill.f2.on{background:#0f6cbf;border-color:#0f6cbf}
.pill.f3.on{background:#d9822b;border-color:#d9822b}
.pill.f4.on{background:#b3261e;border-color:#b3261e}

/* ---------- ATTEMPT SUMMARY TABLE ---------- */
table.quizsummary{width:100%;border-collapse:collapse;margin:14px 0 20px;font-size:14px}
table.quizsummary th{background:#f1f3f5;text-align:left;padding:8px 12px;border:1px solid #dee2e6;font-size:13px}
table.quizsummary td{padding:8px 12px;border:1px solid #dee2e6}
table.quizsummary td a{cursor:pointer}
.timerbox{border:1px solid #e0e3e6;border-radius:6px;padding:10px 12px;font-size:13px;margin-bottom:14px;background:#fff}
.timerbox .t{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.timerbox.warn{border-color:#e0a800;background:#fff8e6}
.timerbox.crit{border-color:#b3261e;background:#fbe0de;color:#8f1d16}
.alertbox{border:1px solid #f5c6cb;background:#fbe0de;color:#7d1b14;padding:10px 14px;border-radius:6px;margin:10px 0 16px;font-size:14px}
.infobox{border:1px solid #bcd9f0;background:#eaf3fb;color:#0e3b63;padding:10px 14px;border-radius:6px;margin:10px 0 16px;font-size:14px}
.byarea{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 20px}
.byarea th,.byarea td{border:1px solid #dee2e6;padding:7px 12px;text-align:left}
.byarea th{background:#f1f3f5;font-size:13px}
.bar-outer{background:#e9ecef;border-radius:8px;height:10px;width:150px;overflow:hidden;display:inline-block;vertical-align:middle}
.bar-inner{background:#1f7a3f;height:100%}

/* ---------- APRENDE ---------- */
.th-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin:16px 0 10px}
.th-card{border:1px solid #e0e3e6;border-radius:8px;padding:14px 16px;background:#fff;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.th-card:hover{border-color:#0f6cbf;background:#f7fbff}
.th-card .ic{font-size:22px}
.th-card b{display:block;font-size:15px;margin-bottom:2px}
.th-card span{font-size:12.5px;color:#6c757d}
.th-sub{font-size:13px;color:#5b6b7a;margin:2px 0 0}
.theory{max-width:820px;font-size:15.5px;line-height:1.72}
.theory h2{font-size:21px;margin:26px 0 8px;padding-bottom:5px;border-bottom:2px solid #e7f3f3;color:#0e2a47}
.theory h3{font-size:17px;margin:20px 0 6px;color:#12496f}
.theory h4{font-size:15px;margin:16px 0 4px;color:#25683a;text-transform:none}
.theory p{margin:9px 0}
.theory ul,.theory ol{margin:8px 0 8px 4px;padding-left:22px}
.theory li{margin:4px 0}
.theory blockquote{margin:12px 0;padding:11px 15px;background:#fff8e6;border-left:4px solid #e0a800;border-radius:0 6px 6px 0;font-size:14.5px}
.theory table{border-collapse:collapse;margin:12px 0;font-size:14px;width:100%}
.theory th,.theory td{border:1px solid #dee2e6;padding:6px 11px;text-align:left}
.theory th{background:#f1f3f5}
.theory hr{border:0;border-top:1px solid #e9ecef;margin:18px 0}
.theory code{background:#f1f3f5;padding:1px 5px;border-radius:3px;font-size:13.5px}
.th-nav{display:flex;justify-content:space-between;gap:10px;margin:26px 0 10px}

/* ---------- LAYOUT MEJORADO / RESPONSIVE ---------- */
.drawer.hide{display:none}
.drawerbtn{position:fixed;left:10px;bottom:14px;z-index:40;background:#0e2a47;color:#fff;border:0;border-radius:20px;padding:9px 15px;font-size:13px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.drawerbtn:hover{background:#164272}
.main.reading{max-width:880px;margin:0 auto;padding:16px 30px 70px}
.theory{max-width:none;font-size:17px;line-height:1.85;color:#26313a}
.theory h2{font-size:23px;margin:34px 0 10px;padding-bottom:7px}
.theory h3{font-size:19px;margin:24px 0 6px}
.theory h4{font-size:16px;margin:18px 0 4px}
.theory p{margin:12px 0}
.theory li{margin:7px 0}
.theory blockquote{font-size:16px;padding:13px 18px;margin:16px 0}
.theory blockquote.tip{background:#eef7ef;border-left-color:#1f7a3f}
.theory blockquote.warn{background:#fdeceb;border-left-color:#b3261e}
.theory table{font-size:15px}
.theory .mjx{font-size:1.08em}
.theory .mjx-display{margin:18px 0;font-size:1.24em}
.theory .exbox{background:#f6f9fc;border:1px solid #dbe6f0;border-left:4px solid #0f6cbf;border-radius:0 8px 8px 0;padding:12px 18px;margin:16px 0}
.theory .exbox>h4:first-child{margin-top:0}
.toc{background:#f8f9fa;border:1px solid #e3e6e8;border-radius:10px;padding:14px 20px;margin:6px 0 20px;font-size:15px}
.toc b{display:block;margin-bottom:6px;font-size:14px;color:#5b6b7a;text-transform:uppercase;letter-spacing:.04em}
.toc ol{margin:0;padding-left:20px}
.toc li{margin:3px 0}
.toc a{cursor:pointer}
.readbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;font-size:13px;color:#5b6b7a}
.progressbar{position:fixed;top:50px;left:0;height:3px;background:#0f6cbf;z-index:30;transition:width .1s}
/* ---------- HISTORIAL Y ESTADÍSTICAS ---------- */
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin:14px 0 22px}
.statcard{border:1px solid #e0e3e6;border-radius:10px;padding:14px 16px;background:#fff}
.statcard .v{font-size:26px;font-weight:700;color:#0e2a47;line-height:1.2}
.statcard .l{font-size:12px;color:#6c757d;text-transform:uppercase;letter-spacing:.04em;margin-top:3px}
.histtable{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0 18px;background:#fff}
.histtable th,.histtable td{border:1px solid #dee2e6;padding:8px 11px;text-align:left;vertical-align:middle}
.histtable th{background:#f1f3f5;font-size:13px}
.histtable tr:hover td{background:#f7fbff}
.gradepill{display:inline-block;padding:2px 9px;border-radius:11px;font-weight:700;font-size:13px;color:#fff}
.g-ok{background:#1f7a3f}.g-mid{background:#d9822b}.g-bad{background:#b3261e}.g-del{background:#98a2ab}
.histtable tr.delrow td{background:#f6f7f8;color:#8a949c;text-decoration:line-through}
.histtable tr.delrow td .btn,.histtable tr.delrow td .delbadge{text-decoration:none}
.delbadge{display:inline-block;background:#e4e7ea;color:#5b6b7a;border-radius:9px;padding:1px 8px;font-size:11px;letter-spacing:.03em;text-transform:uppercase}
.spark{background:#fff;border:1px solid #e0e3e6;border-radius:10px;padding:14px 16px;margin:8px 0 20px;overflow-x:auto}
.spark svg{max-width:100%;height:auto}
.emptybox{border:1px dashed #c9d2da;border-radius:10px;padding:26px;text-align:center;color:#6c757d;background:#fbfcfd;margin:14px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 6px;border-bottom:1px solid #dee2e6}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;font-size:14px;cursor:pointer;color:#0f6cbf}
.tabs button.on{border-bottom-color:#0f6cbf;color:#0e2a47;font-weight:700}
.covbar{height:9px;border-radius:5px;background:#e9ecef;overflow:hidden;margin-top:6px}
.covbar span{display:block;height:100%;background:#0f6cbf}
.sechead{font-size:19px;margin:30px 0 6px;padding-bottom:6px;border-bottom:2px solid #e9ecef;color:#1d2125}
.herostats{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:14px 0 6px}
.bigdonut{flex:0 0 190px;display:flex;justify-content:center}
.bigdonut svg{width:170px;height:170px}
.statgrid.grow{flex:1 1 380px}
.reco{display:flex;gap:12px;background:#fff;border:1px solid #e3e8ee;border-left:5px solid #0f6cbf;border-radius:8px;padding:14px 16px;margin:10px 0;box-shadow:0 1px 3px rgba(16,24,40,.06)}
.reco .rank{flex:0 0 34px;height:34px;border-radius:50%;background:#0f6cbf;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.reco .recobody{flex:1;min-width:0}
.reco .recobody>b{font-size:16px}
.reco p{margin:8px 0 10px;color:#40484f;line-height:1.6}
.recobtns{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-block;padding:2px 9px;border-radius:11px;font-size:11.5px;font-weight:700;color:#fff;vertical-align:2px}
.chip.light{background:#e9ecef;color:#41494f}
.planbox,.topicbox{border:1px solid #e3e8ee;border-radius:8px;background:#fff;margin:12px 0;padding:0}
.planbox>summary,.topicbox>summary{cursor:pointer;padding:12px 16px;font-weight:700;color:#0f6cbf;list-style:none}
.planbox>summary::-webkit-details-marker,.topicbox>summary::-webkit-details-marker{display:none}

<br>¿Qué se puede concluir con certeza?","o":["Todos los que leen a diario pertenecen a los músicos.","Nada con certeza: no se sigue que Sofía pertenezca a los músicos.","Sofía pertenece a los músicos.","Sofía no pertenece a los músicos."],"a":1,"s":"Afirmar el consecuente es una falacia formal: la conclusión no se sigue necesariamente."},{"t":"Lectura e interpretación de textos","d":"experto","q":"La comparación con «reconstruir una casa con los ladrillos que quedaron» sirve para:","o":["explicar el funcionamiento del cerebro a nivel químico","indicar que los recuerdos se guardan intactos","ilustrar que cada evocación modifica parcialmente el recuerdo","sostener que la memoria es ilimitada"],"a":2,"s":"La respuesta se sustenta directamente en la información y el sentido global del texto leído.","stem":"Durante siglos se creyó que la memoria funcionaba como una bodega: los recuerdos se guardaban intactos y bastaba con abrir la puerta correcta para recuperarlos. Hoy sabemos que recordar se parece más a reconstruir una casa con los ladrillos que quedaron: cada vez que evocamos un episodio, lo volvemos a armar y, sin darnos cuenta, cambiamos algunas piezas."},{"t":"Lectura e interpretación de textos","d":"experto","q":"En la oración «el argumento resulta endeble ante los datos presentados», la palabra ENDEBLE significa:","o":["débil o poco sólido","contundente","extenso","novedoso"],"a":0,"s":"El significado se deduce del contexto de la oración (lectura crítica, bloque 4.4.2)."},{"t":"Pensamiento lógico y comunicación","d":"experto","q":"Bruno conversa con Nicolás en una parada de bus en Ibarra durante una lluvia intensa. Ese conjunto de circunstancias constituye:","o":["el receptor","el contexto o situación comunicativa","el canal","el código"],"a":1,"s":"Elementos y funciones de la comunicación (bloque 4.4.1)."},{"t":"Pensamiento lógico y comunicación","d":"experto","q":"Premisa 1: Todos los científicos trabajan en equipo.<br>Premisa 2: Tomás es uno de los científico tido global del texto leído.","stem":"Aprender a estudiar es una habilidad que casi nunca se enseña. Se supone que el estudiante descubrirá por su cuenta cómo distribuir su tiempo, cómo detectar lo que no entiende y cómo comprobar si de verdad aprendió. Sin embargo, la evidencia muestra que quienes se autoevalúan con frecuencia recuerdan mucho más que quienes solo releen sus apuntes."},{"t":"Lectura e interpretación de textos","d":"experto","q":"En «el texto tiene un tono mordaz», MORDAZ significa:","o":["melancólico","solemne","neutral","sarcástico e incisivo"],"a":3,"s":"El significado se deduce del contexto de la oración (lectura crítica, bloque 4.4.2)."},{"t":"Pensamiento lógico y comunicación","d":"experto","q":"Premisa 1: Todos los estudiantes de la EPN estudian matemática.<br>Premisa 2: Sofía estudian matemática.<br>¿Qué se puede concluir con certeza?","o":["Todos los que estudian matemática pertenecen a los estudiantes de la EPN.","Nada con certeza: no se sigue que Sofía pertenezca a los estudiantes de la EPN.","Sofía no pertenece a los estudiantes de la EPN.","Sofía pertenece a los estudiantes de la EPN."],"a":1,"s":"Afirmar el consecuente es una falacia formal: la conclusión no se sigue necesariamente."},{"t":"Pensamiento lógico y comunicación","d":"experto","q":"«No debes creer en el informe de Sebastián sobre contaminación, porque él reprobó química en el colegio». Esta afirmación contiene una falacia:","o":["de generalización apresurada","de autoridad","de falsa causa","ad hominem (ataque a la persona)"],"a":3,"s":"Identificación de falacias en la argumentación (bloques 4.4.1 y 4.4.3)."},{"t":"Pensamiento lógico y comunicación","d":"experto","q":"Paula envía un correo electrónico a su profesora para pedir una tutoría. En este acto comunicativo, el canal es:","o":["la petición de tutoría","Paula","la profesora","el correo electrónico"],"a":3,"s":"Elementos y funciones de la comunicación (bloque 4.4.1)."},{"t":"Pensamiento lógico y comunicación","d":"expe <script>
window.THEORY_RAW = "@@CHAPTER trig|t1|📐|Taller Especializado: Identidades Trigonométricas\n## ¿Por qué son fundamentales las Identidades Trigonométricas?\nLas identidades trigonométricas son ecuaciones que involucran funciones trigonométricas y son **válidas para todos los valores admisibles de la variable**. En el examen de la EPN, resolver este tipo de preguntas requiere reconocer patrones al instante para simplificar expresiones complejas en segundos.\n\n---\n\n## 1. Identidades Fundamentales que DEBES Memorizar\n\n### A. Identidades de Cociente\n> **Regla de oro:** Cuando tengas dudas en un ejercicio, convierte TODAS las funciones a **senos y cosenos**.\n\n- $\\tan(x) = \\frac{\\sin(x)}{\\cos(x)}$\n- $\\cot(x) = \\frac{\\cos(x)}{\\sin(x)}$\n\n### B. Identidades Recíprocas\n- $\\csc(x) = \\frac{1}{\\sin(x)} \\quad \\Longleftrightarrow \\quad \\sin(x) \\cdot \\csc(x) = 1$\n- $\\sec(x) = \\frac{1}{\\cos(x)} \\quad \\Longleftrightarrow \\quad \\cos(x) \\cdot \\sec(x) = 1$\n- $\\cot(x) = \\frac{1}{\\tan(x)} \\quad \\Longleftrightarrow \\quad \\tan(x) \\cdot \\cot(x) = 1$\n\n### C. Identidades Pitagóricas (Las más evaluadas)\n1. **La Reina de las Identidades:**\n   $$\\sin^{2}(x) + \\cos^{2}(x) = 1$$\n   - Despejes útiles: $\\sin^{2}(x) = 1 - \\cos^{2}(x)$\n   - Despejes útiles: $\\cos^{2}(x) = 1 - \\sin^{2}(x)$\n\n2. **Identidad de la Tangente y Secante (¡La del ejercicio!):**\n   $$1 + \\tan^{2}(x) = \\sec^{2}(x)$$\n   - Despeje útil: $\\sec^{2}(x) - \\tan^{2}(x) = 1$\n   - Despeje útil: $\\tan^{2}(x) = \\sec^{2}(x) - 1$\n\n3. **Identidad de la Cotangente y Cosecante:**\n   $$1 + \\cot^{2}(x) = \\csc^{2}(x)$$\n   - Despeje útil: $\\csc^{2}(x) - \\cot^{2}(x) = 1$\n\n---\n\n## 2. Identidades de Ángulo Doble (Fórmulas Esenciales)\n- **Seno del ángulo doble:** \n  $$\\sin(2x) = 2\\sin(x)\\cos(x)$$\n\n- **Coseno del ángulo doble (Las 3 formas del examen):**\n  $$\\cos(2x) = \\cos^{2}(x) - \\sin^{2}(x)$$\n  $$\\cos(2x) = 1 - 2\\sin^{2}(x)$$\n  $$\\cos(2x) = 2\\cos^{2}(x) - 1$$\n\n---\n\n## 3. Truco de Examen: Comprobación Numérica Rápida ⚡\n> Si en el examen te piden simplificar una expresión y no recuerdas la fórmula algebraicamente, **sustituye un ángulo notable conocido** (por ejemplo $x = 30^\\circ$ o $x = 45^\\circ$) en el enunciado y evalúa las opciones. La opción que dé exactamente el mismo número es la correcta.\n\n\n@@CHAPTER mat|m1|🧮|Fundamentos de Álgebra\n## ¿Por qué importa?\nEl álgebra es el idioma con el que se escriben todas las demás preguntas del examen. Si dominas esta parte, la mitad de los errores de física y química desaparecen solos.\n\n> **Analogía:** los números son las palabras y el álgebra es la gramática. Puedes conocer muchas palabras, pero sin gramática no formas una frase correcta.\n\n## 1. Conjuntos numéricos\n- **Naturales** $\\mathbb{N}$: $1, 2, 3, \\ldots$ (contar).\n- **Enteros** $\\mathbb{Z}$: agregan el cero y los negativos.\n- **Racionales** $\\mathbb{Q}$: todo lo que se escribe como $\\frac{a}{b}$ con $b \\neq 0$. Su decimal termina o es periódico.\n- **Irracionales** $\\mathbb{I}$: $\\sqrt{2}$, $\\pi$, $e$. Decimal infinito **no** periódico.\n- **Reales** $\\mathbb{R}$: racionales más irracionales. Es la recta completa.\n\n## 2. Jerarquía de operaciones (el orden manda)\n1. Paréntesis, corchetes y llaves (de adentro hacia afuera).\n2. Potencias y raíces.\n3. Multiplicaciones y divisiones (de izquierda a derecha).\n4. Sumas y restas (de izquierda a derecha).\n\n#### Ejemplo resuelto\nCalcular $-(4 - 7)^{2} + 3 \\cdot 5 - (-2)^{2}$.\n1. Paréntesis: $4 - 7 = -3$.\n2. Potencias: $(-3)^{2} = 9$ y $(-2)^{2} = 4$.\n3. Queda $-9 + 15 - 4 = 2$.\n\n> **Error clásico:** $-3^{2}$ **no** es $9$. Sin paréntesis, la potencia actúa solo sobre el $3$: $-3^{2} = -9$. En cambio $(-3)^{2} = 9$.\n\n## 3. Leyes de los exponentes\n- $a^{m}\\cdot a^{n} = a^{m+n}$\n- $\\dfrac{a^{m}}{a^{n}} = a^{m-n}$\n- $(a^{m})^{n} = a^{mn}$\n- $a^{0} = 1$ (con $a \\neq 0$)\n- $a^{-n} = \\dfrac{1}{a^{n}}$\n- $a^{\\frac{m}{n}} = \\sqrt[n]{a^{m}}$\n\n**Truco de oro:** cuando veas sumas de potencias, **factoriza la potencia menor**. Por ejemplo $2^{9} - 2^{10} = 2^{9}(1 - 2) = -2^{9}$. Este truco aparece casí siempre en el examen de la EPN.\n\n## 4. Radicales\n- $\\sqrt{ab} = \\sqrt{a}\\sqrt{b}$ y $\\sqrt{\\frac{a}{b}} = \\frac{\\sqrt{a}}{\\sqrt{b}}$.\n- Simplificar: busca cuadrados perfectos dentro de la raíz. $\\sqrt{72} = \\sqrt{36 \\cdot 2} = 6\\sqrt{2}$.\n- Racionalizar: $\\dfrac{3}{\\sqrt{5}} = \\dfrac{3\\sqrt{5}}{5}$; con binomios usa el conjugado: $\\dfrac{1}{\\sqrt{3}-1} = \\dfrac{\\sqrt{3}+1}{2}$.\n\n## 5. Fracciones sin miedo\nPara sumar o restar: común denominador. Para multiplicar: en línea recta. Para dividir: multiplica por el recíproco.\n\nFracción compleja: $\\dfrac{\\frac{a}{b}}{\\frac{c}{d}} = \\frac{a}{b}\\cdot\\frac{d}{c}$.\n\n> **Analogía:** dividir para $\\frac{1}{2}$ es preguntar «cuántas mitades caben»: por eso el resultado **crece**.\n\n## 6. Productos notables (memorízalos)\n- $(a+b)^{2} = a^{2} + 2ab + b^{2}$\n- $(a-b)^{2} = a^{2} - 2ab + b^{2}$\n- $(a+b)(a-b) = a^{2} - b^{2}$\n- $(a+b)^{3} = a^{3} + 3a^{2}b + 3ab^{2} + b^{3}$\n- $a^{3} \\pm b^{3} = (a \\pm b)(a^{2} \\mp ab + b^{2})$\n\n## 7. Factorización: el menú en orden\n1. **Factor común** siempre primero.\n2. **Diferencia de cuadrados**.\n3. **Trinomio cuadrado perfecto**.\n4. **Trinomio de la forma** $x^{2}+bx+c$: dos números que sumen $b$ y multipliquen $c$.\n5. **Trinomio** $ax^{2}+bx+c$: agrupación o aspa.\n6. **Suma/diferencia de cubos**.\n\n#### Ejemplo resuelto\nSimplificar $\\dfrac{x^{2}-9}{x^{2}+6x+9}$ = $\\dfrac{(x-3)(x+3)}{(x+3)^{2}} = \\dfrac{x-3}{x+3}$, con $x \\neq -3$.\n\n> **Regla de oro:** solo se cancelan **factores**, nunca sumandos. $\\frac{x+2}{2}$ **no** es $x$.\n\n## 8. División de polinomios y teorema del residuo\nSi divides $P(x)$ para $(x - a)$, el residuo es $P(a)$. Si $P(a) = 0$, entonces $(x-a)$ es factor (teorema del factor). Ruffini es el atajo práctico.\n\n## Errores que cuestan puntos\n- Perder el signo al distribuir un menos: $-(x - 3) = -x + 3$.\n- Escribir $(a+b)^{2} = a^{2}+b^{2}$ (falta el $2ab$).\n- Simplificar sin factorizar.\n- Olvidar las restricciones del denominador.\n## 9. Enteros: reglas de signo sin dudar\n\nPiensa en los enteros como **pasos hacia adelante (+) y hacia atras (-)** sobre una recta.\n\n| Operacion | Regla | Ejemplo |\n|---|---|---|\n| Suma de igual signo | suma y conserva el signo | $-7-5=-12$ |\n| Suma de distinto signo | resta y toma el signo del mayor en valor absoluto | $-9+4=-5$ |\n| Producto/cociente | igual signo $\\to +$, distinto signo $\\to -$ | $(-3)(-6)=18$ |\n| Potencia de base negativa | exponente par $\\to +$, impar $\\to -$ | $(-2)^4=16$, $(-2)^3=-8$ |\n\n> [tip] Truco del parentesis: $-(-5)$ es \"quitar una deuda de 5\", o sea $+5$. Y $-2^4=-16$ pero $(-2)^4=16$: sin parentesis, el signo no entra a la potencia. Esta diferencia aparece casi siempre en el examen.\n\n**Divisibilidad util:** un numero es divisible para 2 si termina en cifra par; para 3 si la suma de sus cifras es multiplo de 3; para 5 si termina en 0 o 5; para 9 si la suma de cifras es multiplo de 9.\n\n**MCD y mcm por descomposicion:** $60=2^2\\cdot 3\\cdot 5$ y $72=2^3\\cdot 3^2$. El MCD toma los **comunes con menor exponente**: $2^2\\cdot 3=12$. El mcm toma **todos con mayor exponente**: $2^3\\cdot 3^2\\cdot 5=360$.\n\n## 10. Racionales: fracciones, decimales y porcentajes\n\nUn racional es cualquier numero que se puede escribir como $\\dfrac{a}{b}$ con $b\\neq 0$.\n\n- **Decimal exacto a fraccion:** $0{,}375=\\dfrac{375}{1000}=\\dfrac{3}{8}$.\n- **Decimal periodico puro:** $0{,}\\overline{27}=\\dfrac{27}{99}=\\dfrac{3}{11}$ (tantos nueves como cifras del periodo).\n- **Decimal periodico mixto:** $0{,}1\\overline{6}=\\dfrac{16-1}{90}=\\dfrac{15}{90}=\\dfrac{1}{6}$.\n- **Porcentaje:** $x\\%$ de $N$ es $\\dfrac{x}{100}\\cdot N$. Aumentar 20% es multiplicar por $1{,}20$; descontar 20% es multiplicar por $0{,}80$. Ojo: subir 20% y luego bajar 20% **no** devuelve al inicio ($1{,}2\\cdot 0{,}8=0{,}96$).\n- **Regla de tres y proporciones:** si $\\dfrac{a}{b}=\\dfrac{c}{d}$ entonces $ad=bc$ (producto cruzado). En proporcion inversa, lo que crece en uno decrece en el otro: $a\\cdot b=c\\cdot d$.\n\n## 11. Reales: intervalos, recta y notacion cientifica\n\n$\\mathbb{R}$ = racionales + irracionales ($\\sqrt{2}$, $\\pi$, $e$). Todo real ocupa un punto en la recta numerica.\n\n| Notacion | Significado | Grafico |\n|---|---|---|\n| $[a,b]$ | incluye extremos | bolita llena |\n| $(a,b)$ | excluye extremos | bolita vacia |\n| $[a,\\infty)$ | desde $a$ hacia la derecha | el infinito nunca se cierra |\n\n**Notacion cientifica:** $a\\times 10^{n}$ con $1\\le a<10$. Para multiplicar se suman exponentes; para dividir se restan: $(3\\times 10^{5})(2\\times 10^{-3})=6\\times 10^{2}$.\n\n**Orden en los reales:** si multiplicas una desigualdad por un negativo, **el sentido se invierte**. Ese detalle vale puntos en la seccion de inecuaciones.\n\n## 12. Expresiones algebraicas al detalle\n\n- **Termino, coeficiente, grado:** en $-5x^3y^2$ el coeficiente es $-5$ y el grado es $3+2=5$.\n- **Valor numerico:** reemplazar y calcular. Si $P(x)=2x^2-3x+1$, entonces $P(-2)=2(4)+6+1=15$.\n- **Suma/resta:** solo se combinan **terminos semejantes** (misma parte literal con los mismos exponentes).\n- **Producto:** propiedad distributiva; $(x+3)(x-5)=x^2-2x-15$.\n- **Racionalizacion con binomio:** multiplica por el conjugado, $\\dfrac{2}{\\sqrt{5}-1}=\\dfrac{2(\\sqrt{5}+1)}{4}=\\dfrac{\\sqrt{5}+1}{2}$.\n- **Simplificar fracciones algebraicas:** factoriza primero y luego cancela **factores** (nunca sumandos): $\\dfrac{x^2-9}{x^2+6x+9}=\\dfrac{(x-3)(x+3)}{(x+3)^2}=\\dfrac{x-3}{x+3}$.\n\n> [warn] Cancelar mal es el error numero uno: en $\\dfrac{x+3}{3}$ **no** se puede tachar el 3, porque arriba es una suma, no un producto.\n\n## Ejercicios resueltos tipo examen\n\n**1)** Calcular $\\dfrac{2}{3}-\\dfrac{5}{6}+\\dfrac{1}{4}$.\nDenominador comun 12: $\\dfrac{8}{12}-\\dfrac{10}{12}+\\dfrac{3}{12}=\\dfrac{1}{12}$.\n\n**2)** Simplificar $\\dfrac{(2x^2y^{-1})^3}{4x^{4}y^{-5}}$.\nArriba: $8x^{6}y^{-3}$. Dividiendo: $\\dfrac{8}{4}x^{6-4}y^{-3+5}=2x^{2}y^{2}$.\n\n**3)** Un articulo cuesta 80 USD, sube 25% y luego baja 20%. Precio final: $80\\cdot 1{,}25\\cdot 0{,}80=80$ USD. Volvio al mismo precio, aunque los porcentajes no se \"cancelan\" en general.\n\n**4)** Factorizar $3x^3-12x$: factor comun $3x$, luego diferencia de cuadrados: $3x(x^2-4)=3x(x-2)(x+2)$.\n\n## Resumen relampago\n\n| Concepto | Formula clave |\n|---|---|\n| Producto notable | $(a\\pm b)^2=a^2\\pm 2ab+b^2$ |\n| Diferencia de cuadrados | $a^2-b^2=(a-b)(a+b)$ |\n| Suma/diferencia de cubos | $a^3\\pm b^3=(a\\pm b)(a^2\\mp ab+b^2)$ |\n| Exponentes | $a^m a^n=a^{m+n}$, $(a^m)^n=a^{mn}$, $a^{-n}=\\dfrac{1}{a^n}$ |\n| Radical a exponente | $\\sqrt[n]{a^m}=a^{m/n}$ |\n\n@@CHAPTER mat|m2|⚖️|Ecuaciones e Inecuaciones\n## La idea central\nUna ecuación es una **balanza**: lo que hagas a un lado debes hacerlo al otro. Una inecuación es una balanza inclinada: puedes hacer lo mismo, pero **si multiplicas o divides por un negativo, la balanza se voltea**.\n\n## 1. Ecuaciones de primer grado\nPasos: quitar denominadores (multiplicando por el m.c.m.), quitar paréntesis, agrupar $x$ a un lado y números al otro, despejar.\n\n#### Ejemplo resuelto\n$\\dfrac{2x}{3} - 4 = \\dfrac{x}{2} + 1$. Multiplico todo por 6: $4x - 24 = 3x + 6 \\Rightarrow x = 30$.\n\n**Verifica siempre** reemplazando en la ecuación original: es la forma más rápida de descartar opciones en un examen de selección múltiple.\n\n## 2. Sistemas de ecuaciones lineales\nTres métodos: **sustitución**, **igualación** y **reducción** (suma y resta). En un examen cronometrado, reducción suele ser el más rápido.\n\nInterpretación geométrica:\n- Una solución → rectas que se cortan.\n- Infinitas soluciones → rectas coincidentes.\n- Sin solución → rectas paralelas.\n\n#### Problema tipo\n«3 cuadernos y 2 esferos cuestan 13; 2 cuadernos y 4 esferos cuestan 14». Sea $c$ y $e$: $3c+2e=13$, $2c+4e=14$. Multiplico la primera por 2 y resto: $4c = 12 \\Rightarrow c = 3$, $e = 2$.\n\n## 3. Ecuación de segundo grado\nFórmula general: $$x = \\frac{-b \\pm \\sqrt{b^{2}-4ac}}{2a}$$\n\n**Discriminante** $\\Delta = b^{2}-4ac$:\n- $\\Delta > 0$: dos raíces reales distintas.\n- $\\Delta = 0$: una raíz real doble.\n- $\\Delta < 0$: no hay raíces reales.\n\n**Relaciones de Viète** (ahorran muchísimo tiempo):\n$$x_{1}+x_{2} = -\\frac{b}{a}, \\qquad x_{1}x_{2} = \\frac{c}{a}$$\nCon ellas, $x_{1}^{2}+x_{2}^{2} = (x_{1}+x_{2})^{2} - 2x_{1}x_{2}$ sin resolver la ecuación.\n\n## 4. Inecuaciones\n- Lineales: como una ecuación, pero **al multiplicar o dividir por un negativo cambia el sentido**.\n- Cuadráticas: halla las raíces, dibújalas en la recta y analiza el signo. Si $a>0$, la parábola es negativa **entre** las raíces y positiva **fuera**.\n- Racionales: nunca multipliques por el denominador sin analizar su signo; pasa todo a un lado y estudia el signo del cociente.\n\n#### Ejemplo resuelto\n$x^{2}-5x+6 < 0$. Raíces: 2 y 3. Como abre hacia arriba, es negativa entre ellas: $2 < x < 3$.\n\n## 5. Valor absoluto\n$|u|$ es la **distancia de $u$ al cero**. De ahí salen todas las reglas:\n- $|u| = k$ ($k \\geq 0$) → $u = k$ **o** $u = -k$.\n- $|u| < k$ → $-k < u < k$ («cerca del cero», intervalo).\n- $|u| > k$ → $u < -k$ **o** $u > k$ («lejos del cero», dos rayos).\n\n> **Analogía:** $|x-5| < 2$ significa «estoy a menos de 2 pasos del punto 5», o sea entre 3 y 7.\n\n## Estrategia para el examen\n1. Si las opciones son números, **reemplaza** en lugar de resolver.\n2. Descarta por signo o por magnitud antes de calcular.\n3. En sistemas, si te piden $x+y$, a veces basta con **sumar las dos ecuaciones**.\n## 6. Problemas verbales: de las palabras a la ecuacion\n\n| Frase | Traduccion |\n|---|---|\n| \"un numero aumentado en 5\" | $x+5$ |\n| \"el triple de un numero menos 4\" | $3x-4$ |\n| \"dos numeros consecutivos\" | $x$ y $x+1$ |\n| \"la edad dentro de 6 anios\" | $x+6$ |\n| \"el 15% de\" | $0{,}15x$ |\n\n**Receta:** (1) nombra la incognita con una frase completa, (2) escribe la relacion, (3) resuelve, (4) **verifica en el enunciado**, no en tu ecuacion.\n\n**Ejemplo.** La suma de tres enteros consecutivos es 84. Sea $x$ el menor: $x+(x+1)+(x+2)=84 \\Rightarrow 3x+3=84 \\Rightarrow x=27$. Los numeros son 27, 28 y 29.\n\n**Mezclas, trabajo y movimiento (los tres clasicos):**\n- Movimiento: $d=v\\cdot t$. Si van en sentidos opuestos, las distancias se suman.\n- Trabajo: si A tarda $a$ horas y B tarda $b$, juntos tardan $t$ con $\\dfrac{1}{a}+\\dfrac{1}{b}=\\dfrac{1}{t}$.\n- Mezclas: concentracion $\\times$ cantidad = soluto; la suma de solutos se conserva.\n\n## 7. Sistemas lineales: los tres metodos y el analisis de soluciones\n\nPara $\\begin{cases} a_1x+b_1y=c_1 \\\\ a_2x+b_2y=c_2 \\end{cases}$:\n\n- **Sustitucion:** despeja la variable con coeficiente 1.\n- **Igualacion:** despeja la misma variable en ambas y iguala.\n- **Reduccion (suma y resta):** iguala coeficientes y elimina. Es el mas rapido en el examen.\n\n**Cuantas soluciones tiene?** Compara las razones:\n\n| Condicion | Tipo | Interpretacion grafica |\n|---|---|---|\n| $\\dfrac{a_1}{a_2}\\neq\\dfrac{b_1}{b_2}$ | solucion unica (compatible determinado) | rectas que se cortan |\n| $\\dfrac{a_1}{a_2}=\\dfrac{b_1}{b_2}\\neq\\dfrac{c_1}{c_2}$ | sin solucion (incompatible) | rectas paralelas |\n| $\\dfrac{a_1}{a_2}=\\dfrac{b_1}{b_2}=\\dfrac{c_1}{c_2}$ | infinitas soluciones | la misma recta |\n\n## 8. Segundo grado: mas alla de la formula\n\nPara $ax^2+bx+c=0$ con $a\\neq 0$:\n\n- Discriminante $\\Delta=b^2-4ac$: si $\\Delta>0$ hay dos raices reales distintas; si $\\Delta=0$ una raiz doble; si $\\Delta<0$ no hay raices reales.\n- **Suma y producto (Vieta):** $x_1+x_2=-\\dfrac{b}{a}$ y $x_1x_2=\\dfrac{c}{a}$. Sirve para armar la ecuacion a partir de sus raices o para resolver de cabeza.\n- **Vertice de la parabola:** $x_v=-\\dfrac{b}{2a}$; si $a>0$ abre hacia arriba y el vertice es el **minimo**.\n- **Ecuaciones reducibles:** bicuadradas ($x^4-5x^2+4=0$, cambia $u=x^2$) y con radicales (aisla la raiz, eleva al cuadrado y **verifica**: pueden aparecer soluciones falsas).\n\n## 9. Inecuaciones cuadraticas y racionales (metodo de signos)\n\nPara $x^2-x-6>0$: factoriza $(x-3)(x+2)>0$, marca las raices $-2$ y $3$ en la recta y evalua el signo en cada zona.\n\n| Zona | $x<-2$ | $-2<x<3$ | $x>3$ |\n|---|---|---|---|\n| Signo | $+$ | $-$ | $+$ |\n\nSolucion: $(-\\infty,-2)\\cup(3,\\infty)$.\n\n> [warn] En una inecuacion racional como $\\dfrac{x-1}{x+2}\\ge 0$ **nunca** multipliques cruzado: el signo del denominador es desconocido. Usa la tabla de signos y excluye siempre el valor que anula el denominador ($x=-2$).\n\n## 10. Valor absoluto: ecuaciones e inecuaciones\n\n$|x|$ es la **distancia al cero**, por eso nunca es negativo.\n\n- Ecuacion $|x|=k$ con $k\\ge 0$: se abre en dos casos, $x=k$ o $x=-k$.\n- Desigualdad $|x|<k$: equivale a $-k<x<k$, un **solo intervalo** (esta cerca del cero).\n- Desigualdad $|x|>k$: equivale a $x<-k$ **o** $x>k$, **dos rayos** (esta lejos del cero).\n- Si $k<0$: $|x|=k$ no tiene solucion y $|x|>k$ se cumple para todo real.\n\n**Ejemplo.** $|2x-1|\\le 5 \\Rightarrow -5\\le 2x-1\\le 5 \\Rightarrow -2\\le x\\le 3$.\n\n## Ejercicios resueltos tipo examen\n\n**1)** Resolver $\\dfrac{x}{2}-\\dfrac{x-1}{3}=2$. Multiplica todo por 6: $3x-2(x-1)=12 \\Rightarrow x+2=12 \\Rightarrow x=10$.\n\n**2)** Hallar $k$ para que $x^2+kx+9=0$ tenga raiz doble. $\\Delta=k^2-36=0 \\Rightarrow k=\\pm 6$.\n\n**3)** Sistema $\\begin{cases} 2x+3y=12 \\\\ x-y=1 \\end{cases}$. De la segunda $x=y+1$; sustituyendo: $2y+2+3y=12 \\Rightarrow y=2$, $x=3$.\n\n**4)** Resolver $|3-x|>4$: $3-x>4$ o $3-x<-4$, es decir $x<-1$ o $x>7$.\n\n@@CHAPTER mat|m3|📐|Geometría plana\n## Los cimientos (Moise & Downs)\n- **Postulado de la regla:** a cada punto de una recta le corresponde un número real; la **distancia** entre dos puntos es el valor absoluto de la diferencia de sus coordenadas.\n- Por dos puntos distintos pasa **una única** recta.\n- **Punto medio:** el punto que divide un segmento en dos partes congruentes.\n- **Postulado de las paralelas:** por un punto exterior a una recta pasa exactamente una paralela a ella.\n\n## Ángulos: el vocabulario que se evalúa\n- **Complementarios:** suman $90^\\circ$. **Suplementarios:** suman $180^\\circ$.\n- **Opuestos por el vértice:** siempre congruentes.\n- **Par lineal:** dos ángulos adyacentes cuyos lados no comunes forman una recta → suplementarios.\n\n### Dos paralelas cortadas por una transversal\nSe forman 8 ángulos y solo hay **dos medidas**: $\\alpha$ y $180-\\alpha$.\n- **Correspondientes:** congruentes.\n- **Alternos internos** y **alternos externos:** congruentes.\n- **Conjugados (colaterales) internos:** suplementarios.\n\n> **Truco visual:** marca con el mismo color todos los ángulos «agudos» del dibujo y con otro los «obtusos». Cualquier pregunta se responde en segundos.\n\n## Triángulos\n- Suma de ángulos interiores: $180^\\circ$.\n- **Ángulo exterior** = suma de los dos interiores no adyacentes.\n- Desigualdad triangular: cada lado es menor que la suma de los otros dos.\n- Clasificación por lados: equilátero, isósceles, escaleno. Por ángulos: acutángulo, rectángulo, obtusángulo.\n- En un triángulo isósceles, **los ángulos de la base son congruentes** (y su recíproco también vale).\n\n### Congruencia (mismo tamaño y forma)\nCriterios: **LAL**, **ALA**, **LLL** y, en rectángulos, **hipotenusa-cateto**. ¡Cuidado! **LLA no es criterio** (caso ambiguo).\n\nEstrategia típica del examen: te dan $\\overline{AD} \\cong \\overline{AE}$ y $\\overline{AB} \\cong \\overline{AC}$ con un ángulo común → aplicas **LAL**, concluyes congruencia de triángulos y de ahí obtienes el ángulo pedido, casi siempre por **suplemento**.\n\n### Semejanza (misma forma, distinto tamaño)\nCriterios: **AA**, **LAL** de semejanza, **LLL** de semejanza.\n- Los lados homólogos son proporcionales: $\\frac{a'}{a} = \\frac{b'}{b} = \\frac{c'}{c} = k$.\n- Los perímetros están en razón $k$ y las **áreas en razón** $k^{2}$.\n- **Teorema de Tales:** rectas paralelas que cortan dos transversales determinan segmentos proporcionales.\n\n> **Analogía:** la semejanza es una fotocopia ampliada; la congruencia es una fotocopia al 100 %.\n\n## Teorema de Pitágoras y áreas\n$c^{2} = a^{2}+b^{2}$. Ternas útiles: (3,4,5), (5,12,13), (8,15,17), (7,24,25) y sus múltiplos.\n\nÁreas básicas: triángulo $\\frac{b\\cdot h}{2}$, rectángulo $b\\cdot h$, trapecio $\\frac{(B+b)h}{2}$, círculo $\\pi r^{2}$, longitud de circunferencia $2\\pi r$.\n\n## Cómo atacar un problema con figura\n1. **Redibuja** la figura en la hoja de apuntes.\n2. Escribe **todo** lo que sabes sobre el dibujo (marcas de congruencia, ángulos rectos).\n3. Busca triángulos congruentes o semejantes.\n4. Usa suma de ángulos y suplementos para cerrar el problema.\n## Axiomas que la EPN evalua textualmente (Moise & Downs)\n\n- **Axioma de la regla:** a cada punto de una recta se le puede asignar un numero real (su coordenada) de modo que la distancia entre dos puntos sea $|a-b|$.\n- **Axioma de adicion de distancias:** $B$ esta **entre** $A$ y $C$ si los tres son colineales y $AB+BC=AC$.\n- **Punto medio:** el unico punto $M$ con $AM=MB$; su coordenada es el promedio.\n- **Axioma de las paralelas (Playfair):** por un punto exterior a una recta pasa **exactamente una** paralela a ella.\n- **Postulado de la medida angular:** a cada angulo le corresponde un numero entre 0 y 180; angulos adyacentes suman sus medidas.\n\n## Angulos entre dos paralelas y una transversal\n\n| Pareja | Posicion | Relacion |\n|---|---|---|\n| Correspondientes | mismo lado, uno arriba y otro abajo | **iguales** |\n| Alternos internos | lados opuestos, entre las paralelas | **iguales** |\n| Alternos externos | lados opuestos, fuera de las paralelas | **iguales** |\n| Conjugados internos (colaterales) | mismo lado, entre las paralelas | **suman 180** |\n| Opuestos por el vertice | cruzados | **iguales** |\n| Adyacentes en linea recta | contiguos | **suman 180** |\n\n> [tip] Truco visual: en la figura clasica solo existen **dos** medidas, una \"aguda\" y una \"obtusa\", y siempre suman 180. Identifica cual es cada angulo y ya tienes la respuesta.\n\n## Congruencia de triangulos: los criterios exactos\n\nDos triangulos son congruentes ($\\cong$) si tienen igual forma **y** tamanio.\n\n| Criterio | Que se necesita |\n|---|---|\n| **LLL** | los tres lados iguales |\n| **LAL** | dos lados y el angulo **comprendido** |\n| **ALA** | dos angulos y el lado comun |\n| **LAA** | dos angulos y un lado no comprendido |\n| **HC (rectangulos)** | hipotenusa y un cateto |\n\n> [warn] **LLA no es criterio** (caso ambiguo). Si el angulo no esta entre los dos lados, pueden existir dos triangulos distintos.\n\n**Consecuencia clave:** si dos triangulos son congruentes, **todos** sus elementos correspondientes lo son (lados, angulos, alturas, medianas). En los items del examen se usa para justificar igualdades de segmentos.\n\n## Semejanza de triangulos y teorema de Tales\n\nSemejantes ($\\sim$) = misma forma, distinto tamanio. Criterios: **AA**, **LAL** (proporcional) y **LLL** (proporcional).\n\n- Razon de semejanza $k$: lados $\\times k$, **perimetros** $\\times k$, **areas** $\\times k^2$.\n- **Teorema de Tales:** toda paralela a un lado de un triangulo divide a los otros dos en segmentos proporcionales: $\\dfrac{AD}{DB}=\\dfrac{AE}{EC}$.\n- **Altura sobre la hipotenusa:** $h^2=m\\cdot n$ (media geometrica), $a^2=c\\cdot m$, y ademas $a\\cdot b=c\\cdot h$.\n\n**Ejemplo tipico:** una persona de 1,7 m proyecta 2 m de sombra; a la misma hora un poste proyecta 12 m. Por semejanza, $\\dfrac{1{,}7}{2}=\\dfrac{h}{12} \\Rightarrow h=10{,}2$ m.\n\n## Cuadrilateros, poligonos y circunferencia\n\n- Suma de angulos interiores de un poligono de $n$ lados: $180(n-2)$; exteriores siempre $360$.\n- Paralelogramo: lados opuestos iguales y paralelos, diagonales que se bisecan. Rombo: diagonales perpendiculares; area $=\\dfrac{D\\cdot d}{2}$.\n- Trapecio: area $=\\dfrac{(B+b)h}{2}$; la mediana mide $\\dfrac{B+b}{2}$.\n- Circunferencia: $L=2\\pi r$, area $=\\pi r^2$. **Angulo inscrito = mitad del central** que abarca el mismo arco; todo angulo inscrito en una semicircunferencia es recto.\n- Tangente a la circunferencia: siempre perpendicular al radio en el punto de contacto.\n\n## Ejercicios resueltos tipo examen\n\n**1)** Dos rectas paralelas cortadas por una transversal forman un angulo de $63$. El conjugado interno mide $180-63=117$.\n\n**2)** En un triangulo rectangulo los catetos miden 9 y 12. Hipotenusa: $\\sqrt{81+144}=15$. Altura sobre la hipotenusa: $h=\\dfrac{9\\cdot 12}{15}=7{,}2$.\n\n**3)** Dos triangulos semejantes tienen razon $k=3/5$. Si el area del menor es 18, el area del mayor es $18\\cdot\\left(\\dfrac{5}{3}\\right)^2=50$.\n\n**4)** Un poligono regular tiene angulos interiores de $150$. Entonces $\\dfrac{180(n-2)}{n}=150 \\Rightarrow n=12$ lados.\n\n@@CHAPTER mat|m4|📈|Trigonometría y geometría analítica\n## 1. Razones en el triángulo rectángulo\n$$\\sin\\alpha = \\frac{\\text{cateto opuesto}}{\\text{hipotenusa}}, \\quad \\cos\\alpha = \\frac{\\text{cateto adyacente}}{\\text{hipotenusa}}, \\quad \\tan\\alpha = \\frac{\\text{opuesto}}{\\text{adyacente}}$$\nRecíprocas: $\\csc = 1/\\sin$, $\\sec = 1/\\cos$, $\\cot = 1/\\tan$.\n\n> **Regla mnemotécnica:** SOH-CAH-TOA.\n\n## 2. Valores exactos que debes saber de memoria\n| ángulo | $30^\\circ$ | $45^\\circ$ | $60^\\circ$ |\n| --- | --- | --- | --- |\n| $\\sin$ | $\\frac{1}{2}$ | $\\frac{\\sqrt{2}}{2}$ | $\\frac{\\sqrt{3}}{2}$ |\n| $\\cos$ | $\\frac{\\sqrt{3}}{2}$ | $\\frac{\\sqrt{2}}{2}$ | $\\frac{1}{2}$ |\n| $\\tan$ | $\\frac{\\sqrt{3}}{3}$ | $1$ | $\\sqrt{3}$ |\n\n**Truco de la mano:** $\\sin$ de $0, 30, 45, 60, 90$ es $\\frac{\\sqrt{0}}{2}, \\frac{\\sqrt{1}}{2}, \\frac{\\sqrt{2}}{2}, \\frac{\\sqrt{3}}{2}, \\frac{\\sqrt{4}}{2}$.\n\n## 3. Circunferencia unitaria y signos\nEn el plano, $\\cos$ es la coordenada $x$ y $\\sin$ la coordenada $y$.\n- Cuadrante I: todo positivo. II: solo $\\sin$. III: solo $\\tan$. IV: solo $\\cos$.\n- Mnemotecnia: **T**odos, **S**enos, **T**angentes, **C**osenos.\n- Ángulo de referencia: el agudo que forma el lado terminal con el eje $x$. Calculas con él y luego pones el signo del cuadrante.\n\n#### Ejemplo\n$\\cos(210^\\circ)$: referencia $30^\\circ$, cuadrante III → coseno negativo → $-\\frac{\\sqrt{3}}{2}$.\n\n## 4. Identidades imprescindibles\n- Pitagóricas: $\\sin^{2}x + \\cos^{2}x = 1$; $1+\\tan^{2}x = \\sec^{2}x$; $1+\\cot^{2}x = \\csc^{2}x$.\n- Cociente: $\\tan x = \\frac{\\sin x}{\\cos x}$.\n- Ángulo doble: $\\sin 2x = 2\\sin x\\cos x$; $\\cos 2x = \\cos^{2}x - \\sin^{2}x$.\n- Suma: $\\sin(a\\pm b) = \\sin a\\cos b \\pm \\cos a\\sin b$; $\\cos(a\\pm b) = \\cos a\\cos b \\mp \\sin a\\sin b$.\n- Paridad: $\\sin(-x) = -\\sin x$ (impar), $\\cos(-x) = \\cos x$ (par).\n\n**Cómo simplificar:** convierte todo a senos y cosenos, busca $1-\\cos^{2}x = \\sin^{2}x$ y factoriza.\n\n## 5. Ley de senos y ley de cosenos\n$$\\frac{a}{\\sin A} = \\frac{b}{\\sin B} = \\frac{c}{\\sin C} \\qquad\\qquad a^{2} = b^{2}+c^{2}-2bc\\cos A$$\n- **Senos:** cuando conoces un lado y su ángulo opuesto (casos ALA, AAL, LLA).\n- **Cosenos:** cuando conoces dos lados y el ángulo entre ellos (LAL) o los tres lados (LLL).\n- Si $A = 90^\\circ$, la ley de cosenos se convierte en Pitágoras: es su versión general.\n\n## 6. La recta en el plano (Lehmann)\n- Pendiente: $m = \\dfrac{y_{2}-y_{1}}{x_{2}-x_{1}} = \\tan\\theta$.\n- Punto-pendiente: $y - y_{1} = m(x-x_{1})$. Pendiente-intersección: $y = mx+b$. General: $Ax+By+C=0$.\n- **Paralelas:** $m_{1}=m_{2}$. **Perpendiculares:** $m_{1}m_{2} = -1$.\n- Distancia entre puntos: $d = \\sqrt{(x_{2}-x_{1})^{2}+(y_{2}-y_{1})^{2}}$.\n- Punto medio: $\\left(\\frac{x_{1}+x_{2}}{2}, \\frac{y_{1}+y_{2}}{2}\\right)$.\n- Distancia de un punto a una recta: $d = \\dfrac{|Ax_{0}+By_{0}+C|}{\\sqrt{A^{2}+B^{2}}}$.\n\n## 7. La circunferencia\n- Canónica: $(x-h)^{2}+(y-k)^{2} = r^{2}$, centro $C(h,k)$, radio $r$.\n- General: $x^{2}+y^{2}+Dx+Ey+F = 0$. Se pasa a canónica **completando cuadrados**: $h = -\\frac{D}{2}$, $k = -\\frac{E}{2}$, $r = \\sqrt{h^{2}+k^{2}-F}$.\n\n#### Ejemplo\n$x^{2}+y^{2}-6x+4y-12=0 \\Rightarrow (x-3)^{2}+(y+2)^{2} = 25$: centro $(3,-2)$, radio 5.\n\n> **Error frecuente:** confundir $r^{2}$ con $r$. Si a la derecha aparece 25, el radio es 5.\n## 8. Grados, radianes y angulos de referencia\n\n$180^{\\circ}=\\pi$ rad. Para convertir, multiplica por $\\dfrac{\\pi}{180}$ o por $\\dfrac{180}{\\pi}$.\n\n| Grados | 30 | 45 | 60 | 90 | 180 | 270 |\n|---|---|---|---|---|---|---|\n| Radianes | $\\dfrac{\\pi}{6}$ | $\\dfrac{\\pi}{4}$ | $\\dfrac{\\pi}{3}$ | $\\dfrac{\\pi}{2}$ | $\\pi$ | $\\dfrac{3\\pi}{2}$ |\n\n**Reduccion al primer cuadrante:** el valor absoluto de la razon es el del angulo de referencia; el signo lo da el cuadrante (regla **CAST**: en I todas positivas, en II solo seno, en III solo tangente, en IV solo coseno).\n\nEjemplo: $\\cos 210^{\\circ}=-\\cos 30^{\\circ}=-\\dfrac{\\sqrt{3}}{2}$.\n\n## 9. Identidades que hay que reconocer al vuelo\n\n- Pitagoricas: $\\sin^2\\theta+\\cos^2\\theta=1$, $1+\\tan^2\\theta=\\sec^2\\theta$, $1+\\cot^2\\theta=\\csc^2\\theta$.\n- Suma y resta: $\\sin(a\\pm b)=\\sin a\\cos b\\pm\\cos a\\sin b$; $\\cos(a\\pm b)=\\cos a\\cos b\\mp\\sin a\\sin b$.\n- Angulo doble: $\\sin 2a=2\\sin a\\cos a$; $\\cos 2a=\\cos^2 a-\\sin^2 a=1-2\\sin^2 a$.\n- Paridad: $\\sin(-x)=-\\sin x$ (impar), $\\cos(-x)=\\cos x$ (par).\n\n> [tip] Para **demostrar** identidades: trabaja un solo lado, pasa todo a senos y cosenos y busca la pitagorica. Nunca muevas terminos de un lado a otro como si fuera ecuacion.\n\n**Ecuaciones trigonometricas basicas:** $2\\sin x-1=0 \\Rightarrow \\sin x=\\dfrac{1}{2} \\Rightarrow x=30^{\\circ}$ o $x=150^{\\circ}$ en $[0,360^{\\circ})$. Recuerda dar **todas** las soluciones del intervalo pedido.\n\n## 10. Ley de senos y de cosenos: cuando usar cada una\n\n| Datos conocidos | Ley a usar |\n|---|---|\n| LAL (dos lados y el angulo entre ellos) | **cosenos** |\n| LLL (tres lados) | **cosenos** (para hallar un angulo) |\n| ALA o AAL | **senos** |\n| LLA (dos lados y angulo opuesto) | **senos** (caso ambiguo: revisa si hay dos soluciones) |\n\n$\\dfrac{a}{\\sin A}=\\dfrac{b}{\\sin B}=\\dfrac{c}{\\sin C}$, y $a^2=b^2+c^2-2bc\\cos A$.\n\n**Area del triangulo:** $A=\\dfrac{1}{2}ab\\sin C$ y, con los tres lados, Heron: $A=\\sqrt{s(s-a)(s-b)(s-c)}$ con $s=\\dfrac{a+b+c}{2}$.\n\n## 11. La recta: todas las formas y las distancias\n\n| Forma | Ecuacion |\n|---|---|\n| Punto-pendiente | $y-y_1=m(x-x_1)$ |\n| Pendiente-ordenada | $y=mx+b$ |\n| General | $Ax+By+C=0$, con $m=-\\dfrac{A}{B}$ |\n| Simetrica | $\\dfrac{x}{a}+\\dfrac{y}{b}=1$ |\n\n- Pendiente entre dos puntos: $m=\\dfrac{y_2-y_1}{x_2-x_1}$.\n- **Paralelas:** $m_1=m_2$. **Perpendiculares:** $m_1\\cdot m_2=-1$.\n- Distancia entre puntos: $d=\\sqrt{(x_2-x_1)^2+(y_2-y_1)^2}$. Punto medio: promedio de coordenadas.\n- Distancia de un punto a una recta: $d=\\dfrac{|Ax_0+By_0+C|}{\\sqrt{A^2+B^2}}$.\n- Angulo entre rectas: $\\tan\\theta=\\left|\\dfrac{m_2-m_1}{1+m_1m_2}\\right|$.\n\n## 12. La circunferencia en el plano\n\nCanonica: $(x-h)^2+(y-k)^2=r^2$, centro $(h,k)$ y radio $r$.\n\nDe la general $x^2+y^2+Dx+Ey+F=0$ se pasa a la canonica **completando cuadrados**: centro $\\left(-\\dfrac{D}{2},-\\dfrac{E}{2}\\right)$ y $r=\\sqrt{\\dfrac{D^2+E^2-4F}{4}}$.\n\n**Ejemplo.** $x^2+y^2-6x+4y-12=0 \\Rightarrow (x-3)^2+(y+2)^2=25$: centro $(3,-2)$, radio 5.\n\nPosicion de una recta respecto a la circunferencia: compara la distancia del centro a la recta con $r$ (mayor: exterior; igual: tangente; menor: secante).\n\n## Ejercicios resueltos tipo examen\n\n**1)** Si $\\sin\\theta=\\dfrac{3}{5}$ y $\\theta$ esta en el segundo cuadrante, entonces $\\cos\\theta=-\\dfrac{4}{5}$ y $\\tan\\theta=-\\dfrac{3}{4}$.\n\n**2)** Un triangulo tiene $b=8$, $c=5$ y $A=60^{\\circ}$. Entonces $a^2=64+25-2(8)(5)(0{,}5)=49$, luego $a=7$.\n\n**3)** Recta que pasa por $(2,-1)$ y es perpendicular a $y=\\dfrac{2}{3}x+4$: la pendiente buscada es $-\\dfrac{3}{2}$, y la recta es $y+1=-\\dfrac{3}{2}(x-2)$, o sea $3x+2y-4=0$.\n\n**4)** Distancia del punto $(1,2)$ a la recta $3x-4y+5=0$: $d=\\dfrac{|3-8+5|}{5}=0$, o sea el punto **pertenece** a la recta.\n\n## 13. Las seis razones trigonometricas (incluye tangente, secante, cosecante y cotangente)\n\nEn un triangulo rectangulo con angulo agudo $\\theta$, cateto **opuesto** $co$, cateto **adyacente** $ca$ e **hipotenusa** $h$:\n\n| Razon | Definicion con lados | Definicion reciproca | Con coordenadas $(x,y)$ y $r=\\sqrt{x^2+y^2}$ |\n|---|---|---|---|\n| Seno | $\\sin\\theta=\\dfrac{co}{h}$ | $\\sin\\theta=\\dfrac{1}{\\csc\\theta}$ | $y/r$ |\n| Coseno | $\\cos\\theta=\\dfrac{ca}{h}$ | $\\cos\\theta=\\dfrac{1}{\\sec\\theta}$ | $x/r$ |\n| Tangente | $\\tan\\theta=\\dfrac{co}{ca}$ | $\\tan\\theta=\\dfrac{\\sin\\theta}{\\cos\\theta}=\\dfrac{1}{\\cot\\theta}$ | $y/x$ |\n| Cotangente | $\\cot\\theta=\\dfrac{ca}{co}$ | $\\cot\\theta=\\dfrac{\\cos\\theta}{\\sin\\theta}=\\dfrac{1}{\\tan\\theta}$ | $x/y$ |\n| Secante | $\\sec\\theta=\\dfrac{h}{ca}$ | $\\sec\\theta=\\dfrac{1}{\\cos\\theta}$ | $r/x$ |\n| Cosecante | $\\csc\\theta=\\dfrac{h}{co}$ | $\\csc\\theta=\\dfrac{1}{\\sin\\theta}$ | $r/y$ |\n\n> [tip] **Truco para no confundirte:** la reciproca del **se**no es la **cose**cante y la del **cose**no es la **se**cante (se cruzan). La tangente y la cotangente si se emparejan de forma directa.\n\n**Analogia.** Piensa en una rampa. El **seno** dice que tan alto subes por cada metro de rampa, el **coseno** cuanto avanzas en horizontal por cada metro de rampa y la **tangente** es la pendiente pura: cuanto subes por cada metro que avanzas. La **cotangente** es la pendiente al reves (cuanto avanzas por cada metro que subes), la **secante** compara la rampa con el avance horizontal y la **cosecante** compara la rampa con la altura.\n\n### Dominio: cuando cada una no existe\n\nUna razon reciproca **no esta definida** si su denominador vale cero:\n\n- $\\tan\\theta$ y $\\sec\\theta$ no existen donde $\\cos\\theta=0$, es decir en $90^\\circ$, $270^\\circ$ ($\\theta=\\frac{\\pi}{2}+k\\pi$).\n- $\\cot\\theta$ y $\\csc\\theta$ no existen donde $\\sin\\theta=0$, es decir en $0^\\circ$, $180^\\circ$, $360^\\circ$ ($\\theta=k\\pi$).\n\n**Rangos:** $-1\\le\\sin\\theta\\le 1$ y $-1\\le\\cos\\theta\\le 1$; en cambio $|\\sec\\theta|\\ge 1$ y $|\\csc\\theta|\\ge 1$ (nunca valen entre $-1$ y $1$), mientras que $\\tan\\theta$ y $\\cot\\theta$ toman **cualquier** valor real.\n\n> [warn] Un item clasico: \"puede $\\sec\\theta=0{,}5$?\" La respuesta es **no**, porque la secante nunca esta entre $-1$ y $1$.\n\n### Tabla de valores exactos de las seis razones\n\n| $\\theta$ | $\\sin$ | $\\cos$ | $\\tan$ | $\\cot$ | $\\sec$ | $\\csc$ |\n|---|---|---|---|---|---|---|\n| $0^\\circ$ | $0$ | $1$ | $0$ | no existe | $1$ | no existe |\n| $30^\\circ$ | $\\frac{1}{2}$ | $\\frac{\\sqrt{3}}{2}$ | $\\frac{\\sqrt{3}}{3}$ | $\\sqrt{3}$ | $\\frac{2\\sqrt{3}}{3}$ | $2$ |\n| $45^\\circ$ | $\\frac{\\sqrt{2}}{2}$ | $\\frac{\\sqrt{2}}{2}$ | $1$ | $1$ | $\\sqrt{2}$ | $\\sqrt{2}$ |\n| $60^\\circ$ | $\\frac{\\sqrt{3}}{2}$ | $\\frac{1}{2}$ | $\\sqrt{3}$ | $\\frac{\\sqrt{3}}{3}$ | $2$ | $\\frac{2\\sqrt{3}}{3}$ |\n| $90^\\circ$ | $1$ | $0$ | no existe | $0$ | no existe | $1$ |\n\n### Signos por cuadrante (regla CAST ampliada)\n\n| Cuadrante | Positivas | Negativas |\n|---|---|---|\n| I | las seis | ninguna |\n| II | $\\sin$, $\\csc$ | $\\cos$, $\\sec$, $\\tan$, $\\cot$ |\n| III | $\\tan$, $\\cot$ | $\\sin$, $\\csc$, $\\cos$, $\\sec$ |\n| IV | $\\cos$, $\\sec$ | $\\sin$, $\\csc$, $\\tan$, $\\cot$ |\n\nCada razon tiene **el mismo signo que su reciproca**, siempre.\n\n### Cofunciones y paridad\n\n- Cofunciones (angulos complementarios): $\\sin(90^\\circ-\\theta)=\\cos\\theta$, $\\tan(90^\\circ-\\theta)=\\cot\\theta$, $\\sec(90^\\circ-\\theta)=\\csc\\theta$.\n- Paridad: $\\cos$ y $\\sec$ son **pares** ($\\cos(-\\theta)=\\cos\\theta$); $\\sin$, $\\csc$, $\\tan$ y $\\cot$ son **impares** ($\\tan(-\\theta)=-\\tan\\theta$).\n- Periodo: $\\sin$, $\\cos$, $\\sec$ y $\\csc$ se repiten cada $360^\\circ$; $\\tan$ y $\\cot$ cada $180^\\circ$.\n\n### Identidades donde aparecen sec, csc y cot\n\n- $1+\\tan^2\\theta=\\sec^2\\theta$ (divide $\\sin^2+\\cos^2=1$ entre $\\cos^2\\theta$).\n- $1+\\cot^2\\theta=\\csc^2\\theta$ (divide la misma identidad entre $\\sin^2\\theta$).\n- $\\tan\\theta\\cdot\\cot\\theta=1$, $\\sin\\theta\\cdot\\csc\\theta=1$, $\\cos\\theta\\cdot\\sec\\theta=1$.\n\n> [tip] **Estrategia infalible para simplificar.** Si una expresion mezcla $\\sec$, $\\csc$, $\\tan$ y $\\cot$, conviertelo **todo a senos y cosenos**, simplifica la fraccion compuesta y al final vuelve a la razon que pida la respuesta.\n\n### Ejercicios resueltos\n\n**1)** Si $\\sin\\theta=\\frac{3}{5}$ y $\\theta$ esta en el cuadrante II, halla las seis razones.\nCon $\\sin^2+\\cos^2=1$: $\\cos\\theta=-\\frac{4}{5}$ (negativo en II). Entonces $\\tan\\theta=-\\frac{3}{4}$, $\\cot\\theta=-\\frac{4}{3}$, $\\sec\\theta=-\\frac{5}{4}$ y $\\csc\\theta=\\frac{5}{3}$.\n\n**2)** Simplifica $\\dfrac{\\sec\\theta}{\\csc\\theta}$.\n$\\dfrac{1/\\cos\\theta}{1/\\sin\\theta}=\\dfrac{\\sin\\theta}{\\cos\\theta}=\\tan\\theta$.\n\n**3)** Demuestra que $\\csc\\theta-\\sin\\theta=\\cos\\theta\\cot\\theta$.\n$\\csc\\theta-\\sin\\theta=\\dfrac{1-\\sin^2\\theta}{\\sin\\theta}=\\dfrac{\\cos^2\\theta}{\\sin\\theta}=\\cos\\theta\\cdot\\dfrac{\\cos\\theta}{\\sin\\theta}=\\cos\\theta\\cot\\theta$.\n\n**4)** Si $\\sec\\theta=\\frac{13}{5}$ con $\\theta$ en el cuadrante IV, halla $\\cot\\theta$.\n$\\cos\\theta=\\frac{5}{13}$, luego $\\sin\\theta=-\\frac{12}{13}$ (negativo en IV), $\\tan\\theta=-\\frac{12}{5}$ y $\\cot\\theta=-\\frac{5}{12}$.\n\n**5)** Resuelve $2\\cos\\theta=\\sec\\theta$ en $[0^\\circ,360^\\circ)$.\n$2\\cos\\theta=\\frac{1}{\\cos\\theta}\\Rightarrow 2\\cos^2\\theta=1\\Rightarrow \\cos\\theta=\\pm\\frac{\\sqrt2}{2}$, es decir $\\theta=45^\\circ,135^\\circ,225^\\circ,315^\\circ$.\n\n@@CHAPTER fis|f1|🚀|Inercia y movimiento\n## 1. Primera ley de Newton (inercia)\n> Todo cuerpo permanece en reposo o en movimiento rectilíneo uniforme **mientras la fuerza neta sobre él sea cero**.\n\n**Analogía:** el pasajero del bus que se va hacia adelante cuando el chofer frena no es empujado por nada: su cuerpo simplemente **quiere seguir**. La inercia es la «terquedad» de la materia y su medida es la **masa**.\n\nConsecuencias que se evalúan:\n- Velocidad constante $\\Rightarrow$ fuerza neta cero (no significa «sin fuerzas», sino que se cancelan).\n- Un cuerpo en equilibrio puede estar quieto (**equilibrio estático**) o moverse con velocidad constante (**equilibrio dinámico**).\n\n## 2. Fuerza como vector\nLa fuerza tiene magnitud, dirección y sentido; se suma **vectorialmente**.\n- Misma dirección y sentido: se suman. Sentidos opuestos: se restan.\n- Perpendiculares: $R = \\sqrt{F_{1}^{2}+F_{2}^{2}}$.\n- Ángulo cualquiera: $R = \\sqrt{F_{1}^{2}+F_{2}^{2}+2F_{1}F_{2}\\cos\\theta}$.\n- Componentes: $F_{x} = F\\cos\\theta$, $F_{y} = F\\sin\\theta$.\n\n**Condición de equilibrio:** $\\sum F_{x} = 0$ y $\\sum F_{y} = 0$.\n\n## 3. Cinemática rectilínea: el vocabulario exacto\n- **Distancia**: longitud total recorrida (escalar, nunca disminuye).\n- **Desplazamiento**: cambio de posición $\\Delta x$ (vector; puede ser cero aunque hayas caminado mucho).\n- **Rapidez**: escalar, $\\frac{\\text{distancia}}{\\text{tiempo}}$. **Velocidad**: vector, $\\frac{\\Delta x}{\\Delta t}$.\n- **Aceleración**: $a = \\frac{\\Delta v}{\\Delta t}$. Si $a$ y $v$ tienen el mismo signo, el cuerpo acelera; si tienen signos opuestos, frena.\n\n### Ecuaciones del MRUV\n$$v = v_{0}+at \\qquad d = v_{0}t+\\tfrac{1}{2}at^{2} \\qquad v^{2} = v_{0}^{2}+2ad$$\nMRU es el caso $a = 0$: $d = vt$.\n\n**Gráficas (muy preguntadas):**\n- En $x$-$t$, la **pendiente** es la velocidad.\n- En $v$-$t$, la **pendiente** es la aceleración y el **área bajo la curva** es el desplazamiento.\n\n## 4. Caída libre\nTodos los cuerpos caen con la misma aceleración $g \\approx 9{,}8\\,\\mathrm{m/s^{2}}$ si se desprecia el aire (Galileo tenía razón: la pluma y el martillo llegan juntos en la Luna).\n$$v = gt \\qquad h = \\tfrac{1}{2}gt^{2} \\qquad v^{2} = 2gh$$\nSubida y bajada son simétricas: sube y baja en el mismo tiempo y llega con la misma rapidez.\n\n## 5. Proyectiles\nSe descompone en dos movimientos **independientes**:\n- Horizontal: MRU, $x = v_{0}\\cos\\theta \\cdot t$.\n- Vertical: caída libre, $y = v_{0}\\sin\\theta \\cdot t - \\frac{1}{2}gt^{2}$.\n\nFórmulas útiles (lanzamiento y caída al mismo nivel):\n$$t_{vuelo} = \\frac{2v_{0}\\sin\\theta}{g}, \\quad h_{max} = \\frac{(v_{0}\\sin\\theta)^{2}}{2g}, \\quad R = \\frac{v_{0}^{2}\\sin(2\\theta)}{g}$$\nEl alcance máximo se logra con $\\theta = 45^\\circ$; $30^\\circ$ y $60^\\circ$ dan el mismo alcance.\n\n> **Clave conceptual:** en el punto más alto la velocidad **no es cero**: la componente vertical sí, pero la horizontal se mantiene.\n\n## 6. Satélites\nUn satélite es un proyectil que «cae» permanentemente pero nunca llega al suelo porque la Tierra se curva bajo él. Está en **caída libre continua**; por eso los astronautas «flotan» (ingravidez aparente, no ausencia de gravedad).\n## 7. Vectores: componentes y suma\n\nUna fuerza (o velocidad) tiene **magnitud, direccion y sentido**. Para sumar vectores:\n\n- Descompon: $F_x=F\\cos\\theta$, $F_y=F\\sin\\theta$.\n- Suma por componentes: $R_x=\\sum F_x$, $R_y=\\sum F_y$.\n- Recompon: $R=\\sqrt{R_x^2+R_y^2}$ y $\\tan\\theta=\\dfrac{R_y}{R_x}$.\n- Perpendiculares clasicas: 3 y 4 dan 5; 6 y 8 dan 10.\n\n> [tip] Dos fuerzas de magnitudes $A$ y $B$ dan una resultante entre $|A-B|$ (opuestas) y $A+B$ (mismo sentido). Si una opcion se sale de ese rango, es incorrecta sin hacer cuentas.\n\n## 8. Equilibrio estatico y dinamico\n\nEquilibrio significa **aceleracion cero**, no necesariamente reposo:\n\n$$\\sum F_x=0 \\quad y \\quad \\sum F_y=0$$\n\n- Estatico: el cuerpo esta en reposo (un cuadro colgado, una lampara con dos cables).\n- Dinamico: se mueve con velocidad **constante** (un ascensor a rapidez fija, un paracaidista con velocidad terminal).\n\n**Diagrama de cuerpo libre (DCL):** dibuja solo las fuerzas **sobre** el cuerpo (peso, normal, tension, friccion, fuerza aplicada). Nunca dibujes \"la fuerza del movimiento\": no existe.\n\n## 9. Cinematica: formulas y graficos\n\n| Movimiento | Formulas |\n|---|---|\n| MRU ($a=0$) | $x=x_0+vt$ |\n| MRUA | $v=v_0+at$; $x=x_0+v_0t+\\dfrac{1}{2}at^2$; $v^2=v_0^2+2a\\Delta x$ |\n| Velocidad media | $v_m=\\dfrac{\\Delta x}{\\Delta t}$ (con desplazamiento, no distancia) |\n\n**Lectura de graficos (muy preguntado):**\n\n| Grafico | La pendiente es | El area bajo la curva es |\n|---|---|---|\n| posicion vs tiempo | la velocidad | (no se usa) |\n| velocidad vs tiempo | la aceleracion | el desplazamiento |\n| aceleracion vs tiempo | (no se usa) | el cambio de velocidad |\n\n> [warn] **Distancia vs desplazamiento:** si vas 30 m al este y regresas 30 m, la distancia recorrida es 60 m pero el desplazamiento es 0, y la velocidad media tambien es 0 (aunque la rapidez media no).\n\n## 10. Caida libre y proyectiles al detalle\n\nCon $g=9{,}8\\ \\mathrm{m/s^2}$ (a menudo se usa 10 para estimar):\n\n- Caida desde el reposo: $v=gt$, $h=\\dfrac{1}{2}gt^2$.\n- Tiro vertical: sube y baja simetricamente; en el punto mas alto $v=0$ pero **la aceleracion sigue siendo $g$**.\n- Proyectil: el movimiento horizontal es MRU ($x=v_0\\cos\\theta\\, t$) y el vertical es caida libre. Ambos comparten **el mismo tiempo**.\n  - Tiempo de vuelo: $t=\\dfrac{2v_0\\sin\\theta}{g}$.\n  - Altura maxima: $H=\\dfrac{v_0^2\\sin^2\\theta}{2g}$.\n  - Alcance: $R=\\dfrac{v_0^2\\sin 2\\theta}{g}$; el alcance maximo se logra con $45^{\\circ}$, y angulos complementarios (30 y 60) dan el mismo alcance.\n\n**Analogia:** un proyectil es una piedra que avanza a velocidad constante mientras cae; su trayectoria es una parabola porque combina lo constante con lo acelerado.\n\n## 11. Satelites y orbitas\n\nUn satelite es un proyectil que \"cae\" continuamente pero avanza tan rapido que la Tierra se curva bajo el. La fuerza gravitacional hace de fuerza centripeta:\n\n$$\\frac{GMm}{r^2}=\\frac{mv^2}{r} \\ \\Rightarrow \\ v=\\sqrt{\\frac{GM}{r}}$$\n\nA mayor radio de orbita, **menor** rapidez orbital y mayor periodo. En orbita hay ingravidez aparente porque satelite y astronauta caen con la misma aceleracion.\n\n## Ejercicios resueltos tipo examen\n\n**1)** Un auto pasa de 0 a 20 m/s en 5 s: $a=4\\ \\mathrm{m/s^2}$ y recorre $x=\\dfrac{1}{2}(4)(25)=50$ m.\n\n**2)** Se lanza una piedra hacia arriba a 20 m/s. Sube durante $t=\\dfrac{20}{10}=2$ s y alcanza $H=\\dfrac{20^2}{2(10)}=20$ m.\n\n**3)** Desde 45 m de altura se lanza horizontalmente un objeto a 10 m/s. Cae en $t=\\sqrt{\\dfrac{2h}{g}}=3$ s y aterriza a 30 m de la base.\n\n**4)** Dos fuerzas perpendiculares de 30 N y 40 N sobre un cuerpo de 10 kg: $R=50$ N y $a=5\\ \\mathrm{m/s^2}$.\n\n@@CHAPTER fis|f2|🎯|Segunda y tercera leyes de Newton\n## 1. Segunda ley\n$$\\vec{F}_{neta} = m\\vec{a}$$\nLa aceleración es **directamente proporcional** a la fuerza neta e **inversamente proporcional** a la masa. Unidad: $1\\,\\text{N} = 1\\,\\mathrm{kg\\cdot m/s^{2}}$.\n\n**Receta infalible para problemas de dinámica:**\n1. Dibuja el **diagrama de cuerpo libre** (solo las fuerzas que actúan **sobre** el cuerpo).\n2. Elige ejes (conviene uno paralelo al movimiento).\n3. Escribe $\\sum F = ma$ en cada eje.\n4. Despeja.\n\n## 2. Peso, masa y normal\n- **Masa**: cantidad de materia, en kg, la misma en todo el universo.\n- **Peso**: fuerza $W = mg$, en newtons, cambia con el planeta.\n- **Normal**: fuerza perpendicular que ejerce la superficie. En un piso horizontal sin fuerzas verticales extra, $N = mg$; en un ascensor que sube acelerando, $N = m(g+a)$.\n\n## 3. Gravitación universal\n$$F = G\\frac{m_{1}m_{2}}{r^{2}}, \\qquad G = 6{,}674\\times10^{-11}\\,\\mathrm{N\\,m^{2}/kg^{2}}$$\nLey del **inverso del cuadrado**: si la distancia se duplica, la fuerza se reduce a la cuarta parte; si se triplica, a la novena.\n\n## 4. Rozamiento y resistencia del aire\n- Estático: $f_{s} \\leq \\mu_{s}N$ (se ajusta hasta un máximo).\n- Cinético: $f_{k} = \\mu_{k}N$ (constante mientras desliza).\n- Siempre se opone al **movimiento relativo**; no depende del área de contacto ni de la rapidez (modelo básico).\n\nEn un plano inclinado sin rozamiento: $a = g\\sin\\theta$; con rozamiento: $a = g(\\sin\\theta - \\mu\\cos\\theta)$.\n\n**Velocidad límite:** al caer, la resistencia del aire crece con la rapidez hasta igualar al peso; entonces la fuerza neta es cero y el cuerpo cae con velocidad **constante**. Por eso el paracaidista deja de acelerar.\n\n## 5. Tercera ley\n> A toda acción corresponde una reacción de igual magnitud, misma dirección y sentido opuesto, **aplicada sobre otro cuerpo**.\n\nLa clave del examen: **las fuerzas de acción y reacción nunca se anulan entre sí** porque actúan sobre cuerpos distintos. El piso te empuja hacia adelante porque tú empujas al piso hacia atrás; el cohete avanza porque expulsa gases.\n\n## 6. Movimiento circular uniforme\nRapidez constante, dirección cambiante ⇒ **hay aceleración** (centrípeta):\n$$a_{c} = \\frac{v^{2}}{R}, \\qquad F_{c} = \\frac{mv^{2}}{R}, \\qquad v = \\frac{2\\pi R}{T}$$\nLa fuerza centrípeta **no es una fuerza nueva**: es el nombre del papel que cumple la tensión, el rozamiento o la gravedad. La «fuerza centrífuga» que sientes en la curva es un efecto de la inercia, no una fuerza real.\n\n## 7. Momento lineal e impulso\n$$\\vec{p} = m\\vec{v}, \\qquad \\vec{J} = \\vec{F}\\Delta t = \\Delta\\vec{p}$$\n**Conservación:** si la fuerza externa neta es cero, $p_{antes} = p_{después}$.\n- Choque **perfectamente inelástico** (quedan unidos): $m_{1}v_{1}+m_{2}v_{2} = (m_{1}+m_{2})v_{f}$.\n- Choque **elástico**: se conservan momento **y** energía cinética.\n\n> **Aplicación cotidiana:** el airbag alarga $\\Delta t$; como $\\Delta p$ es el mismo, la fuerza sobre tu cuerpo disminuye. Esa es toda la física de la seguridad vial.\n## 8. Plano inclinado y sistemas con cuerdas\n\nEn un plano de inclinacion $\\theta$ (sin friccion): la componente que acelera es $mg\\sin\\theta$ y la normal vale $N=mg\\cos\\theta$, asi que $a=g\\sin\\theta$ (no depende de la masa).\n\nCon friccion cinetica: $a=g(\\sin\\theta-\\mu_k\\cos\\theta)$. Un bloque permanece en reposo mientras $\\tan\\theta\\le\\mu_s$.\n\n**Dos bloques unidos por una cuerda** (maquina de Atwood o bloque sobre mesa): trata el sistema completo para hallar $a=\\dfrac{F_{neta}}{m_{total}}$ y luego aisla un bloque para hallar la tension.\n\n## 9. Gravitacion universal\n\n$$F=G\\frac{m_1m_2}{r^2}, \\quad G=6{,}67\\times 10^{-11}\\ \\mathrm{N\\,m^2/kg^2}$$\n\n- Ley del **inverso del cuadrado**: al triplicar la distancia, la fuerza cae 9 veces.\n- Peso $=mg$ con $g=\\dfrac{GM}{r^2}$. En la Luna $g$ es aproximadamente $1{,}6\\ \\mathrm{m/s^2}$: tu masa no cambia, tu peso si.\n- Las mareas y la orbita lunar son consecuencia directa de esta ley.\n\n## 10. Rozamiento y resistencia del aire\n\n| Tipo | Formula | Comportamiento |\n|---|---|---|\n| Estatica | $f_s\\le\\mu_s N$ | se ajusta hasta un maximo |\n| Cinetica | $f_k=\\mu_k N$ | practicamente constante |\n\nSiempre $\\mu_s>\\mu_k$: cuesta mas arrancar que mantener el movimiento.\n\n**Caida con resistencia del aire:** la fuerza de arrastre crece con la rapidez hasta igualar el peso; ahi la aceleracion se vuelve cero y se alcanza la **velocidad terminal**. Por eso un paracaidista con paracaidas abierto baja a rapidez constante: esta en equilibrio dinamico.\n\n## 11. Tercera ley bien entendida\n\nLas fuerzas de accion y reaccion:\n\n- son de **igual magnitud y sentido opuesto**,\n- actuan sobre **cuerpos distintos** (por eso nunca se cancelan entre si),\n- existen simultaneamente.\n\n> [warn] El error clasico: \"si el caballo tira de la carreta con la misma fuerza con que la carreta tira de el, nada se mueve\". Falso: esas fuerzas actuan sobre cuerpos diferentes. Lo que mueve a la carreta es la fuerza **del caballo sobre la carreta**, comparada con la friccion del suelo.\n\n## 12. Movimiento circular uniforme\n\n| Magnitud | Formula |\n|---|---|\n| Rapidez tangencial | $v=\\dfrac{2\\pi r}{T}$ |\n| Aceleracion centripeta | $a_c=\\dfrac{v^2}{r}=\\omega^2 r$ |\n| Fuerza centripeta | $F_c=\\dfrac{mv^2}{r}$ |\n| Frecuencia | $f=\\dfrac{1}{T}$ |\n\nEn MCU la rapidez es constante pero la **velocidad cambia** (cambia de direccion), por eso hay aceleracion dirigida al centro. La \"fuerza centrifuga\" no es una fuerza real: es la inercia vista desde el sistema que gira.\n\n## 13. Momento lineal, impulso y choques\n\n$$p=mv, \\qquad J=F\\Delta t=\\Delta p$$\n\n- **Conservacion:** si no hay fuerzas externas netas, $p_{inicial}=p_{final}$ (sirve en choques y explosiones).\n- Choque **elastico**: se conservan momento **y** energia cinetica.\n- Choque **inelastico**: se conserva el momento; parte de la energia se disipa. Si quedan unidos, $m_1v_1+m_2v_2=(m_1+m_2)v_f$.\n- El airbag y flexionar las rodillas al caer alargan $\\Delta t$, lo que **reduce la fuerza** para el mismo cambio de momento.\n\n## Ejercicios resueltos tipo examen\n\n**1)** Sobre 4 kg actua una fuerza neta de 12 N: $a=3\\ \\mathrm{m/s^2}$.\n\n**2)** Bloque de 10 kg sobre superficie horizontal con $\\mu_k=0{,}2$, empujado con 30 N: $f_k=0{,}2(100)=20$ N, $F_{neta}=10$ N, $a=1\\ \\mathrm{m/s^2}$.\n\n**3)** Un carro de 2 kg a 3 m/s choca y queda unido a otro de 1 kg en reposo: $v_f=\\dfrac{2(3)}{3}=2$ m/s.\n\n**4)** Una piedra de 0,5 kg gira en circulo de 2 m a 4 m/s: $F_c=\\dfrac{0{,}5(16)}{2}=4$ N.\n\n@@CHAPTER fis|f3|⚡|Energía, trabajo y potencia\n## 1. Trabajo\n$$W = F\\,d\\cos\\theta$$\n- $\\theta = 0^\\circ$ → trabajo máximo positivo. $\\theta = 90^\\circ$ → **trabajo cero**. $\\theta = 180^\\circ$ → trabajo negativo (el rozamiento).\n- Unidad: joule, $1\\,\\text{J} = 1\\,\\text{N}\\cdot\\text{m}$.\n\n> Cargar una caja caminando horizontalmente **no** realiza trabajo sobre ella (la fuerza es vertical y el desplazamiento horizontal), por muy cansado que resulte.\n\n## 2. Potencia\n$$P = \\frac{W}{t} = Fv$$\nUnidad: watt. Potencia es **rapidez para hacer trabajo**: subir la escalera corriendo o caminando implica el mismo trabajo, pero distinta potencia.\n\n## 3. Energía cinética y teorema trabajo-energía\n$$E_{c} = \\tfrac{1}{2}mv^{2}, \\qquad W_{neto} = \\Delta E_{c} = E_{c,f}-E_{c,i}$$\nLa dependencia con $v^{2}$ explica por qué duplicar la rapidez **cuadruplica** la distancia de frenado.\n\n## 4. Fuerzas conservativas y energía potencial\nUna fuerza es **conservativa** si el trabajo que hace no depende del camino (gravedad, resorte). El rozamiento es **no conservativa**: disipa energía como calor.\n$$E_{p} = mgh \\qquad E_{p,el} = \\tfrac{1}{2}kx^{2}$$\n\n## 5. Conservación de la energía mecánica\n$$E_{m} = E_{c}+E_{p} = \\text{constante (sin rozamiento)}$$\nDe ahí sale el resultado estrella: un cuerpo que cae desde una altura $h$ llega con\n$$v = \\sqrt{2gh}$$\nsin importar su masa.\n\nSi hay rozamiento: $E_{m,i} - E_{m,f} = |W_{rozamiento}|$.\n\n> **Analogía de la montaña rusa:** la energía potencial es «dinero en el banco» y la cinética es «dinero en efectivo». Sin rozamiento solo cambias de cuenta; con rozamiento pagas una comisión en forma de calor.\n\n## 6. Fuentes de energía\n- **Renovables:** solar, eólica, hidráulica, geotérmica, biomasa, mareomotriz.\n- **No renovables:** carbón, petróleo, gas natural, nuclear de fisión.\n- La energía **no se crea ni se destruye**: se transforma y se degrada (parte se vuelve calor no aprovechable). El Sol es, directa o indirectamente, la fuente de casi toda la energía disponible en la Tierra.\n\n## Estrategia de resolución\n1. ¿Hay rozamiento? Si no, usa **conservación de la energía** (más rápido que cinemática).\n2. ¿Te piden velocidad y te dan altura? → $v = \\sqrt{2gh}$.\n3. ¿Te piden fuerza media en un choque? → impulso-momento.\n4. Revisa unidades antes de responder: J, W, N, m/s.\n## 7. Trabajo con angulo y trabajo neto\n\n$$W=Fd\\cos\\theta$$\n\n- Si la fuerza es perpendicular al desplazamiento ($\\theta=90^{\\circ}$), el trabajo es **cero**: cargar una maleta caminando en horizontal no hace trabajo sobre ella.\n- La friccion hace trabajo **negativo** ($\\theta=180^{\\circ}$).\n- El trabajo neto es la suma algebraica de todos los trabajos, o el trabajo de la fuerza neta.\n\n## 8. Teorema trabajo-energia y energias\n\n$$W_{neto}=\\Delta E_c=\\frac{1}{2}mv_f^2-\\frac{1}{2}mv_0^2$$\n\n| Energia | Formula | Nota |\n|---|---|---|\n| Cinetica | $E_c=\\dfrac{1}{2}mv^2$ | al **duplicar** la rapidez se **cuadruplica** |\n| Potencial gravitatoria | $E_p=mgh$ | depende del nivel de referencia elegido |\n| Potencial elastica | $E_e=\\dfrac{1}{2}kx^2$ | resortes, ley de Hooke $F=kx$ |\n\n**Distancia de frenado:** como $E_c\\propto v^2$, un auto al doble de rapidez necesita **cuatro veces** mas distancia para detenerse. Es el argumento fisico detras de los limites de velocidad.\n\n## 9. Fuerzas conservativas y conservacion\n\nUna fuerza es **conservativa** si el trabajo que hace no depende del camino (gravedad, resorte). La friccion es **no conservativa**: disipa energia como calor.\n\n$$E_m=E_c+E_p=\\text{constante (sin friccion)}$$\n\nCon friccion: $E_{m,inicial}-E_{m,final}=|W_{friccion}|$.\n\n**Ejemplo canonico.** Un cuerpo cae desde 20 m: al llegar al suelo $v=\\sqrt{2gh}=20$ m/s, sin importar su masa. A mitad de altura tiene mitad de potencial y mitad de cinetica.\n\n## 10. Potencia, maquinas y eficiencia\n\n$$P=\\frac{W}{t}=Fv$$\n\n1 W = 1 J/s; 1 caballo de fuerza son unos 746 W.\n\nEficiencia: $\\et
