a=\\dfrac{E_{util}}{E_{suministrada}}\\times 100\\%$. Ninguna maquina alcanza el 100%: siempre hay perdidas por friccion y calor. Una maquina simple (palanca, polea, plano inclinado) **no crea energia**: reduce la fuerza a costa de aumentar la distancia.\n\n## 11. Fuentes de energia\n\n| Renovables | No renovables |\n|---|---|\n| solar, eolica, hidraulica, geotermica, biomasa, mareomotriz | carbon, petroleo, gas natural, nuclear (uranio) |\n\nCasi toda la energia disponible en la Tierra proviene, directa o indirectamente, del **Sol** (el viento, la lluvia que mueve las hidroelectricas y hasta los combustibles fosiles). El Ecuador genera la mayor parte de su electricidad con centrales hidroelectricas.\n\n> [tip] La energia no se crea ni se destruye, solo se **transforma y se degrada**: cada transformacion deja una parte como calor que ya no se puede aprovechar.\n\n## Ejercicios resueltos tipo examen\n\n**1)** Una fuerza de 50 N desplaza 4 m un cuerpo formando $60^{\\circ}$: $W=50(4)(0{,}5)=100$ J.\n\n**2)** Un motor eleva 200 kg a 5 m en 10 s: $W=mgh=10\\,000$ J y $P=1\\,000$ W.\n\n**3)** Un cuerpo de 2 kg a 6 m/s frena hasta detenerse: el trabajo de la friccion es $-36$ J.\n\n**4)** Un pendulo se suelta desde 0,45 m de altura: en el punto mas bajo $v=\\sqrt{2(10)(0{,}45)}=3$ m/s.\n\n@@CHAPTER qui|q1|⚛️|Estructura atómica y unidades\n## 1. Medición y conversión de unidades\nEl método de los **factores de conversión** nunca falla: multiplica por fracciones que valen 1 y cancela unidades.\n$$250\\,\\text{mL}\\times\\frac{1\\,\\text{L}}{1000\\,\\text{mL}} = 0{,}25\\,\\text{L}$$\nPrefijos clave: kilo $10^{3}$, deci $10^{-1}$, centi $10^{-2}$, mili $10^{-3}$, micro $10^{-6}$, nano $10^{-9}$.\nEquivalencias útiles: $1\\,\\mathrm{cm^{3}} = 1\\,\\text{mL}$; $1\\,\\mathrm{m^{3}} = 1000\\,\\text{L}$; $K = ^\\circ C + 273{,}15$.\n\n> **Cifras significativas:** en multiplicación y división, el resultado lleva las cifras del dato menos preciso.\n\n## 2. Clasificación de la materia\n- **Sustancias puras**: elementos (una sola clase de átomo, $O_{2}$, Fe) y compuestos (dos o más elementos unidos químicamente, $H_{2}O$).\n- **Mezclas**: homogéneas (disoluciones: agua de mar, bronce, aire) y heterogéneas (arena con hierro, agua con aceite).\n\n**Cambio físico vs. químico:** si la sustancia sigue siendo la misma (fundir, evaporar, disolver, triturar), es **físico**. Si aparecen sustancias nuevas (oxidar, quemar, fermentar, digerir), es **químico**. Señales de cambio químico: gas, precipitado, cambio de color permanente, liberación o absorción notable de calor.\n\n**Propiedades intensivas** (no dependen de la cantidad): densidad, punto de fusión, color. **Extensivas**: masa, volumen, peso.\n\n## 3. Partículas fundamentales\n| Partícula | Carga | Masa relativa | Ubicación |\n| --- | --- | --- | --- |\n| Protón | $+1$ | 1 | núcleo |\n| Neutrón | 0 | 1 | núcleo |\n| Electrón | $-1$ | $\\approx 1/1836$ | corteza |\n\n- **Número atómico** $Z$ = protones (define al elemento).\n- **Número de masa** $A$ = protones + neutrones. Entonces **neutrones** $= A - Z$.\n- Átomo neutro: electrones $= Z$. **Catión** (perdió $e^{-}$): $e = Z - carga$. **Anión** (ganó $e^{-}$): $e = Z + |carga|$.\n- **Isótopos**: mismo $Z$, distinto $A$ (mismo elemento, distinta masa).\n\n## 4. Estructura electrónica\nOrden de llenado (Aufbau): $1s\\,2s\\,2p\\,3s\\,3p\\,4s\\,3d\\,4p\\,5s\\,4d\\,5p\\,6s\\ldots$\nCapacidades: $s = 2$, $p = 6$, $d = 10$, $f = 14$.\n\nPrincipios: **Aufbau** (de menor a mayor energía), **Pauli** (máximo 2 electrones por orbital, con espín opuesto) y **Hund** (primero uno en cada orbital del mismo subnivel, luego se aparean).\n\n#### Ejemplo\nAzufre ($Z=16$): $1s^{2}\\,2s^{2}\\,2p^{6}\\,3s^{2}\\,3p^{4}$. Último nivel: 3 → **periodo 3**; electrones de valencia: $2+4 = 6$ → **grupo 16**.\n\n> **Truco:** el número de periodo es el mayor nivel ocupado; el grupo (para representativos) es el número de electrones de valencia (grupos 13-18 = valencia $-10$).\n\nPara iones: quita electrones **primero del nivel más externo** (en metales de transición, primero del $4s$ y luego del $3d$).\n## 5. Cifras significativas y densidad\n\n- Son significativas todas las cifras distintas de cero, los ceros **entre** cifras y los ceros finales si hay punto decimal. $0{,}00450$ tiene 3 cifras significativas.\n- Al multiplicar o dividir, el resultado lleva **las cifras del dato menos preciso**; al sumar, se ajusta por decimales.\n- Densidad: $d=\\dfrac{m}{V}$. El agua tiene $1{,}00\\ \\mathrm{g/cm^3}$; flota lo que tenga densidad menor.\n\n**Conversiones que siempre caen:** $1\\ \\mathrm{L}=1000\\ \\mathrm{cm^3}$; $1\\ \\mathrm{kg}=1000\\ \\mathrm{g}$; $1\\ \\mathrm{m^3}=1000\\ \\mathrm{L}$; $T(\\mathrm{K})=T(^{\\circ}\\mathrm{C})+273{,}15$; $^{\\circ}\\mathrm{F}=\\dfrac{9}{5}\\,^{\\circ}\\mathrm{C}+32$.\n\n> [tip] Metodo del factor unitario: escribe la unidad que quieres eliminar abajo y la que quieres obtener arriba. $2{,}5\\ \\mathrm{km}\\times\\dfrac{1000\\ \\mathrm{m}}{1\\ \\mathrm{km}}\\times\\dfrac{100\\ \\mathrm{cm}}{1\\ \\mathrm{m}}=250\\,000\\ \\mathrm{cm}$.\n\n## 6. Clasificacion de la materia y tipos de cambio\n\n```\nMateria\n |- Sustancias puras -> elementos (Fe, O2) y compuestos (H2O, NaCl)\n |- Mezclas -> homogeneas (disoluciones: aire, acero) y heterogeneas (agua con arena)\n```\n\n- **Propiedades intensivas** (no dependen de la cantidad): densidad, punto de fusion, color.\n- **Propiedades extensivas**: masa, volumen, peso.\n- **Cambio fisico**: cambia la forma o el estado, no la sustancia (fundir hielo, disolver azucar).\n- **Cambio quimico**: aparece una sustancia nueva. Senales: desprendimiento de gas, cambio de color permanente, formacion de precipitado, liberacion o absorcion de calor.\n- Metodos de separacion: filtracion, destilacion, evaporacion, cromatografia, decantacion, tamizado, imantacion.\n\n## 7. Particulas, isotopos e iones\n\n| Particula | Carga | Masa relativa | Ubicacion |\n|---|---|---|---|\n| Proton | $+1$ | 1 uma | nucleo |\n| Neutron | $0$ | 1 uma | nucleo |\n| Electron | $-1$ | 1/1836 uma | orbitales |\n\n- Numero atomico $Z$ = protones (define el elemento). Numero de masa $A=Z+N$.\n- **Isotopos:** mismo $Z$, distinto $N$ (carbono-12 y carbono-14). La masa atomica de la tabla es el **promedio ponderado** de los isotopos.\n- **Iones:** cation = perdio electrones (carga +); anion = gano electrones (carga -). Para $\\mathrm{Ca^{2+}}$ con $Z=20$: 20 protones y 18 electrones.\n\n## 8. Estructura electronica paso a paso\n\nOrden de llenado (regla de las diagonales): 1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p 6s 4f 5d 6p 7s.\n\n- Principio de **Aufbau** (menor energia primero), principio de exclusion de **Pauli** (maximo 2 electrones por orbital, con espin opuesto) y regla de **Hund** (primero uno en cada orbital del mismo subnivel).\n- Capacidad: s = 2, p = 6, d = 10, f = 14.\n- Ejemplo: $\\mathrm{Fe}$ ($Z=26$): $1s^2 2s^2 2p^6 3s^2 3p^6 4s^2 3d^6$, o abreviado $[\\mathrm{Ar}]4s^2 3d^6$.\n- Los **electrones de valencia** (ultima capa) determinan el comportamiento quimico y el grupo del elemento.\n\n## Ejercicios resueltos tipo examen\n\n**1)** Un atomo tiene $A=35$ y $Z=17$: tiene 17 protones, 17 electrones y 18 neutrones.\n\n**2)** Configuracion del ion $\\mathrm{S^{2-}}$ ($Z=16$): gana 2 electrones y queda $1s^2 2s^2 2p^6 3s^2 3p^6$, isoelectronico con el argon.\n\n**3)** 250 mL de una disolucion con densidad $1{,}2\\ \\mathrm{g/mL}$ tienen una masa de 300 g.\n\n**4)** Clasificar: el aire es una mezcla homogenea; el bronce tambien; la oxidacion del hierro es un cambio quimico.\n\n@@CHAPTER qui|q2|🧪|Tabla periódica y nomenclatura\n## 1. Organización de la tabla\n- **Periodos** (filas, 1-7): nivel de energía más externo.\n- **Grupos** (columnas, 1-18): misma cantidad de electrones de valencia ⇒ propiedades parecidas.\n- Familias: 1 alcalinos, 2 alcalinotérreos, 3-12 metales de transición, 15 nitrogenoides, 16 calcógenos, 17 halógenos, 18 gases nobles.\n- Bloques: $s$, $p$, $d$, $f$ según el subnivel que se está llenando.\n\n## 2. Propiedades periódicas (memoriza las flechas)\n| Propiedad | En un periodo (→) | En un grupo (↓) |\n| --- | --- | --- |\n| Radio atómico | disminuye | aumenta |\n| Energía de ionización | aumenta | disminuye |\n| Afinidad electrónica | aumenta | disminuye |\n| Electronegatividad | aumenta | disminuye |\n| Carácter metálico | disminuye | aumenta |\n\n**Por qué:** al avanzar en un periodo aumenta la carga nuclear pero el nivel es el mismo ⇒ el núcleo «jala» más fuerte y el átomo se encoge. Al bajar en un grupo se agregan niveles ⇒ el átomo crece y los electrones externos están más sueltos.\n\nEl más electronegativo es el **flúor** (3,98); los gases nobles son inertes porque tienen el octeto completo.\n\n## 3. Números de oxidación básicos\n- Elemento libre: 0. Ion monoatómico: su carga.\n- Hidrógeno: $+1$ (salvo hidruros metálicos, $-1$). Oxígeno: $-2$ (peroróxidos $-1$).\n- Grupo 1: $+1$; grupo 2: $+2$; aluminio: $+3$.\n- **La suma de los números de oxidación es 0 en un compuesto neutro y es igual a la carga en un ion.**\n\n#### Ejemplo\nEn $H_{2}SO_{4}$: $2(+1) + x + 4(-2) = 0 \\Rightarrow x = +6$ para el azufre.\n\n## 4. Nomenclatura inorgánica\n### Binarios\n- **Óxidos básicos** (metal + O): $Na_{2}O$ óxido de sodio; $Fe_{2}O_{3}$ óxido de hierro (III).\n- **Óxidos ácidos / anhídridos** (no metal + O): $SO_{2}$ dióxido de azufre; $CO_{2}$ dióxido de carbono.\n- **Hidruros**: metálicos ($LiH$, hidruro de litio) y no metálicos ($NH_{3}$, $CH_{4}$, con nombres propios).\n- **Hidrácidos** (H + no metal de grupos 16-17, en agua): $HCl$ ácido clorhídrico.\n- **Sales binarias**: $NaCl$ cloruro de sodio; $MgS$ sulfuro de magnesio. Terminación **-uro**.\n\n### Ternarios y cuaternarios\n- **Hidróxidos** (metal + OH): $NaOH$, $Ca(OH)_{2}$.\n- **Oxácidos** (H + no metal + O): $H_{2}SO_{4}$ ácido sulfúrico, $HNO_{3}$ ácido nítrico, $H_{2}CO_{3}$ ácido carbónico, $H_{3}PO_{4}$ ácido fosfórico.\n- **Oxisales**: sustituye el H del oxácido por un metal. **-oso → -ito**, **-ico → -ato**: $Na_{2}SO_{4}$ sulfato de sodio, $KNO_{2}$ nitrito de potasio.\n- **Sales ácidas** (cuaternarias): conservan H: $NaHCO_{3}$ bicarbonato (hidrogenocarbonato) de sodio.\n\n**Iones poliatómicos que debes reconocer:** $SO_{4}^{2-}$ sulfato, $NO_{3}^{-}$ nitrato, $CO_{3}^{2-}$ carbonato, $PO_{4}^{3-}$ fosfato, $OH^{-}$ hidróxido, $NH_{4}^{+}$ amonio.\n\n> **Truco del intercambio de valencias:** escribe los símbolos, cruza los números de oxidación como subíndices y simplifica. $Al^{3+}$ y $O^{2-}$ → $Al_{2}O_{3}$.\n## 5. Leer la tabla como un mapa\n\n- **Periodos** (filas, 1 a 7) = numero de niveles de energia. **Grupos** (columnas, 1 a 18) = electrones de valencia.\n- Bloques: s (grupos 1-2), p (13-18), d (metales de transicion), f (lantanidos y actinidos).\n- Familias: 1 alcalinos, 2 alcalinoterreos, 17 halogenos, 18 gases nobles.\n- Metales (izquierda): pierden electrones, forman cationes, conducen. No metales (derecha): ganan electrones, forman aniones. Metaloides: la escalera (B, Si, Ge, As, Sb, Te).\n\n## 6. Propiedades periodicas: las cuatro flechas\n\n| Propiedad | En un periodo (izq. a der.) | En un grupo (arriba a abajo) |\n|---|---|---|\n| Radio atomico | disminuye | aumenta |\n| Energia de ionizacion | aumenta | disminuye |\n| Afinidad electronica | aumenta (mas negativa) | disminuye |\n| Electronegatividad | aumenta | disminuye |\n| Caracter metalico | disminuye | aumenta |\n\n> [tip] Todo se explica con dos ideas: **mas carga nuclear atrae mas** (por eso el radio baja hacia la derecha) y **mas capas alejan al electron** (por eso el radio crece hacia abajo). El fluor es el mas electronegativo (4,0) y el francio el menos.\n\n## 7. Nomenclatura inorganica completa\n\n**Compuestos binarios**\n\n| Tipo | Formacion | Ejemplo |\n|---|---|---|\n| Oxido basico | metal + O | $\\mathrm{CaO}$: oxido de calcio |\n| Oxido acido (anhidrido) | no metal + O | $\\mathrm{SO_3}$: trioxido de azufre |\n| Hidruro metalico | metal + H | $\\mathrm{NaH}$: hidruro de sodio |\n| Hidracido | H + no metal (grupos 16-17) | $\\mathrm{HCl(ac)}$: acido clorhidrico |\n| Sal binaria | metal + no metal | $\\mathrm{NaCl}$: cloruro de sodio |\n\nSistema **stock** (numero romano con la valencia): $\\mathrm{FeCl_3}$ = cloruro de hierro (III). Sistema **sistematico** (prefijos): $\\mathrm{N_2O_5}$ = pentaoxido de dinitrogeno.\n\n**Compuestos ternarios**\n\n- Hidroxidos: metal + $\\mathrm{OH}$. $\\mathrm{Mg(OH)_2}$ = hidroxido de magnesio.\n- Oxacidos: $\\mathrm{H_2SO_4}$ acido sulfurico, $\\mathrm{HNO_3}$ acido nitrico, $\\mathrm{H_2CO_3}$ acido carbonico, $\\mathrm{H_3PO_4}$ acido fosforico.\n- Oxisales: se cambia la terminacion del acido: **-oso** pasa a **-ito**, **-ico** pasa a **-ato**. $\\mathrm{NaNO_3}$ nitrato de sodio; $\\mathrm{Na_2SO_3}$ sulfito de sodio.\n\n**Compuestos cuaternarios:** sales acidas y basicas. $\\mathrm{NaHCO_3}$ = hidrogenocarbonato (bicarbonato) de sodio; $\\mathrm{Ca(HSO_4)_2}$ = hidrogenosulfato de calcio.\n\n**Iones poliatomicos que hay que memorizar:** $\\mathrm{NO_3^-}$ nitrato, $\\mathrm{SO_4^{2-}}$ sulfato, $\\mathrm{CO_3^{2-}}$ carbonato, $\\mathrm{PO_4^{3-}}$ fosfato, $\\mathrm{OH^-}$ hidroxido, $\\mathrm{NH_4^+}$ amonio.\n\n> [warn] La formula se arma **cruzando valencias** y simplificando: $\\mathrm{Al^{3+}}$ con $\\mathrm{O^{2-}}$ da $\\mathrm{Al_2O_3}$. Si los numeros se pueden simplificar, hay que hacerlo (excepto en peroxidos).\n\n## Ejercicios resueltos tipo examen\n\n**1)** Ordenar por radio atomico creciente: F, O, Li. Respuesta: F < O < Li (el radio crece hacia la izquierda).\n\n**2)** Nombre de $\\mathrm{Cu_2O}$: el cobre actua con valencia 1, entonces es oxido de cobre (I) o oxido cuproso.\n\n**3)** Formula del sulfato de aluminio: $\\mathrm{Al^{3+}}$ y $\\mathrm{SO_4^{2-}}$ dan $\\mathrm{Al_2(SO_4)_3}$.\n\n**4)** Cual tiene mayor energia de ionizacion, Na o Mg? El magnesio, porque esta mas a la derecha en el mismo periodo.\n\n@@CHAPTER qui|q3|🔗|Enlace químico y geometría\n## 1. ¿Por qué se unen los átomos?\nPara alcanzar la configuración estable del gas noble más cercano: la **regla del octeto** (8 electrones de valencia; 2 para H y He).\n\n## 2. Tipos de enlace\n| Tipo | Quiénes | Qué pasa | Ejemplo |\n| --- | --- | --- | --- |\n| Iónico | metal + no metal | transferencia de electrones | $NaCl$ |\n| Covalente | no metal + no metal | electrones compartidos | $H_{2}O$ |\n| Metálico | metal + metal | «mar de electrones» | Cu |\n\n**Criterio práctico con la diferencia de electronegatividad $\\Delta EN$:**\n- $\\Delta EN \\geq 1{,}7$ → iónico.\n- $0{,}4 \\leq \\Delta EN < 1{,}7$ → covalente **polar**.\n- $\\Delta EN < 0{,}4$ → covalente **no polar**.\n\nPropiedades típicas: los iónicos son sólidos duros, de alto punto de fusión y conducen electricidad **disueltos o fundidos**; los covalentes moleculares tienen puntos de fusión bajos y no conducen; los metálicos son dúctiles, maleables y buenos conductores.\n\n## 3. Estructuras de Lewis paso a paso\n1. Cuenta los electrones de valencia **totales** (suma iones: resta si es catión, suma si es anión).\n2. Coloca el átomo central (el menos electronegativo, nunca el H).\n3. Une con enlaces simples (2 $e^{-}$ cada uno).\n4. Completa octetos de los periféricos.\n5. Los electrones sobrantes van al central; si falta, forma enlaces dobles o triples.\n\n#### Ejemplo\n$CO_{2}$: $4 + 2(6) = 16$ electrones → dos enlaces dobles O=C=O.\n\n## 4. Geometría molecular (TRPEV)\nLos pares electrónicos se repelen y se colocan lo más lejos posible.\n| Pares enlazantes + libres | Geometría | Ejemplo |\n| --- | --- | --- |\n| 2 + 0 | lineal ($180^\\circ$) | $CO_{2}$ |\n| 3 + 0 | trigonal plana ($120^\\circ$) | $BF_{3}$ |\n| 4 + 0 | tetraédrica ($109{,}5^\\circ$) | $CH_{4}$ |\n| 3 + 1 | piramidal trigonal | $NH_{3}$ |\n| 2 + 2 | angular | $H_{2}O$ |\n\n**Polaridad de la molécula:** depende de los enlaces **y** de la geometría. $CO_{2}$ tiene enlaces polares pero es apolar porque los dipolos se cancelan; $H_{2}O$ es angular y por eso es polar.\n\n## 5. Fuerzas intermoleculares (de más débil a más fuerte)\n1. **Dispersión de London**: en todas las moléculas; únicas en las apolares ($CH_{4}$, $Cl_{2}$).\n2. **Dipolo-dipolo**: entre moléculas polares ($HCl$).\n3. **Puente de hidrógeno**: cuando el H está unido a **F, O o N** ($H_{2}O$, $NH_{3}$, alcoholes).\n4. **Ion-dipolo**: sales disueltas en agua.\n\n> **Por eso el agua es rara y maravillosa:** los puentes de hidrógeno explican su alto punto de ebullición, su tensión superficial y que el hielo flote.\n\n**Analogía:** el enlace covalente es el matrimonio dentro de la molécula; las fuerzas intermoleculares son la amistad entre vecinos. Para hervir el agua no rompes matrimonios, solo separas vecinos.\n## 6. Prediccion del tipo de enlace por electronegatividad\n\n| Diferencia $\\Delta EN$ | Tipo de enlace |\n|---|---|\n| $0$ a $0{,}4$ | covalente no polar |\n| $0{,}4$ a $1{,}7$ | covalente polar |\n| mayor a $1{,}7$ | ionico |\n\nRegla practica: **metal + no metal = ionico**; **no metal + no metal = covalente**; **metal + metal = metalico** (mar de electrones, por eso conducen y son maleables).\n\n| Propiedad | Ionico | Covalente molecular | Metalico |\n|---|---|---|---|\n| Punto de fusion | muy alto | bajo | variable, suele ser alto |\n| Conduce electricidad | fundido o disuelto | no | si, en estado solido |\n| Solubilidad en agua | alta | baja (salvo polares) | insoluble |\n\n## 7. Lewis: procedimiento infalible\n\n1. Cuenta los electrones de valencia totales (suma o resta la carga si es ion).\n2. Elige el atomo central: el **menos electronegativo** (nunca el hidrogeno).\n3. Une con enlaces simples y completa octetos de los atomos externos.\n4. Si faltan electrones al central, forma **enlaces dobles o triples**.\n5. Verifica: total de electrones colocados = total calculado.\n\n**Excepciones:** H (2 electrones), Be (4), B (6), y expansion del octeto en el periodo 3 en adelante ($\\mathrm{PCl_5}$, $\\mathrm{SF_6}$).\n\n**Resonancia:** cuando hay varias estructuras validas equivalentes ($\\mathrm{O_3}$, $\\mathrm{NO_3^-}$), la real es un promedio de todas.\n\n## 8. Geometria molecular (TRPEV/VSEPR)\n\nLos pares de electrones se repelen y se alejan lo maximo posible.\n\n| Pares enlazantes + libres | Geometria | Angulo | Ejemplo |\n|---|---|---|---|\n| 2 + 0 | lineal | 180 | $\\mathrm{CO_2}$ |\n| 3 + 0 | trigonal plana | 120 | $\\mathrm{BF_3}$ |\n| 4 + 0 | tetraedrica | 109,5 | $\\mathrm{CH_4}$ |\n| 3 + 1 | piramidal trigonal | 107 | $\\mathrm{NH_3}$ |\n| 2 + 2 | angular | 104,5 | $\\mathrm{H_2O}$ |\n\n**Polaridad de la molecula:** depende de los enlaces **y** de la geometria. El $\\mathrm{CO_2}$ tiene enlaces polares pero es apolar porque son simetricos; el agua es polar porque es angular.\n\n## 9. Fuerzas intermoleculares y sus efectos\n\nDe mas debil a mas fuerte:\n\n1. **Dispersion de London** (todas las moleculas; crecen con la masa molar).\n2. **Dipolo-dipolo** (moleculas polares).\n3. **Puente de hidrogeno** (H unido a F, O o N). Es la razon de que el agua hierva a 100 grados, de que el hielo flote y de que el ADN mantenga su doble helice.\n4. Ion-dipolo (en disoluciones de sales en agua).\n\n> [tip] \"Lo semejante disuelve a lo semejante\": lo polar se disuelve en polar (sal y azucar en agua) y lo apolar en apolar (aceite en gasolina).\n\n## Ejercicios resueltos tipo examen\n\n**1)** Tipo de enlace en $\\mathrm{KBr}$: metal + no metal, con $\\Delta EN$ grande, entonces ionico.\n\n**2)** Geometria del $\\mathrm{NH_3}$: 3 enlaces y 1 par libre, piramidal trigonal, angulo cercano a 107 grados y molecula polar.\n\n**3)** Por que el $\\mathrm{H_2O}$ hierve mucho mas alto que el $\\mathrm{H_2S}$? Porque forma puentes de hidrogeno y el sulfuro solo dipolo-dipolo.\n\n**4)** Electrones de valencia totales en $\\mathrm{CO_2}$: $4+2(6)=16$, distribuidos en dos dobles enlaces y cuatro pares libres.\n\n@@CHAPTER qui|q4|⚖️|Estequiometría\n## 1. El mol: la docena del químico\nUn mol son $6{,}022\\times10^{23}$ partículas (número de Avogadro). La **masa molar** $M$ (g/mol) es numéricamente igual a la masa atómica o molecular.\n\nEl triángulo maestro:\n$$n = \\frac{m}{M}, \\qquad N = n\\cdot N_{A}, \\qquad V_{gas,CN} = n \\cdot 22{,}4\\,\\text{L}$$\n\n#### Ejemplo\n$50\\,\\text{g}$ de $CaCO_{3}$ ($M = 100{,}09$): $n = 0{,}4996 \\approx 0{,}5\\,\\text{mol}$, es decir $3{,}01\\times10^{23}$ unidades fórmula.\n\n## 2. Composición porcentual\n$$\\%\\,elemento = \\frac{masa\\ del\\ elemento\\ en\\ 1\\ mol}{masa\\ molar}\\times100$$\n\n## 3. Fórmula empírica y molecular\n1. Toma 100 g ⇒ los porcentajes se vuelven gramos.\n2. Divide cada masa para su masa atómica → moles.\n3. Divide todos para el menor → proporción.\n4. Multiplica hasta obtener enteros → **fórmula empírica**.\n5. $n = \\frac{M_{molecular}}{M_{empírica}}$ → **fórmula molecular** $= (empírica)_{n}$.\n\nEjemplo clásico: empírica $CH_{2}O$ (30 g/mol) y masa molar 180 ⇒ $n = 6$ ⇒ $C_{6}H_{12}O_{6}$.\n\n## 4. Balanceo de ecuaciones\nLey de conservación de la masa: **el mismo número de átomos de cada elemento a ambos lados**. Solo se cambian **coeficientes**, jamás los subíndices.\nOrden recomendado: metales → no metales → hidrógeno → oxígeno.\n$$CH_{4}+2O_{2} \\rightarrow CO_{2}+2H_{2}O$$\n\n## 5. Cálculos estequiométricos (la autopista)\n$$\\text{gramos A} \\rightarrow \\text{moles A} \\rightarrow \\text{moles B} \\rightarrow \\text{gramos B}$$\nEl paso del centro usa la **relación de coeficientes** de la ecuación balanceada.\n\n#### Ejemplo\n¿Cuántos gramos de $CO_{2}$ se producen al quemar $16\\,\\text{g}$ de $CH_{4}$?\n$n(CH_{4}) = 1\\,\\text{mol} \\Rightarrow n(CO_{2}) = 1\\,\\text{mol} \\Rightarrow m = 44\\,\\text{g}$.\n\n## 6. Reactivo limitante y rendimiento\n- Calcula los moles de cada reactivo y **divídelos para su coeficiente**. El menor cociente es el **limitante**; él decide cuánto producto se forma. El otro queda **en exceso**.\n- **Rendimiento porcentual:** $\\%R = \\frac{real}{teórico}\\times100$.\n\n> **Analogía del sánduche:** con 10 panes y 4 quesos, si cada sánduche lleva 1 pan y 1 queso, el queso es el limitante: solo salen 4 sánduches y sobran 6 panes.\n\n## Checklist antes de responder\n1. ¿La ecuación está balanceada?\n2. ¿Convertí gramos a moles?\n3. ¿Usé la relación correcta de coeficientes?\n4. ¿La respuesta tiene sentido en magnitud y unidades?\n## 7. Tipos de reacciones quimicas\n\n| Tipo | Esquema | Ejemplo |\n|---|---|---|\n| Sintesis | $A+B\\to AB$ | $2\\mathrm{H_2}+\\mathrm{O_2}\\to 2\\mathrm{H_2O}$ |\n| Descomposicion | $AB\\to A+B$ | $2\\mathrm{H_2O_2}\\to 2\\mathrm{H_2O}+\\mathrm{O_2}$ |\n| Desplazamiento simple | $A+BC\\to AC+B$ | $\\mathrm{Zn}+2\\mathrm{HCl}\\to \\mathrm{ZnCl_2}+\\mathrm{H_2}$ |\n| Doble desplazamiento | $AB+CD\\to AD+CB$ | $\\mathrm{AgNO_3}+\\mathrm{NaCl}\\to \\mathrm{AgCl}+\\mathrm{NaNO_3}$ |\n| Combustion | hidrocarburo + $\\mathrm{O_2}$ | $\\mathrm{CH_4}+2\\mathrm{O_2}\\to \\mathrm{CO_2}+2\\mathrm{H_2O}$ |\n| Neutralizacion | acido + base | $\\mathrm{HCl}+\\mathrm{NaOH}\\to \\mathrm{NaCl}+\\mathrm{H_2O}$ |\n\n**Balanceo por tanteo:** ajusta primero metales, luego no metales, despues hidrogeno y **al final oxigeno**. Nunca cambies los subindices: solo los coeficientes.\n\n## 8. La \"autopista\" estequiometrica\n\n```\ngramos A --(masa molar A)--> moles A --(coeficientes)--> moles B --(masa molar B)--> gramos B\n```\n\nTodo problema de estequiometria es recorrer ese camino. Para gases en condiciones normales, 1 mol ocupa **22,4 L**; para disoluciones, $M=\\dfrac{\\text{moles de soluto}}{\\text{litros de disolucion}}$.\n\n**Ejemplo completo.** Cuantos gramos de $\\mathrm{CO_2}$ produce la combustion de 32 g de $\\mathrm{CH_4}$?\n$32\\ \\mathrm{g}\\div 16\\ \\mathrm{g/mol}=2$ mol de $\\mathrm{CH_4}$; la relacion es 1:1, entonces 2 mol de $\\mathrm{CO_2}$, es decir $2\\times 44=88$ g.\n\n## 9. Reactivo limitante y rendimiento\n\n1. Convierte **cada** reactivo a moles.\n2. Divide las moles de cada uno para su coeficiente: **el menor cociente manda** (ese es el limitante).\n3. Calcula el producto a partir del limitante; el otro reactivo queda en exceso.\n\n$$\\text{Rendimiento} = \\frac{\\text{real}}{\\text{teorico}}\\times 100\\%$$\n\n> [tip] Analogia: para armar un sanduche necesitas 2 panes y 1 queso. Con 10 panes y 8 quesos solo puedes hacer 5 sanduches: **el pan es el limitante** aunque haya mas unidades.\n\n## 10. Leyes ponderales y conservacion\n\n- **Ley de Lavoisier:** la masa total se conserva; por eso la ecuacion debe estar balanceada.\n- **Ley de Proust (proporciones definidas):** un compuesto siempre tiene la misma proporcion en masa; el agua es 11,2% H y 88,8% O, siempre.\n\n## Ejercicios resueltos tipo examen\n\n**1)** Masa molar del $\\mathrm{Ca(OH)_2}$: $40+2(16+1)=74\\ \\mathrm{g/mol}$.\n\n**2)** Cuantas moleculas hay en 0,5 mol de $\\mathrm{N_2}$? $0{,}5\\times 6{,}022\\times 10^{23}=3{,}01\\times 10^{23}$.\n\n**3)** Un compuesto tiene 40% C, 6,7% H y 53,3% O. Dividiendo para las masas atomicas se obtiene 3,33 : 6,7 : 3,33, o sea $\\mathrm{CH_2O}$ como formula empirica. Si su masa molar es 180, la molecular es $\\mathrm{C_6H_{12}O_6}$.\n\n**4)** Balancear $\\mathrm{C_3H_8}+\\mathrm{O_2}\\to \\mathrm{CO_2}+\\mathrm{H_2O}$: $\\mathrm{C_3H_8}+5\\mathrm{O_2}\\to 3\\mathrm{CO_2}+4\\mathrm{H_2O}$.\n\n@@CHAPTER len|l1|🧠|Pensamiento lógico y comunicación\n## 1. ¿Qué es un argumento?\nUn **argumento** es un conjunto de proposiciones donde unas (**premisas**) sostienen a otra (**conclusión**). No es una pelea ni una opinión suelta.\n\nPalabras señal:\n- Premisas: *porque, ya que, dado que, puesto que, en vista de que*.\n- Conclusión: *por lo tanto, en consecuencia, luego, así que, se sigue que*.\n\n**Validez ≠ verdad.** Un argumento es **válido** si la conclusión se sigue necesariamente de las premisas, aunque las premisas sean falsas. Es **sólido** si además las premisas son verdaderas.\n\n## 2. Proposiciones y conectores\n| Conector | Símbolo | Verdadero cuando |\n| --- | --- | --- |\n| Conjunción (y) | $p \\wedge q$ | ambas son verdaderas |\n| Disyunción (o) | $p \\vee q$ | al menos una es verdadera |\n| Condicional (si… entonces) | $p \\rightarrow q$ | salvo si $p$ es V y $q$ es F |\n| Bicondicional (si y solo si) | $p \\leftrightarrow q$ | ambas tienen el mismo valor |\n| Negación | $\\neg p$ | $p$ es falsa |\n\n### El condicional y sus parientes (¡muy preguntado!)\nDado «Si llueve, entonces la calle se moja» ($p \\rightarrow q$):\n- **Recíproca:** $q \\rightarrow p$ (si la calle se moja, llovió). **No** equivale.\n- **Inversa:** $\\neg p \\rightarrow \\neg q$. **No** equivale.\n- **Contrarrecíproca:** $\\neg q \\rightarrow \\neg p$ (si la calle no se mojó, no llovió). **Sí equivale siempre.**\n\n### Reglas de inferencia\n- **Modus ponens:** $p \\rightarrow q$, $p$ ⇒ $q$. ✅\n- **Modus tollens:** $p \\rightarrow q$, $\\neg q$ ⇒ $\\neg p$. ✅\n- **Silogismo hipotético:** $p\\rightarrow q$, $q\\rightarrow r$ ⇒ $p\\rightarrow r$. ✅\n- **Falacia de afirmar el consecuente:** $p\\rightarrow q$, $q$ ⇒ $p$. ❌\n- **Falacia de negar el antecedente:** $p\\rightarrow q$, $\\neg p$ ⇒ $\\neg q$. ❌\n\n### Leyes de De Morgan\n$\\neg(p \\wedge q) \\equiv \\neg p \\vee \\neg q$ y $\\neg(p \\vee q) \\equiv \\neg p \\wedge \\neg q$.\nNegar «todos son X» es «**al menos uno** no es X» (no «ninguno es X»).\n\n## 3. Silogismos categóricos\nCuatro formas: **A** (todo S es P), **E** (ningún S es P), **I** (algunos S son P), **O** (algunos S no son P).\nUsa **diagramas de Venn**: dibuja tres círculos, sombrea lo vacío, marca con X lo que existe y comprueba si la conclusión queda forzada.\n\n> Con dos premisas particulares («algunos…») **nunca** se obtiene conclusión válida.\n\n## 4. Falacias frecuentes\n- **Ad hominem:** atacar a la persona, no al argumento.\n- **Ad verecundiam:** apelar a una autoridad no pertinente.\n- **Ad populum:** «todos lo hacen, luego es correcto».\n- **Ad baculum:** amenaza. **Ad misericordiam:** apelar a la lástima.\n- **Falsa causa (post hoc):** confundir sucesión con causa.\n- **Generalización apresurada:** concluir de pocos casos.\n- **Falsa dicotomía:** presentar solo dos opciones.\n- **Hombre de paja:** deformar la postura del otro para refutarla.\n- **Petición de principio:** usar la conclusión como premisa.\n\n## 5. Analogías y series\nEn «A es a B como C es a D» primero **nombra la relación en voz alta** (parte-todo, causa-efecto, instrumento-oficio, género-especie, sinónimo, antónimo, intensidad) y después busca la opción que la reproduce **en el mismo orden**.\n\n## 6. Hecho vs. opinión\n- **Hecho:** verificable objetivamente («Quito está a 2 850 m.s.n.m.»).\n- **Juicio de valor:** contiene valoración subjetiva («Quito es la ciudad más linda»). Pistas: adjetivos valorativos, «debería», «es mejor».\n## 7. La comunicacion: elementos y funciones\n\n| Elemento | Que es | En un examen se pregunta como... |\n|---|---|---|\n| Emisor | quien produce el mensaje | \"quien enuncia el texto\" |\n| Receptor | a quien va dirigido | \"el destinatario\" |\n| Mensaje | el contenido | \"lo que se comunica\" |\n| Codigo | el sistema de signos (la lengua) | \"el idioma o los simbolos\" |\n| Canal | el medio fisico | \"oral, escrito, digital\" |\n| Referente | la realidad de la que se habla | \"el tema\" |\n| Contexto | la situacion que rodea | \"las circunstancias\" |\n\n**Funciones del lenguaje (Jakobson):**\n\n- **Referencial**: informar (noticias, textos cientificos).\n- **Emotiva**: expresar al emisor (\"me siento agotado\").\n- **Apelativa o conativa**: influir en el receptor (ordenes, publicidad).\n- **Fatica**: abrir o mantener el contacto (\"alo?\", \"me escuchas?\").\n- **Metalinguistica**: hablar de la lengua misma (\"'haber' no es lo mismo que 'a ver'\").\n- **Poetica**: centrar la atencion en la forma del mensaje (literatura, eslogans).\n\n**Barreras comunicativas:** fisicas (ruido), semanticas (ambiguedad, tecnicismos), psicologicas (prejuicios) y culturales.\n\n## 8. Deduccion, induccion y abduccion\n\n| Tipo | Va de... | Conclusion |\n|---|---|---|\n| Deductivo | lo general a lo particular | necesaria si las premisas son verdaderas (valido) |\n| Inductivo | casos particulares a una generalizacion | probable, nunca segura |\n| Abductivo | un hecho a su mejor explicacion | hipotesis plausible |\n\n> [tip] **Validez no es verdad.** Un razonamiento puede ser valido con premisas falsas (\"todos los gatos vuelan; Micifuz es gato; luego Micifuz vuela\": valido pero no solido). Un argumento **solido** es valido *y* con premisas verdaderas.\n\n## 9. Logica proposicional aplicada\n\n| Conector | Simbolo | Verdadero cuando |\n|---|---|---|\n| Conjuncion (y) | $p\\wedge q$ | ambas son verdaderas |\n| Disyuncion (o) | $p\\vee q$ | al menos una es verdadera |\n| Condicional (si... entonces) | $p\\to q$ | falso solo si $p$ es verdadera y $q$ falsa |\n| Bicondicional (si y solo si) | $p\\leftrightarrow q$ | ambas tienen el mismo valor |\n| Negacion | $\\neg p$ | invierte el valor |\n\n**Del condicional $p\\to q$ se derivan:**\n\n- Reciproca: $q\\to p$ (no equivale).\n- Inversa: $\\neg p\\to\\neg q$ (no equivale).\n- **Contrarreciproca: $\\neg q\\to\\neg p$ (si equivale)**. Es la clave de muchisimos items.\n\n**Reglas de inferencia:** modus ponens ($p\\to q$, $p$, luego $q$), modus tollens ($p\\to q$, $\\neg q$, luego $\\neg p$) y silogismo hipotetico ($p\\to q$, $q\\to r$, luego $p\\to r$).\n\n**Falacias formales:** afirmar el consecuente ($p\\to q$, $q$, luego $p$) y negar el antecedente ($p\\to q$, $\\neg p$, luego $\\neg q$). Ambas son **invalidas**.\n\n**Leyes de De Morgan:** $\\neg(p\\wedge q)\\equiv \\neg p\\vee\\neg q$ y $\\neg(p\\vee q)\\equiv\\neg p\\wedge\\neg q$. Negar \"todos\" da \"al menos uno no\"; negar \"algun\" da \"ninguno\".\n\n## 10. Catalogo de falacias informales\n\n| Falacia | En que consiste | Ejemplo |\n|---|---|---|\n| Ad hominem | atacar a la persona | \"no le creas, es un fracasado\" |\n| Ad verecundiam | apelar a autoridad no pertinente | \"lo dijo un actor famoso\" |\n| Ad populum | apelar a la mayoria | \"todos lo hacen, luego esta bien\" |\n| Falsa causa | confundir correlacion con causa | \"desde que uso esta pulsera no me enfermo\" |\n| Generalizacion apresurada | pocos casos, gran conclusion | \"dos taxistas groseros: todos lo son\" |\n| Falsa dicotomia | reducir a dos opciones | \"o estudias ingenieria o fracasas\" |\n| Hombre de paja | deformar la postura ajena | responder a algo que el otro no dijo |\n| Pendiente resbaladiza | cadena catastrofica sin sustento | \"si repruebas una materia, perderas tu vida\" |\n| Peticion de principio | usar la conclusion como premisa | \"es legal porque asi lo dice la ley que lo permite\" |\n| Ad ignorantiam | \"no se ha probado lo contrario\" | \"nadie demostro que no existan, luego existen\" |\n\n## 11. Juicios de valor, hechos y opiniones\n\n- **Hecho:** verificable ($\\to$ \"Quito esta a 2.850 m sobre el nivel del mar\").\n- **Opinion:** creencia personal, no verificable directamente (\"Quito es la ciudad mas linda\").\n- **Juicio de valor:** evalua segun un criterio explicito o implicito (\"la medida fue injusta porque afecto a los mas pobres\"). Un buen juicio de valor **declara su criterio** y se apoya en evidencia.\n\n> [warn] En los items de lectura critica, pregunta siempre: esto se puede comprobar? Si la respuesta es no, es opinion o valoracion, aunque suene muy segura.\n\n## Ejercicios resueltos tipo examen\n\n**1)** \"Si llueve, la cancha se moja. La cancha no esta mojada.\" Conclusion valida: **no llovio** (modus tollens).\n\n**2)** Negar \"todos los estudiantes aprobaron\": **al menos un estudiante no aprobo**.\n\n**3)** \"El ministro no puede tener razon porque es antipatico\": falacia **ad hominem**.\n\n**4)** \"Todos los A son B. Algunos C son A.\" Conclusion valida: **algunos C son B**.\n\n@@CHAPTER len|l2|📚|Lectura e interpretación de textos\n## 1. Los tres niveles de lectura\n1. **Literal:** qué dice el texto (datos explícitos).\n2. **Inferencial:** qué se deduce sin estar escrito (implicaciones, propósito, tono).\n3. **Crítico:** qué tan válido es (evaluar argumentos, sesgos, evidencia).\n\nLa mayoría de preguntas del examen son de los niveles 1 y 2.\n\n## 2. Idea principal, tema y título\n- **Tema:** de qué trata, en pocas palabras (un sintagma: «la deforestación amazónica»).\n- **Idea principal:** la afirmación central sobre ese tema (una oración completa).\n- **Ideas secundarias:** ejemplos, datos y explicaciones que la apoyan.\n\n> **Prueba rápida:** si eliminas una oración y el texto pierde el sentido, era la principal; si solo pierde detalle, era secundaria.\n\n## 3. Tipología textual\n| Tipo | Intención | Marca típica |\n| --- | --- | --- |\n| Narrativo | contar hechos | verbos en pasado, secuencia |\n| Descriptivo | mostrar cómo es | adjetivos, presente |\n| Expositivo | informar/explicar | datos, tercera persona |\n| Argumentativo | convencer | tesis + razones |\n| Instructivo | dirigir la acción | imperativos, pasos |\n\nFunciones del lenguaje: referencial (informar), apelativa (convencer), expresiva (emociones), poética (forma), fática (contacto), metalingüística (hablar del propio idioma).\n\n## 4. Estrategia para responder rápido\n1. Lee **primero la pregunta**, luego el texto: sabrás qué buscar.\n2. Subraya conectores y nombres propios: suelen marcar la respuesta.\n3. **La respuesta está en el texto**, no en tu opinión ni en tu conocimiento previo.\n4. Descarta opciones **demasiado absolutas** («siempre», «nunca», «todos») y las que son verdaderas pero **no responden** lo preguntado.\n5. Cuidado con opciones que copian palabras del texto pero cambian el sentido.\n\n## 5. Vocabulario por contexto\nSi no conoces una palabra:\n- Busca **pistas en la oración**: definiciones, ejemplos, contrastes («pero», «a diferencia de»).\n- Analiza **raíces y afijos**: *bio-* vida, *-logía* estudio, *in-/des-* negación, *hiper-* exceso, *sub-* debajo, *re-* repetición, *poli-* muchos, *anti-* contra.\n- Reemplaza tu candidata en la oración y verifica que no cambie el sentido.\n\n## 6. Conectores lógicos (el GPS del texto)\n- **Adición:** además, asimismo, también, incluso.\n- **Oposición:** sin embargo, no obstante, pero, en cambio, aunque.\n- **Causa:** porque, debido a, ya que, puesto que.\n- **Consecuencia:** por lo tanto, en consecuencia, de modo que, así pues.\n- **Condición:** si, siempre que, a menos que.\n- **Orden:** en primer lugar, luego, finalmente.\n- **Ejemplificación:** por ejemplo, en particular, tal como.\n- **Síntesis:** en resumen, en síntesis, en conclusión.\n\nLa mitad de las preguntas de completación se resuelven identificando si la relación entre las dos partes es de **suma, contraste o causa**.\n\n## 7. Inferencia bien hecha\nUna inferencia válida se apoya en el texto y no agrega información nueva. Si para aceptar la opción necesitas suponer algo que el texto no dice, esa opción es incorrecta.\n## 8. Estructura interna de los textos\n\n| Estructura | Como se reconoce |\n|---|---|\n| Problema-solucion | plantea una dificultad y luego propone salidas |\n| Causa-efecto | \"debido a\", \"por lo tanto\", \"como consecuencia\" |\n| Comparacion-contraste | \"en cambio\", \"a diferencia de\", \"igualmente\" |\n| Enumeracion | \"en primer lugar\", \"por ultimo\" |\n| Secuencia temporal | fechas y marcadores cronologicos |\n\nSaber la estructura te dice **donde** esta la respuesta: en un texto problema-solucion, la idea principal casi siempre esta en la propuesta final.\n\n## 9. Lectura critica: evaluar, no solo entender\n\nPreguntas que debes hacerle a todo texto argumentativo:\n\n1. **Cual es la tesis?** (la postura que defiende, no el tema).\n2. **Con que argumentos la sostiene?** (datos, ejemplos, autoridades, analogias).\n3. **Que tipo de evidencia usa?** Es suficiente, actual y pertinente?\n4. **Que supone sin decirlo?** (presuposiciones).\n5. **Cual es la intencion?** Informar, persuadir, entretener, criticar, vender.\n6. **Que tono adopta?** Objetivo, ironico, alarmista, didactico, polemico.\n7. **Hay sesgos o falacias?**\n\n> [tip] Tema, tesis e idea principal no son lo mismo. Tema = de que trata (una palabra o frase). Tesis = que sostiene el autor (una oracion completa con postura). Idea principal = la afirmacion mas importante del fragmento.\n\n## 10. Tipos de pregunta y como atacarlas\n\n| Tipo de item | Estrategia |\n|---|---|\n| Literal (\"segun el texto...\") | la respuesta esta escrita; localiza la linea |\n| Inferencial (\"se deduce que...\") | debe seguirse del texto, sin agregar informacion externa |\n| De vocabulario | sustituye la palabra por cada opcion y relee la oracion |\n| De proposito (\"el autor busca...\") | mira el titulo, el cierre y los verbos usados |\n| De estructura (\"la funcion del parrafo 3 es...\") | pregunta que aporta ese parrafo al conjunto |\n| De actitud o tono | fijate en los adjetivos valorativos |\n\n**Descarte inteligente:** son falsas casi siempre las opciones con \"siempre\", \"nunca\", \"todos\", \"ninguno\" (absolutismos), las que solo repiten palabras del texto sin responder, y las que son verdaderas en el mundo real pero **no estan en el texto**.\n\n## 11. Inferencia bien hecha vs. sobreinterpretacion\n\nUna inferencia valida se apoya en lo que el texto dice mas conocimiento general razonable. Si necesitas inventar un dato, ya no es inferencia.\n\n**Ejemplo.** Texto: \"Pese a la lluvia, el estadio estaba lleno.\"\n- Inferencia valida: el publico estaba muy motivado.\n- Sobreinterpretacion: el equipo local gano el partido (el texto no lo dice).\n\n## 12. Conectores: el mapa de las ideas\n\n| Relacion | Conectores |\n|---|---|\n| Adicion | ademas, asimismo, tambien, incluso |\n| Oposicion | sin embargo, no obstante, en cambio, aunque |\n| Causa | porque, ya que, debido a, puesto que |\n| Consecuencia | por lo tanto, en consecuencia, asi que, de ahi que |\n| Condicion | si, siempre que, a menos que |\n| Ejemplificacion | por ejemplo, tal como, a saber |\n| Conclusion | en sintesis, en definitiva, para terminar |\n\n> [warn] Cuidado con \"sin embargo\": marca un **giro**. Muchas veces la idea principal del autor esta justo despues de ese conector, no antes.\n\n## Ejercicio resuelto tipo examen\n\n**Texto.** \"Durante decadas se creyo que memorizar era la mejor forma de aprender. Hoy sabemos que recuperar la informacion de memoria, es decir autoevaluarse, produce aprendizajes mas duraderos que releer. Sin embargo, la mayoria de estudiantes sigue prefiriendo releer porque genera una sensacion de fluidez que confunden con dominio.\"\n\n- **Tema:** los metodos de estudio.\n- **Tesis:** autoevaluarse es mas eficaz que releer.\n- **Inferencia valida:** la sensacion de familiaridad no garantiza aprendizaje.\n- **Proposito:** persuadir al lector de cambiar su tecnica de estudio.\n- **Palabra clave del giro:** \"sin embargo\", que introduce la conducta contradictoria de los estudiantes.\n\n@@CHAPTER len|l3|✍️|Comunicación escrita\n## 1. El párrafo\nUn párrafo desarrolla **una sola idea**. Estructura típica: oración temática + oraciones de desarrollo + cierre.\nCualidades: **unidad** (una idea), **coherencia** (orden lógico) y **cohesión** (conectores, pronombres, sinónimos).\n\nEjercicio clásico del examen: **detectar la oración intrusa** (la que no aporta a la idea central) u **ordenar oraciones** para formar un párrafo. Para ordenar: busca la oración **general sin pronombres ni conectores** (esa va primera) y sigue las pistas de referencia («este fenómeno», «dicha propuesta»).\n\n## 2. Puntuación esencial\n**Coma**\n- Enumeraciones: *compré pan, leche y queso* (no coma antes de «y» en enumeración simple).\n- Vocativo: *María, ven acá.*\n- Incisos y aposiciones: *Quito, capital del Ecuador, está…*\n- Antes de *pero, sino, aunque*.\n- Tras conectores como *sin embargo, por lo tanto, además* (y punto y coma o punto antes).\n- **Nunca** entre sujeto y verbo.\n\n**Punto y coma:** separa elementos que ya llevan comas y une oraciones muy relacionadas.\n**Dos puntos:** antes de enumeraciones, citas textuales y explicaciones.\n**Comillas:** citas y sentido irónico. **Paréntesis:** información accesoria.\n\n> La coma cambia vidas: «Vamos a comer, niños» no es lo mismo que «Vamos a comer niños».\n\n## 3. Acentuación\n- **Agudas:** tildan si terminan en vocal, *n* o *s* (*café, canción, comás*).\n- **Graves/llanas:** tildan si **no** terminan en vocal, *n* ni *s* (*árbol, lápiz*).\n- **Esdrújulas y sobresdrújulas:** siempre tildan (*máquina, dígamelo*).\n- **Hiato** con vocal cerrada tónica: siempre tilde (*día, raíz, baúl*).\n- **Tilde diacrítica:** *tú/tu, él/el, mí/mi, sí/si, sé/se, más/mas, té/te, dé/de, aún(todavía)/aun(incluso)*.\n- Interrogativos y exclamativos siempre con tilde: *qué, quién, cómo, cuándo, dónde, cuánto*.\n\n## 4. Concordancia\n- **Sujeto-verbo** en número y persona: *La mayoría de los estudiantes **aprobó*** (también se admite *aprobaron*).\n- **Sustantivo-adjetivo** en género y número.\n- Ojo con sujetos largos: identifica el **núcleo** (*El grupo de alumnos **llega** temprano*).\n- **Quesuísmo, dequeismo y queismo:** se dice *estoy seguro **de que*** y *pienso **que*** (no *pienso de que*). Truco: pregunta «¿De qué estoy seguro?» → lleva *de*; «¿Qué pienso?» → sin *de*.\n\n## 5. Errores frecuentes de escritura\n- *Haber / a ver*, *hay / ahí / ay*, *echo / hecho*, *sino / si no*, *porque / por qué / porqué / por que*.\n- *Halla / haya / aya*, *valla / vaya*, *ha / a*.\n- Queda mal: *le dije a los niños* → correcto: ***les*** *dije a los niños*.\n\n## 6. Escribir para convencer\nEstructura argumentativa: **introducción con tesis → argumentos con evidencia → contraargumento y refutación → conclusión**.\nTipos de argumento: de autoridad, por datos, por ejemplos, por analogía, por causa-efecto.\nUn buen texto argumentativo es **claro, ordenado y respetuoso**: si atacas a la persona en lugar de la idea, caes en falacia.\n\n## 7. Checklist antes de entregar cualquier escrito\n1. ¿Hay una idea por párrafo?\n2. ¿Los conectores expresan la relación real?\n3. ¿Concuerdan sujetos y verbos?\n4. ¿Las tildes diacríticas están puestas?\n5. ¿Sobra alguna palabra? Casi siempre sí.\n## 8. El parrafo: unidad, coherencia y cohesion\n\n- **Unidad:** una sola idea central por parrafo, expresada en la oracion topica.\n- **Coherencia:** las ideas se ordenan de forma logica (general a particular, causa a efecto, cronologica).\n- **Cohesion:** los mecanismos que enlazan (conectores, sinonimos, pronombres, elipsis).\n\n| Tipo de parrafo | Funcion |\n|---|---|\n| Introductorio | presenta el tema y anuncia la tesis |\n| De desarrollo | explica, ejemplifica o argumenta |\n| De transicion | enlaza dos bloques |\n| Conclusivo | sintetiza y cierra |\n\n**Ordenar oraciones (item frecuente):** localiza la oracion mas general (va primero), sigue las marcas de referencia (\"este proceso\", \"dicha medida\" siempre apuntan a algo ya mencionado) y deja para el final las que empiezan con \"en conclusion\" o \"por eso\".\n\n## 9. Puntuacion con reglas claras\n\n| Signo | Se usa para | Ejemplo |\n|---|---|---|\n| Coma enumerativa | separar elementos de una serie | \"compre pan, queso y leche\" |\n| Coma vocativa | aislar a quien se llama | \"Ana, ven aca\" |\n| Coma explicativa | encerrar aclaraciones | \"Quito, capital del Ecuador, esta en los Andes\" |\n| Coma de conector | tras conectores como \"sin embargo\" | \"Sin embargo, no asistio\" |\n| Punto y coma | separar elementos que ya llevan comas o ideas muy ligadas | \"Vinieron Ana, la medica; Luis, el chofer\" |\n| Dos puntos | anunciar enumeracion, cita o explicacion | \"Hay tres motivos: tiempo, dinero y salud\" |\n| Comillas | citas textuales y usos irregulares | dijo que era \"imposible\" |\n| Raya o parentesis | incisos | la reunion (la tercera del mes) fue larga |\n\n> [warn] **Nunca** se pone coma entre el sujeto y el verbo: \"Los estudiantes de la EPN, rindieron el examen\" es incorrecto.\n\n## 10. Acentuacion completa\n\n| Tipo | Silaba tonica | Lleva tilde cuando |\n|---|---|---|\n| Aguda | ultima | termina en vocal, n o s (cancion, cafe, compas) |\n| Grave o llana | penultima | **no** termina en vocal, n ni s (arbol, lapiz, dificil) |\n| Esdrujula | antepenultima | **siempre** (matematica, examenes) |\n| Sobresdrujula | anterior | **siempre** (digaselo) |\n\n- **Hiato con tilde:** vocal debil tonica junto a fuerte lleva tilde siempre (dia, rio, baul, oido).\n- **Tilde diacritica:** el/el, tu/tu, mi/mi, si/si, se/se, mas/mas, te/te, de/de, aun/aun.\n- **Interrogativos y exclamativos** siempre con tilde: que, quien, cuando, donde, como, cuanto.\n\n## 11. Concordancia y errores frecuentes\n\n- Sujeto y verbo concuerdan en numero y persona: \"la mayoria de los estudiantes **aprobo**\" (o \"aprobaron\", ambas aceptadas, pero manten la eleccion).\n- Sustantivo y adjetivo concuerdan en genero y numero: \"problemas complejos\".\n- **Dequeismo:** \"pienso *de que* vendra\" (incorrecto) por \"pienso que vendra\".\n- **Queismo:** \"me alegro *que* vinieras\" por \"me alegro **de** que vinieras\".\n- **Laismo/leismo:** \"le vi\" por \"lo vi\".\n- **Haber impersonal siempre en singular:** \"**hubo** muchos problemas\", no \"hubieron\".\n- Homofonos que confunden: haber/a ver, hay/ahi/ay, echo/hecho, halla/haya/aya, porque/por que/porque/por que, sino/si no.\n\n## 12. Escribir para convencer\n\nEstructura de un texto argumentativo eficaz:\n\n1. **Introduccion:** contextualiza y enuncia la tesis en una oracion clara.\n2. **Desarrollo:** un argumento por parrafo, con evidencia (datos, ejemplos, autoridad) y explicacion de por que esa evidencia apoya la tesis.\n3. **Contraargumento y refutacion:** reconoce la objecion mas fuerte y respondela. Esto **aumenta** la credibilidad.\n4. **Conclusion:** retoma la tesis con otras palabras y cierra con una proyeccion o llamado.\n\nRegistro academico: evita muletillas, coloquialismos y la primera persona excesiva; prefiere oraciones de menos de 25 palabras y voz activa.\n\n## Ejercicios resueltos tipo examen\n\n**1)** Corregir: \"Hubieron muchos aspirantes que no llegaron a tiempo\" $\\to$ \"**Hubo** muchos aspirantes que no llegaron a tiempo\".\n\n**2)** Cual lleva tilde: examenes, imagenes, jovenes? Todas: son esdrujulas al pasar al plural.\n\n**3)** Puntuar: \"Estudie mucho sin embargo no aprobe\" $\\to$ \"Estudie mucho; sin embargo, no aprobe\".\n\n**4)** \"Me alegro de que hayas venido\" es correcto; \"me alegro que hayas venido\" incurre en queismo.\n\n@@CHAPTER gen|g1|🎯|Cómo rendir el examen EPN\n## Estructura real de la prueba\n- **Cuatro áreas:** Matemática, Física, Química y Lenguaje. Selección múltiple, formato digital presencial.\n- **210 minutos** en total: **90 minutos de Matemática** (componente **filtro**) y luego **120 minutos** para Física, Química y Lenguaje.\n- Calificación sobre **1 000 puntos**.\n\n> Matemática es filtro: si no la superas, el resto no cuenta. Prioriza ahí tu tiempo de estudio.\n\n## Gestión del tiempo\n1. **Primera pasada:** responde solo lo que sabes en menos de 60 segundos. Marca las demás con «Marcar pregunta».\n2. **Segunda pasada:** vuelve a las marcadas con la cabeza fresca.\n3. **Tercera pasada:** nunca dejes una en blanco si no hay penalización por error.\n\nRegla práctica: si llevas más de 2 minutos en una pregunta, márcala y avanza. Una pregunta difícil vale lo mismo que una fácil.\n\n## Técnicas para selección múltiple\n- **Reemplaza las opciones** en la ecuación: suele ser más rápido que resolver.\n- **Estima**: descarta por orden de magnitud, signo o unidades.\n- **Casos particulares**: si la pregunta es general, prueba con $x=0$ o $x=1$.\n- Analiza **unidades** en Física y Química: muchas opciones se caen solas.\n- Si dudas entre dos, elige la más **específica y moderada**; desconfía de los absolutos.\n\n## Plan de estudio eficiente (método de 3 vueltas)\n1. **Vuelta 1 – comprender:** lee el capítulo de «Aprende» del tema y resuelve un simulacro en nivel **Fácil**.\n2. **Vuelta 2 – consolidar:** simulacros en nivel **Intermedio** revisando cada explicación, incluso de las que acertaste.\n3. **Vuelta 3 – dominar:** niveles **Difícil** y **Experto** con el cronómetro activo y el modo **Simulacro completo**.\n\n**Repaso espaciado:** revisa un tema al día 1, 3, 7 y 15. Es la forma más barata de no olvidar.\n**Práctica de recuperación:** intentar responder **antes** de mirar la explicación fija mucho más que releer.\n\n## El día del examen\n- Duerme bien: una noche completa rinde más que tres horas extra de repaso.\n- Lee el enunciado **completo** antes de mirar las opciones.\n- Respira: 4 segundos inhalar, 4 sostener, 4 exhalar. Baja las pulsaciones en un minuto.\n- Revisa que no quede ninguna pregunta sin responder antes de enviar.\n## Como usar este simulador para aprobar\n\n1. **Diagnostico (dia 1).** Rinde un simulador de cada materia en nivel intermedio sin estudiar. Mira la seccion Estadisticas: te dira exactamente cuales son tus temas debiles.\n2. **Ciclo de estudio.** Lee el capitulo que el simulador te recomienda en \"Que estudiar ahora\", cierra la teoria y rinde un simulador de esa materia. Si superas el 85% en ese tema, pasa al siguiente de la lista.\n3. **Sube la dificultad.** Cuando domines el nivel intermedio, cambia a dificil y luego a experto en Configuracion.\n4. **Simulacro completo.** Una vez por semana, rinde el modo mezclado con tiempo real para entrenar resistencia y manejo del reloj.\n5. **Repaso final.** En la ultima semana revisa solo los intentos con nota baja del historial y los temas marcados en rojo.\n\n## Distribucion oficial de la prueba\n\n| Momento | Area | Tiempo |\n|---|---|---|\n| Primer bloque | Matematica (filtro) | hasta 90 minutos |\n| Segundo bloque | Quimica, Fisica y Lenguaje | hasta 120 minutos |\n| Total | 4 areas, seleccion multiple | 210 minutos |\n\nLa calificacion es sobre **1.000 puntos** sin decimales, y solo quienes aprueban Matematica rinden las otras tres areas. Por eso el simulador te sugiere priorizar Matematica cuando tu promedio en esa area esta bajo.";

<script>

(function(){

    'ldots':'\u2026','dots':'\u2026','cdots':'\u22EF','triangle':'\u25B3','perp':'\u22A5','parallel':'\u2225',

  var REL = ['=','<','>','+','\u2212','\u00B1','\u2260','\u2264','\u2265','\u2248','\u2245','\u21D2','\u2192','\u00D7','\u22C5','\u2227','\u2228'];

  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  function readGroup(s,i){
    if(s[i]!=='{'){
      if(s[i]==='\\'){var m=/^\\([a-zA-Z]+)/.exec(s.slice(i)); if(m) return {body:m[0],next:i+m[0].length};}

    var out='',i=0;
    while(i<s.length){
      var c=s[i];
      if(c==='\\'){
        var m=/^\\([a-zA-Z]+)/.exec(s.slice(i));
        if(m){
          var name=m[1]; i+=m[0].length;
          if(name==='frac'||name==='dfrac'||name==='tfrac'){
            var a=readGroup(s,i); var b=readGroup(s,a.next); i=b.next;
            out+='<span class="mfrac"><span class="num">'+parse(a.body)+'</span><span class="den">'+parse(b.body)+'</span></span>';
          } else if(name==='sqrt'){
            var idx='';
            if(s[i]==='['){var k=s.indexOf(']',i); idx=s.slice(i+1,k); i=k+1;}
            var g=readGroup(s,i); i=g.next;
            out+='<span class="msqrt">'+(idx?'<sup class="msup" style="vertical-align:.9em">'+parse(idx)+'</sup>':'')+'<span class="rad"><svg viewBox="0 0 10 20" preserveAspectRatio="none" aria-hidden="true"><path d="M0.4 12.4 L2.9 12.4 L5.5 19.3 L8.8 0.55 L10 0.55" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linejoin="miter" stroke-linecap="square" vector-effect="non-scaling-stroke"/></svg></span><span class="sqbody">'+parse(g.body)+'</span></span>';
          } else if(name==='overline'||name==='bar'){
            var g2=readGroup(s,i); i=g2.next;
            out+='<span class="mover">'+parse(g2.body)+'</span>';
          } else if(name==='text'||name==='mathrm'||name==='operatorname'||name==='mathbf'){
            var g3=readGroup(s,i); i=g3.next;
            out+='<span class="mtext">'+parse(g3.body)+'</span>';
          } else if(name==='mathbb'){
            var g4=readGroup(s,i); i=g4.next;
            out+='<span class="mtext" style="font-weight:600">'+esc(g4.body)+'</span>';
          } else if(FUNCS.indexOf(name)>=0){
            out+='<span class="mtext">'+name+'</span>\u2009';
          } else if(SYM.hasOwnProperty(name)){
            var sym=SYM[name];
            out+= (REL.indexOf(sym)>=0? '<span class="mo">'+sym+'</span>' : sym);
          } else { out+=esc(name); }
          continue;
        }
        var ch=s[i+1]||''; i+=2;
        if(SYM.hasOwnProperty(ch)) out+=SYM[ch]; else out+=esc(ch);
        continue;
      }
      if(c==='^'||c==='_'){
        var g5=readGroup(s,i+1); i=g5.next;
        out+= (c==='^'? '<sup class="msup">' : '<sub class="msub">')+parse(g5.body)+(c==='^'?'</sup>':'</sub>');
        continue;
      }
      if(c==='{'||c==='}'){ i++; continue; }
      if(c==='-'){ out+='<span class="mo">\u2212</span>'; i++; continue; }
      if('=+<>'.indexOf(c)>=0){ out+='<span class="mo">'+esc(c)+'</span>'; i++; continue; }
      if(/[a-zA-Z]/.test(c)){ out+='<span class="mi">'+c+'</span>'; i++; continue; }
      if(c===' '){ out+=' '; i++; continue; }
      out+=esc(c); i++;
    }
    return out;
  }

  window.tex = function(src){
    if(src==null) return '';
    var parts = String(src).split(/(\$\$[^$]*\$\$|\$[^$]*\$)/g);
    return parts.map(function(p){
      if(p.indexOf('$$')===0 && p.lastIndexOf('$$')===p.length-2 && p.length>3) return '<span class="mjx mjx-display">'+parse(p.slice(2,-2))+'</span>';

      return esc(p).replace(/&lt;br\s*\/?&gt;/g,'<br>').replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>');
    }).join('');
  };
})();

/* arco de angulo calculado a partir de la geometria real de la figura */
function angOf(V,P){ return Math.atan2(V[1]-P[1], P[0]-V[0]); }
function norm2pi(a){ while(a<0) a+=Math.PI*2; while(a>=Math.PI*2) a-=Math.PI*2; return a; }
function angArc(V,P1,P2,r,col){
  var a1=angOf(V,P1), a2=angOf(V,P2);
  var d=norm2pi(a2-a1);
  if(d>Math.PI){ var tmp=a1; a1=a2; a2=tmp; d=Math.PI*2-d; }
  var p1=[V[0]+r*Math.cos(a1), V[1]-r*Math.sin(a1)];
  var p2=[V[0]+r*Math.cos(a2), V[1]-r*Math.sin(a2)];
  return '<path d="M'+p1[0].toFixed(1)+','+p1[1].toFixed(1)+' A'+r+','+r+' 0 0 0 '+
    p2[0].toFixed(1)+','+p2[1].toFixed(1)+'" fill="none" stroke="'+(col||'#b3261e')+'" stroke-width="1.3"/>';
}
/* punto sobre la bisectriz del angulo, a distancia d del vertice */
function bisPt(V,P1,P2,d){
  var a1=angOf(V,P1), a2=angOf(V,P2);
  var df=norm2pi(a2-a1); if(df>Math.PI){ var t=a1; a1=a2; a2=t; df=Math.PI*2-df; }
  var am=a1+df/2;
  return [V[0]+d*Math.cos(am), V[1]-d*Math.sin(am)];
}
function angLabel(V,P1,P2,d,s,col){
  var q=bisPt(V,P1,P2,d);
  return txt(q[0],q[1]+4,s,{fill:col||'#b3261e',bold:true,size:12,anchor:'middle'});
}

/* ---- plano cartesiano con puntos / segmento / recta ---- */
axes:function(f){
  var W=300,H=250,cx=W/2,cy=H/2;
  function numOf(v){
    if(typeof v==='number') return v;
    var s=String(v).replace(/\s+/g,'');
    var fr=/^(-?)\\d?frac\{(-?\d+)\}\{(-?\d+)\}$/.exec(s);
    if(fr) return (fr[1]==='-'?-1:1)*(+fr[2])/(+fr[3]);
    var sl=/^(-?\d+)\/(-?\d+)$/.exec(s);
    if(sl) return (+sl[1])/(+sl[2]);
    var n=parseFloat(s);
    return isFinite(n)? n : null;
  }
  var pts=f.pts||[], maxv=4;
  var ln=null;
  if(f.line){ var m0=numOf(f.line[0]), b0=numOf(f.line[1]); if(m0!==null && b0!==null) ln=[m0,b0]; }
  pts.forEach(function(p){ maxv=Math.max(maxv,Math.abs(p[0]),Math.abs(p[1])); });
  if(ln) maxv=Math.max(maxv,Math.abs(ln[1])+2);
  var step=Math.max(1,Math.ceil(maxv/5)), lim=step*5, k=(W/2-24)/lim;
  var X=function(x){return cx+x*k;}, Y=function(y){return cy-y*k;};
  var s=svgOpen(W,H);
  var g='';
  for(var i=-5;i<=5;i++){ g+=line(X(i*step),8,X(i*step),H-8,{stroke:'#e9ecef',w:1})+line(8,Y(i*step),W-8,Y(i*step),{stroke:'#e9ecef',w:1}); }
  s+=g;
  s+=line(8,cy,W-8,cy,{stroke:'#5b6b7a',w:1.3,arrow:true})+line(cx,H-8,cx,8,{stroke:'#5b6b7a',w:1.3,arrow:true});
  s+=txt(W-14,cy-6,'x',{italic:true,size:11,fill:'#5b6b7a'})+txt(cx+6,14,'y',{italic:true,size:11,fill:'#5b6b7a'});
  s+=txt(X(step)-3,cy+13,String(step),{size:9,fill:'#8a97a3'})+txt(cx+5,Y(step)+4,String(step),{size:9,fill:'#8a97a3'});
  if(ln){ var m=ln[0],b=ln[1];
    var xa=-lim,xb=lim; s+=line(X(xa),Y(m*xa+b),X(xb),Y(m*xb+b),{stroke:'#0f6cbf',w:1.6}); }
  if(f.seg && pts.length>=2) s+=line(X(pts[0][0]),Y(pts[0][1]),X(pts[1][0]),Y(pts[1][1]),{stroke:'#b3261e',w:1.7,dash:true});
  pts.forEach(function(p){
    s+='<circle cx="'+X(p[0]).toFixed(1)+'" cy="'+Y(p[1]).toFixed(1)+'" r="3.6" fill="#b3261e"/>';
    s+=txt(X(p[0])+7,Y(p[1])-7,(p[2]||'')+'('+p[0]+', '+p[1]+')',{size:11,bold:true});
  });
  return s+'</svg>';
},

/* =====================================================================
   MINI-MARKDOWN para la sección Aprende
   ===================================================================== */
function inlineMd(s){
  return String(s).split(/(\$\$[^$]*\$\$|\$[^$]*\$)/g).map(function(p){
    if(p.charAt(0)==='$') return tex(p);
    return escH(p)
      .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
      .replace(/(^|[^*])\*([^*]+)\*/g,'$1<i>$2</i>')
      .replace(/`([^`]+)`/g,'<code>$1</code>');
  }).join('');
}
function md(src){
  var lines=String(src).split('\n'), out='', i=0;
  function flushPara(buf){ if(buf.length) out+='<p>'+inlineMd(buf.join(' '))+'</p>'; }
  var para=[];
  while(i<lines.length){
    var L=lines[i];
    if(/^\s*$/.test(L)){ flushPara(para); para=[]; i++; continue; }
    if(/^####\s+/.test(L)){ flushPara(para); para=[]; out+='<h4>'+inlineMd(L.replace(/^####\s+/,''))+'</h4>'; i++; continue; }
    if(/^###\s+/.test(L)){ flushPara(para); para=[]; out+='<h3>'+inlineMd(L.replace(/^###\s+/,''))+'</h3>'; i++; continue; }
    if(/^##\s+/.test(L)){ flushPara(para); para=[]; out+='<h2>'+inlineMd(L.replace(/^##\s+/,''))+'</h2>'; i++; continue; }
    if(/^---\s*$/.test(L)){ flushPara(para); para=[]; out+='<hr>'; i++; continue; }
    if(/^>\s?/.test(L)){ flushPara(para); para=[]; var q=[];
      while(i<lines.length && /^>\s?/.test(lines[i])){ q.push(lines[i].replace(/^>\s?/,'')); i++; }
      out+='<blockquote>'+inlineMd(q.join(' '))+'</blockquote>'; continue; }
    if(/^\|/.test(L)){ flushPara(para); para=[]; var rows=[];
      while(i<lines.length && /^\|/.test(lines[i])){ rows.push(lines[i]); i++; }
      var cells=rows.map(function(r){ return r.replace(/^\|/,'').replace(/\|\s*$/,'').split('|').map(function(c){return c.trim();}); })
        .filter(function(r){ return !r.every(function(c){return /^:?-{2,}:?$/.test(c);}); });
      out+='<table><thead><tr>'+cells[0].map(function(c){return '<th>'+inlineMd(c)+'</th>';}).join('')+'</tr></thead><tbody>'+

      continue; }
    if(/^-\s+/.test(L)){ flushPara(para); para=[]; var li=[];

      out+='<ul>'+li.map(function(x){return '<li>'+inlineMd(x)+'</li>';}).join('')+'</ul>'; continue; }

    para.push(L); i++;
  }
  flushPara(para);

/* ---------- markdown → HTML (mejorado) ---------- */
function inlineMd(s){
  var math = [];
  var txt = String(s).replace(/(\$\$[^$]*\$\$|\$[^$]*\$)/g, function(m){ math.push(m); return '\u0000'+(math.length-1)+'\u0000'; });
  txt = escH(txt)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/(^|[^*\w])\*([^*]+)\*/g,'$1<i>$2</i>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/&lt;br\s*\/?&gt;/g,'<br>')
    .replace(/--&gt;|\u2013&gt;/g,'\u2192');
  return txt.replace(/\u0000(\d+)\u0000/g, function(_,i){ return tex(math[+i]); });
}
function slugId(t){ return 'h-'+String(t).toLowerCase().replace(/[^a-z0-9\u00e0-\u00ff]+/g,'-').replace(/^-|-$/g,''); }
function quoteClass(t){
  var s = t.toLowerCase();
  if(s.indexOf('analog')>=0 || s.indexOf('truco')>=0 || s.indexOf('regla')>=0 || s.indexOf('idea clave')>=0) return ' class="tip"';
  if(s.indexOf('error')>=0 || s.indexOf('cuidado')>=0 || s.indexOf('ojo')>=0 || s.indexOf('trampa')>=0) return ' class="warn"';
  return '';
}
function md(src){
  var lines = String(src).split('\n'), out = '', i = 0, para = [];
  function flush(){ if(para.length){ out += '<p>'+inlineMd(para.join(' '))+'</p>'; para = []; } }
  while(i < lines.length){
    var L = lines[i];
    if(/^\s*$/.test(L)){ flush(); i++; continue; }
    var h = /^(#{2,4})\s+(.*)$/.exec(L);
    if(h){ flush(); var lvl = h[1].length, txt = h[2];
      out += '<h'+lvl+(lvl<=3?' id="'+slugId(txt)+'"':'')+'>'+inlineMd(txt)+'</h'+lvl+'>'; i++; continue; }
    if(/^---\s*$/.test(L)){ flush(); out += '<hr>'; i++; continue; }
    if(/^>\s?/.test(L)){ flush(); var q = [];
      while(i < lines.length && /^>\s?/.test(lines[i])){ q.push(lines[i].replace(/^>\s?/,'')); i++; }
      var body = q.join(' ');
      out += '<blockquote'+quoteClass(body)+'>'+inlineMd(body)+'</blockquote>'; continue; }
    if(/^\|/.test(L)){ flush(); var rows = [];
      while(i < lines.length && /^\|/.test(lines[i])){ rows.push(lines[i]); i++; }
      var cells = rows.map(function(r){ return r.replace(/^\|/,'').replace(/\|\s*$/,'').split('|').map(function(c){return c.trim();}); })
        .filter(function(r){ return !r.every(function(c){ return /^:?-{2,}:?$/.test(c); }); });
      out += '<table><thead><tr>'+cells[0].map(function(c){return '<th>'+inlineMd(c)+'</th>';}).join('')+'</tr></thead><tbody>'+
        cells.slice(1).map(function(r){return '<tr>'+r.map(function(c){return '<td>'+inlineMd(c)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';
      continue; }
    if(/^[-*]\s+/.test(L)){ flush(); var li = [];
      while(i < lines.length && /^[-*]\s+/.test(lines[i])){ li.push(lines[i].replace(/^[-*]\s+/,'')); i++; }
      out += '<ul>'+li.map(function(x){return '<li>'+inlineMd(x)+'</li>';}).join('')+'</ul>'; continue; }
    if(/^\d+[.)]\s+/.test(L)){ flush(); var lo = [];
      while(i < lines.length && /^\d+[.)]\s+/.test(lines[i])){ lo.push(lines[i].replace(/^\d+[.)]\s+/,'')); i++; }
      out += '<ol>'+lo.map(function(x){return '<li>'+inlineMd(x)+'</li>';}).join('')+'</ol>'; continue; }
    para.push(L); i++;
  }
  flush();
  return out;
}
function chapterToc(body){
  var items = [];
  String(body).split('\n').forEach(function(L){
    var h = /^##\s+(.*)$/.exec(L);
    if(h) items.push(h[1]);
  });
  if(items.length < 3) return '';
  return '<div class="toc"><b>En este cap\u00edtulo</b><ol>'+items.map(function(t){
    return '<li><a data-act="anchor" data-id="'+slugId(t)+'">'+escH(t.replace(/^\d+\.\s*/,''))+'</a></li>';
  }).join('')+'</ol></div>';
}

function pickSpread(pool, n){
  var by={}; pool.forEach(function(q){ (by[q.t]=by[q.t]||[]).push(q); });
  var topics=shuffle(Object.keys(by)).map(function(t){return shuffle(by[t]);});
  var picked=[], i=0, guard=0;
  while(picked.length<n && guard++<800){
    var moved=false;
    for(var k=0;k<topics.length && picked.length<n;k++){ if(topics[k][i]){ picked.push(topics[k][i]); moved=true; } }
    i++; if(!moved) break;
  }
  return picked;
}

/* ---------- Anti-Overfitting & Concept Generalization Engine ---------- */
function levelPool(k){ return cfg.level==='todos'? BANK[k].slice() : BANK[k].filter(function(q){return q.d===cfg.level;}); }

function pickForSubject(k, want, notes){
  var subjBank = BANK[k] || [];
  if(!subjBank.length) return [];

  // Primary pool by difficulty
  var primaryPool = cfg.level === 'todos' ? subjBank.slice() : subjBank.filter(function(q){ return q.d === cfg.level; });
  
  // 1. Unseen questions from primary level
  var fresh = primaryPool.filter(function(q){ return !SEENSET[k][q.__i]; });
  
  if(fresh.length >= want){
    return pickSpread(fresh, want);
  }

  // 2. If fresh in primary level is insufficient, expand to unseen questions in adjacent levels (Anti-Overfitting)
  var picked = pickSpread(fresh, fresh.length);
  var needed = want - picked.length;
  
  var otherLevels = ['medio', 'facil', 'dificil', 'experto'].filter(function(l){ return l !== cfg.level; });
  var secondaryPool = [];
  otherLevels.forEach(function(lvl){
    subjBank.filter(function(q){ return q.d === lvl && !SEENSET[k][q.__i]; }).forEach(function(q){
      secondaryPool.push(q);
    });
  });

  if(secondaryPool.length > 0 && needed > 0){
    var secondaryPicked = pickSpread(secondaryPool, needed);
    picked = picked.concat(secondaryPicked);
    notes.push('Para evitar la memorización repetitiva (overfitting), se combinaron preguntas no vistas del nivel ' + levelName(cfg.level) + ' con niveles complementarios.');
  }

  // 3. If total unseen questions in subject is still less than want, reset subject seen history
  if(picked.length < want){
    subjBank.forEach(function(q){ delete SEENSET[k][q.__i]; });
    SEEN[k] = [];
    saveSeen();
    notes.push('¡Has completado el banco entero de ' + COURSES[k].short + '! Se reinició el ciclo de preguntas vistas con nuevo orden aleatorio.');
    
    var remainingNeeded = want - picked.length;
    var recycled = pickSpread(primaryPool.length ? primaryPool : subjBank, remainingNeeded);
    picked = picked.concat(recycled);
  }

  return picked.slice(0, want);
}

function isCorrect(ix){
  var a = S.attempt, q = a.qs[ix];
  return a.ans[ix]!==null && q.order[a.ans[ix]] === q.src.a;
}
function navButtons(mode){
  var a = S.attempt, c = COURSES[a.course];
  var btns = a.qs.map(function(q,ix){
    var cls = 'qnbutton';
    if(mode==='review'){ cls += isCorrect(ix)?' correct':(a.ans[ix]!==null?' incorrect':''); }
    else { if(a.ans[ix]!==null) cls += ' answered'; if(ix===a.cur && S.view==='attempt') cls += ' current'; }
    if(a.flags[ix]) cls += ' flagged';
    return '<button class="'+cls+'" data-act="goto" data-i="'+ix+'"><span class="num">'+(ix+1)+'</span><span class="bar"></span></button>';
  }).join('');
  return '<div class="block">'+
    '<h5>Navegaci\u00f3n por el cuestionario</h5>'+
    '<div class="user"><div class="av">'+escH((cfg.student||'A').trim().charAt(0))+'</div><div class="uname">'+escH(cfg.student)+'</div></div>'+
    '<div class="quizname">'+c.name+'</div>'+

}
function navBlock(mode){ return '<div class="rightblock">'+navButtons(mode)+'</div>'; }

function progressSnapshot(){
  return {app:'Simulador EPN 2026-B', v:5, exported:new Date().toISOString(),
          cfg:cfg, hist:HIST, seen:SEEN, ui:UI};
}
function exportProgress(){
  try{
    var txt = JSON.stringify(progressSnapshot(), null, 1);
    var blob = new Blob([txt], {type:'application/json'});
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    var d = new Date(), st = d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
    a.href = url; a.download = 'progreso-epn-'+st+'.json';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 500);
    S.toast = 'Progreso exportado. Guarda ese archivo .json y vuelve a importarlo cuando actualices la aplicación.';
  }catch(e){ S.toast = 'No se pudo exportar: '+e.message; }
  S.modal = null; render();
}
function importProgress(text){
  var data;
  try{ data = JSON.parse(text); }catch(e){ S.toast = 'El archivo no es un JSON válido.'; render(); return; }
  if(!data || (!data.hist && !data.seen && !data.cfg)){ S.toast = 'El archivo no contiene datos de progreso del simulador.'; render(); return; }
  var nuevos = 0, ids = {};
  HIST.forEach(function(r){ ids[r.id] = 1; });
  (data.hist||[]).forEach(function(r){ if(r && r.id && !ids[r.id]){ HIST.push(r); ids[r.id]=1; nuevos++; } });
  HIST.sort(function(a,b){ return a.ts-b.ts; });
  var vistas = 0;
  SUBJ.forEach(function(k){
    var add = (data.seen && data.seen[k]) || [];
    add.forEach(function(i){ if(!SEENSET[k][i]){ SEENSET[k][i]=1; SEEN[k].push(i); vistas++; } });
  });
  if(data.cfg) { Object.keys(DEFAULT_CFG).forEach(function(k){ if(data.cfg[k]!==undefined) cfg[k]=data.cfg[k]; }); }
  if(data.ui && data.ui.read){ UI.read = Object.assign({}, UI.read||{}, data.ui.read); }
  saveHist(); saveSeen(); saveCfg(); saveUI();
  S.modal = null;
  S.toast = 'Progreso importado: '+nuevos+' intento(s) nuevos y '+vistas+' pregunta(s) vistas añadidas. Tu configuración también se restauró.';
  render();
}
