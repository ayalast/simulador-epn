@@CHAPTER qui|q4|⚖️|Estequiometría
## 1. El mol: la docena del químico
Un mol son $6{,}022\times10^{23}$ partículas (número de Avogadro). La **masa molar** $M$ (g/mol) es numéricamente igual a la masa atómica o molecular.

El triángulo maestro:
$$n = \frac{m}{M}, \qquad N = n\cdot N_{A}, \qquad V_{gas,CN} = n \cdot 22{,}4\,\text{L}$$

#### Ejemplo
$50\,\text{g}$ de $CaCO_{3}$ ($M = 100{,}09$): $n = 0{,}4996 \approx 0{,}5\,\text{mol}$, es decir $3{,}01\times10^{23}$ unidades fórmula.

## 2. Composición porcentual
$$\%\,elemento = \frac{masa\ del\ elemento\ en\ 1\ mol}{masa\ molar}\times100$$

## 3. Fórmula empírica y molecular
1. Toma 100 g ⇒ los porcentajes se vuelven gramos.
2. Divide cada masa para su masa atómica → moles.
3. Divide todos para el menor → proporción.
4. Multiplica hasta obtener enteros → **fórmula empírica**.
5. $n = \frac{M_{molecular}}{M_{empírica}}$ → **fórmula molecular** $= (empírica)_{n}$.

Ejemplo clásico: empírica $CH_{2}O$ (30 g/mol) y masa molar 180 ⇒ $n = 6$ ⇒ $C_{6}H_{12}O_{6}$.

## 4. Balanceo de ecuaciones
Ley de conservación de la masa: **el mismo número de átomos de cada elemento a ambos lados**. Solo se cambian **coeficientes**, jamás los subíndices.
Orden recomendado: metales → no metales → hidrógeno → oxígeno.
$$CH_{4}+2O_{2} \rightarrow CO_{2}+2H_{2}O$$

## 5. Cálculos estequiométricos (la autopista)
$$\text{gramos A} \rightarrow \text{moles A} \rightarrow \text{moles B} \rightarrow \text{gramos B}$$
El paso del centro usa la **relación de coeficientes** de la ecuación balanceada.

#### Ejemplo
¿Cuántos gramos de $CO_{2}$ se producen al quemar $16\,\text{g}$ de $CH_{4}$?
$n(CH_{4}) = 1\,\text{mol} \Rightarrow n(CO_{2}) = 1\,\text{mol} \Rightarrow m = 44\,\text{g}$.

## 6. Reactivo limitante y rendimiento
- Calcula los moles de cada reactivo y **divídelos para su coeficiente**. El menor cociente es el **limitante**; él decide cuánto producto se forma. El otro queda **en exceso**.
- **Rendimiento porcentual:** $\%R = \frac{real}{teórico}\times100$.

> **Analogía del sánduche:** con 10 panes y 4 quesos, si cada sánduche lleva 1 pan y 1 queso, el queso es el limitante: solo salen 4 sánduches y sobran 6 panes.

## Checklist antes de responder
1. ¿La ecuación está balanceada?
2. ¿Convertí gramos a moles?
3. ¿Usé la relación correcta de coeficientes?
4. ¿La respuesta tiene sentido en magnitud y unidades?
## 7. Tipos de reacciones quimicas

| Tipo | Esquema | Ejemplo |
|---|---|---|
| Sintesis | $A+B\to AB$ | $2\mathrm{H_2}+\mathrm{O_2}\to 2\mathrm{H_2O}$ |
| Descomposicion | $AB\to A+B$ | $2\mathrm{H_2O_2}\to 2\mathrm{H_2O}+\mathrm{O_2}$ |
| Desplazamiento simple | $A+BC\to AC+B$ | $\mathrm{Zn}+2\mathrm{HCl}\to \mathrm{ZnCl_2}+\mathrm{H_2}$ |
| Doble desplazamiento | $AB+CD\to AD+CB$ | $\mathrm{AgNO_3}+\mathrm{NaCl}\to \mathrm{AgCl}+\mathrm{NaNO_3}$ |
| Combustion | hidrocarburo + $\mathrm{O_2}$ | $\mathrm{CH_4}+2\mathrm{O_2}\to \mathrm{CO_2}+2\mathrm{H_2O}$ |
| Neutralizacion | acido + base | $\mathrm{HCl}+\mathrm{NaOH}\to \mathrm{NaCl}+\mathrm{H_2O}$ |

**Balanceo por tanteo:** ajusta primero metales, luego no metales, despues hidrogeno y **al final oxigeno**. Nunca cambies los subindices: solo los coeficientes.

## 8. La "autopista" estequiometrica

```
gramos A --(masa molar A)--> moles A --(coeficientes)--> moles B --(masa molar B)--> gramos B
```

Todo problema de estequiometria es recorrer ese camino. Para gases en condiciones normales, 1 mol ocupa **22,4 L**; para disoluciones, $M=\dfrac{\text{moles de soluto}}{\text{litros de disolucion}}$.

**Ejemplo completo.** Cuantos gramos de $\mathrm{CO_2}$ produce la combustion de 32 g de $\mathrm{CH_4}$?
$32\ \mathrm{g}\div 16\ \mathrm{g/mol}=2$ mol de $\mathrm{CH_4}$; la relacion es 1:1, entonces 2 mol de $\mathrm{CO_2}$, es decir $2\times 44=88$ g.

## 9. Reactivo limitante y rendimiento

1. Convierte **cada** reactivo a moles.
2. Divide las moles de cada uno para su coeficiente: **el menor cociente manda** (ese es el limitante).
3. Calcula el producto a partir del limitante; el otro reactivo queda en exceso.

$$\text{Rendimiento} = \frac{\text{real}}{\text{teorico}}\times 100\%$$

> [tip] Analogia: para armar un sanduche necesitas 2 panes y 1 queso. Con 10 panes y 8 quesos solo puedes hacer 5 sanduches: **el pan es el limitante** aunque haya mas unidades.

## 10. Leyes ponderales y conservacion

- **Ley de Lavoisier:** la masa total se conserva; por eso la ecuacion debe estar balanceada.
- **Ley de Proust (proporciones definidas):** un compuesto siempre tiene la misma proporcion en masa; el agua es 11,2% H y 88,8% O, siempre.

## Ejercicios resueltos tipo examen

**1)** Masa molar del $\mathrm{Ca(OH)_2}$: $40+2(16+1)=74\ \mathrm{g/mol}$.

**2)** Cuantas moleculas hay en 0,5 mol de $\mathrm{N_2}$? $0{,}5\times 6{,}022\times 10^{23}=3{,}01\times 10^{23}$.

**3)** Un compuesto tiene 40% C, 6,7% H y 53,3% O. Dividiendo para las masas atomicas se obtiene 3,33 : 6,7 : 3,33, o sea $\mathrm{CH_2O}$ como formula empirica. Si su masa molar es 180, la molecular es $\mathrm{C_6H_{12}O_6}$.

**4)** Balancear $\mathrm{C_3H_8}+\mathrm{O_2}\to \mathrm{CO_2}+\mathrm{H_2O}$: $\mathrm{C_3H_8}+5\mathrm{O_2}\to 3\mathrm{CO_2}+4\mathrm{H_2O}$.

@@CHAPTER len|l1|🧠|Pensamiento lógico y comunicación
## 1. ¿Qué es un argumento?
Un **argumento** es un conjunto de proposiciones donde unas (**premisas**) sostienen a otra (**conclusión**). No es una pelea ni una opinión suelta.

Palabras señal:
- Premisas: *porque, ya que, dado que, puesto que, en vista de que*.
- Conclusión: *por lo tanto, en consecuencia, luego, así que, se sigue que*.

**Validez ≠ verdad.** Un argumento es **válido** si la conclusión se sigue necesariamente de las premisas, aunque las premisas sean falsas. Es **sólido** si además las premisas son verdaderas.

## 2. Proposiciones y conectores
| Conector | Símbolo | Verdadero cuando |
| --- | --- | --- |
| Conjunción (y) | $p \wedge q$ | ambas son verdaderas |
| Disyunción (o) | $p \vee q$ | al menos una es verdadera |
| Condicional (si… entonces) | $p \rightarrow q$ | salvo si $p$ es V y $q$ es F |
| Bicondicional (si y solo si) | $p \leftrightarrow q$ | ambas tienen el mismo valor |
| Negación | $\neg p$ | $p$ es falsa |

### El condicional y sus parientes (¡muy preguntado!)
Dado «Si llueve, entonces la calle se moja» ($p \rightarrow q$):
- **Recíproca:** $q \rightarrow p$ (si la calle se moja, llovió). **No** equivale.
- **Inversa:** $\neg p \rightarrow \neg q$. **No** equivale.
- **Contrarrecíproca:** $\neg q \rightarrow \neg p$ (si la calle no se mojó, no llovió). **Sí equivale siempre.**

### Reglas de inferencia
- **Modus ponens:** $p \rightarrow q$, $p$ ⇒ $q$. ✅
- **Modus tollens:** $p \rightarrow q$, $\neg q$ ⇒ $\neg p$. ✅
- **Silogismo hipotético:** $p\rightarrow q$, $q\rightarrow r$ ⇒ $p\rightarrow r$. ✅
- **Falacia de afirmar el consecuente:** $p\rightarrow q$, $q$ ⇒ $p$. ❌
- **Falacia de negar el antecedente:** $p\rightarrow q$, $\neg p$ ⇒ $\neg q$. ❌

### Leyes de De Morgan
$\neg(p \wedge q) \equiv \neg p \vee \neg q$ y $\neg(p \vee q) \equiv \neg p \wedge \neg q$.
Negar «todos son X» es «**al menos uno** no es X» (no «ninguno es X»).

## 3. Silogismos categóricos
Cuatro formas: **A** (todo S es P), **E** (ningún S es P), **I** (algunos S son P), **O** (algunos S no son P).
Usa **diagramas de Venn**: dibuja tres círculos, sombrea lo vacío, marca con X lo que existe y comprueba si la conclusión queda forzada.

> Con dos premisas particulares («algunos…») **nunca** se obtiene conclusión válida.

## 4. Falacias frecuentes
- **Ad hominem:** atacar a la persona, no al argumento.
- **Ad verecundiam:** apelar a una autoridad no pertinente.
- **Ad populum:** «todos lo hacen, luego es correcto».
- **Ad baculum:** amenaza. **Ad misericordiam:** apelar a la lástima.
- **Falsa causa (post hoc):** confundir sucesión con causa.
- **Generalización apresurada:** concluir de pocos casos.
- **Falsa dicotomía:** presentar solo dos opciones.
- **Hombre de paja:** deformar la postura del otro para refutarla.
- **Petición de principio:** usar la conclusión como premisa.

## 5. Analogías y series
En «A es a B como C es a D» primero **nombra la relación en voz alta** (parte-todo, causa-efecto, instrumento-oficio, género-especie, sinónimo, antónimo, intensidad) y después busca la opción que la reproduce **en el mismo orden**.

## 6. Hecho vs. opinión
- **Hecho:** verificable objetivamente («Quito está a 2 850 m.s.n.m.»).
- **Juicio de valor:** contiene valoración subjetiva («Quito es la ciudad más linda»). Pistas: adjetivos valorativos, «debería», «es mejor».
## 7. La comunicacion: elementos y funciones

| Elemento | Que es | En un examen se pregunta como... |
|---|---|---|
| Emisor | quien produce el mensaje | "quien enuncia el texto" |
| Receptor | a quien va dirigido | "el destinatario" |
| Mensaje | el contenido | "lo que se comunica" |
| Codigo | el sistema de signos (la lengua) | "el idioma o los simbolos" |
| Canal | el medio fisico | "oral, escrito, digital" |
| Referente | la realidad de la que se habla | "el tema" |
| Contexto | la situacion que rodea | "las circunstancias" |

**Funciones del lenguaje (Jakobson):**

- **Referencial**: informar (noticias, textos cientificos).
- **Emotiva**: expresar al emisor ("me siento agotado").
- **Apelativa o conativa**: influir en el receptor (ordenes, publicidad).
- **Fatica**: abrir o mantener el contacto ("alo?", "me escuchas?").
- **Metalinguistica**: hablar de la lengua misma ("'haber' no es lo mismo que 'a ver'").
- **Poetica**: centrar la atencion en la forma del mensaje (literatura, eslogans).

**Barreras comunicativas:** fisicas (ruido), semanticas (ambiguedad, tecnicismos), psicologicas (prejuicios) y culturales.

## 8. Deduccion, induccion y abduccion

| Tipo | Va de... | Conclusion |
|---|---|---|
| Deductivo | lo general a lo particular | necesaria si las premisas son verdaderas (valido) |
| Inductivo | casos particulares a una generalizacion | probable, nunca segura |
| Abductivo | un hecho a su mejor explicacion | hipotesis plausible |

> [tip] **Validez no es verdad.** Un razonamiento puede ser valido con premisas falsas ("todos los gatos vuelan; Micifuz es gato; luego Micifuz vuela": valido pero no solido). Un argumento **solido** es valido *y* con premisas verdaderas.

## 9. Logica proposicional aplicada

| Conector | Simbolo | Verdadero cuando |
|---|---|---|
| Conjuncion (y) | $p\wedge q$ | ambas son verdaderas |
| Disyuncion (o) | $p\vee q$ | al menos una es verdadera |
| Condicional (si... entonces) | $p\to q$ | falso solo si $p$ es verdadera y $q$ falsa |
| Bicondicional (si y solo si) | $p\leftrightarrow q$ | ambas tienen el mismo valor |
| Negacion | $\neg p$ | invierte el valor |

**Del condicional $p\to q$ se derivan:**

- Reciproca: $q\to p$ (no equivale).
- Inversa: $\neg p\to\neg q$ (no equivale).
- **Contrarreciproca: $\neg q\to\neg p$ (si equivale)**. Es la clave de muchisimos items.

**Reglas de inferencia:** modus ponens ($p\to q$, $p$, luego $q$), modus tollens ($p\to q$, $\neg q$, luego $\neg p$) y silogismo hipotetico ($p\to q$, $q\to r$, luego $p\to r$).

**Falacias formales:** afirmar el consecuente ($p\to q$, $q$, luego $p$) y negar el antecedente ($p\to q$, $\neg p$, luego $\neg q$). Ambas son **invalidas**.

**Leyes de De Morgan:** $\neg(p\wedge q)\equiv \neg p\vee\neg q$ y $\neg(p\vee q)\equiv\neg p\wedge\neg q$. Negar "todos" da "al menos uno no"; negar "algun" da "ninguno".

## 10. Catalogo de falacias informales

| Falacia | En que consiste | Ejemplo |
|---|---|---|
| Ad hominem | atacar a la persona | "no le creas, es un fracasado" |
| Ad verecundiam | apelar a autoridad no pertinente | "lo dijo un actor famoso" |
| Ad populum | apelar a la mayoria | "todos lo hacen, luego esta bien" |
| Falsa causa | confundir correlacion con causa | "desde que uso esta pulsera no me enfermo" |
| Generalizacion apresurada | pocos casos, gran conclusion | "dos taxistas groseros: todos lo son" |
| Falsa dicotomia | reducir a dos opciones | "o estudias ingenieria o fracasas" |
| Hombre de paja | deformar la postura ajena | responder a algo que el otro no dijo |
| Pendiente resbaladiza | cadena catastrofica sin sustento | "si repruebas una materia, perderas tu vida" |
| Peticion de principio | usar la conclusion como premisa | "es legal porque asi lo dice la ley que lo permite" |
| Ad ignorantiam | "no se ha probado lo contrario" | "nadie demostro que no existan, luego existen" |

## 11. Juicios de valor, hechos y opiniones

- **Hecho:** verificable ($\to$ "Quito esta a 2.850 m sobre el nivel del mar").
- **Opinion:** creencia personal, no verificable directamente ("Quito es la ciudad mas linda").
- **Juicio de valor:** evalua segun un criterio explicito o implicito ("la medida fue injusta porque afecto a los mas pobres"). Un buen juicio de valor **declara su criterio** y se apoya en evidencia.

> [warn] En los items de lectura critica, pregunta siempre: esto se puede comprobar? Si la respuesta es no, es opinion o valoracion, aunque suene muy segura.

## Ejercicios resueltos tipo examen

**1)** "Si llueve, la cancha se moja. La cancha no esta mojada." Conclusion valida: **no llovio** (modus tollens).

**2)** Negar "todos los estudiantes aprobaron": **al menos un estudiante no aprobo**.

**3)** "El ministro no puede tener razon porque es antipatico": falacia **ad hominem**.

**4)** "Todos los A son B. Algunos C son A." Conclusion valida: **algunos C son B**.

@@CHAPTER len|l2|📚|Lectura e interpretación de textos
## 1. Los tres niveles de lectura
1. **Literal:** qué dice el texto (datos explícitos).
2. **Inferencial:** qué se deduce sin estar escrito (implicaciones, propósito, tono).
3. **Crítico:** qué tan válido es (evaluar argumentos, sesgos, evidencia).

La mayoría de preguntas del examen son de los niveles 1 y 2.

## 2. Idea principal, tema y título
- **Tema:** de qué trata, en pocas palabras (un sintagma: «la deforestación amazónica»).
- **Idea principal:** la afirmación central sobre ese tema (una oración completa).
- **Ideas secundarias:** ejemplos, datos y explicaciones que la apoyan.

> **Prueba rápida:** si eliminas una oración y el texto pierde el sentido, era la principal; si solo pierde detalle, era secundaria.

## 3. Tipología textual
| Tipo | Intención | Marca típica |
| --- | --- | --- |
| Narrativo | contar hechos | verbos en pasado, secuencia |
| Descriptivo | mostrar cómo es | adjetivos, presente |
| Expositivo | informar/explicar | datos, tercera persona |
| Argumentativo | convencer | tesis + razones |
| Instructivo | dirigir la acción | imperativos, pasos |

Funciones del lenguaje: referencial (informar), apelativa (convencer), expresiva (emociones), poética (forma), fática (contacto), metalingüística (hablar del propio idioma).

## 4. Estrategia para responder rápido
1. Lee **primero la pregunta**, luego el texto: sabrás qué buscar.
2. Subraya conectores y nombres propios: suelen marcar la respuesta.
3. **La respuesta está en el texto**, no en tu opinión ni en tu conocimiento previo.
4. Descarta opciones **demasiado absolutas** («siempre», «nunca», «todos») y las que son verdaderas pero **no responden** lo preguntado.
5. Cuidado con opciones que copian palabras del texto pero cambian el sentido.

## 5. Vocabulario por contexto
Si no conoces una palabra:
- Busca **pistas en la oración**: definiciones, ejemplos, contrastes («pero», «a diferencia de»).
- Analiza **raíces y afijos**: *bio-* vida, *-logía* estudio, *in-/des-* negación, *hiper-* exceso, *sub-* debajo, *re-* repetición, *poli-* muchos, *anti-* contra.
- Reemplaza tu candidata en la oración y verifica que no cambie el sentido.

## 6. Conectores lógicos (el GPS del texto)
- **Adición:** además, asimismo, también, incluso.
- **Oposición:** sin embargo, no obstante, pero, en cambio, aunque.
- **Causa:** porque, debido a, ya que, puesto que.
- **Consecuencia:** por lo tanto, en consecuencia, de modo que, así pues.
- **Condición:** si, siempre que, a menos que.
- **Orden:** en primer lugar, luego, finalmente.
- **Ejemplificación:** por ejemplo, en particular, tal como.
- **Síntesis:** en resumen, en síntesis, en conclusión.

La mitad de las preguntas de completación se resuelven identificando si la relación entre las dos partes es de **suma, contraste o causa**.

## 7. Inferencia bien hecha
Una inferencia válida se apoya en el texto y no agrega información nueva. Si para aceptar la opción necesitas suponer algo que el texto no dice, esa opción es incorrecta.
## 8. Estructura interna de los textos

| Estructura | Como se reconoce |
|---|---|
| Problema-solucion | plantea una dificultad y luego propone salidas |
| Causa-efecto | "debido a", "por lo tanto", "como consecuencia" |
| Comparacion-contraste | "en cambio", "a diferencia de", "igualmente" |
| Enumeracion | "en primer lugar", "por ultimo" |
| Secuencia temporal | fechas y marcadores cronologicos |

Saber la estructura te dice **donde** esta la respuesta: en un texto problema-solucion, la idea principal casi siempre esta en la propuesta final.

## 9. Lectura critica: evaluar, no solo entender

Preguntas que debes hacerle a todo texto argumentativo:

1. **Cual es la tesis?** (la postura que defiende, no el tema).
2. **Con que argumentos la sostiene?** (datos, ejemplos, autoridades, analogias).
3. **Que tipo de evidencia usa?** Es suficiente, actual y pertinente?
4. **Que supone sin decirlo?** (presuposiciones).
5. **Cual es la intencion?** Informar, persuadir, entretener, criticar, vender.
6. **Que tono adopta?** Objetivo, ironico, alarmista, didactico, polemico.
7. **Hay sesgos o falacias?**

> [tip] Tema, tesis e idea principal no son lo mismo. Tema = de que trata (una palabra o frase). Tesis = que sostiene el autor (una oracion completa con postura). Idea principal = la afirmacion mas importante del fragmento.

## 10. Tipos de pregunta y como atacarlas

| Tipo de item | Estrategia |
|---|---|
| Literal ("segun el texto...") | la respuesta esta escrita; localiza la linea |
| Inferencial ("se deduce que...") | debe seguirse del texto, sin agregar informacion externa |
| De vocabulario | sustituye la palabra por cada opcion y relee la oracion |
| De proposito ("el autor busca...") | mira el titulo, el cierre y los verbos usados |
| De estructura ("la funcion del parrafo 3 es...") | pregunta que aporta ese parrafo al conjunto |
| De actitud o tono | fijate en los adjetivos valorativos |

**Descarte inteligente:** son falsas casi siempre las opciones con "siempre", "nunca", "todos", "ninguno" (absolutismos), las que solo repiten palabras del texto sin responder, y las que son verdaderas en el mundo real pero **no estan en el texto**.

## 11. Inferencia bien hecha vs. sobreinterpretacion

Una inferencia valida se apoya en lo que el texto dice mas conocimiento general razonable. Si necesitas inventar un dato, ya no es inferencia.

**Ejemplo.** Texto: "Pese a la lluvia, el estadio estaba lleno."
- Inferencia valida: el publico estaba muy motivado.
- Sobreinterpretacion: el equipo local gano el partido (el texto no lo dice).

## 12. Conectores: el mapa de las ideas

| Relacion | Conectores |
|---|---|
| Adicion | ademas, asimismo, tambien, incluso |
| Oposicion | sin embargo, no obstante, en cambio, aunque |
| Causa | porque, ya que, debido a, puesto que |
| Consecuencia | por lo tanto, en consecuencia, asi que, de ahi que |
| Condicion | si, siempre que, a menos que |
| Ejemplificacion | por ejemplo, tal como, a saber |
| Conclusion | en sintesis, en definitiva, para terminar |

> [warn] Cuidado con "sin embargo": marca un **giro**. Muchas veces la idea principal del autor esta justo despues de ese conector, no antes.

## Ejercicio resuelto tipo examen

**Texto.** "Durante decadas se creyo que memorizar era la mejor forma de aprender. Hoy sabemos que recuperar la informacion de memoria, es decir autoevaluarse, produce aprendizajes mas duraderos que releer. Sin embargo, la mayoria de estudiantes sigue prefiriendo releer porque genera una sensacion de fluidez que confunden con dominio."

- **Tema:** los metodos de estudio.
- **Tesis:** autoevaluarse es mas eficaz que releer.
- **Inferencia valida:** la sensacion de familiaridad no garantiza aprendizaje.
- **Proposito:** persuadir al lector de cambiar su tecnica de estudio.
- **Palabra clave del giro:** "sin embargo", que introduce la conducta contradictoria de los estudiantes.

@@CHAPTER len|l3|✍️|Comunicación escrita
## 1. El párrafo
Un párrafo desarrolla **una sola idea**. Estructura típica: oración temática + oraciones de desarrollo + cierre.
Cualidades: **unidad** (una idea), **coherencia** (orden lógico) y **cohesión** (conectores, pronombres, sinónimos).

Ejercicio clásico del examen: **detectar la oración intrusa** (la que no aporta a la idea central) u **ordenar oraciones** para formar un párrafo. Para ordenar: busca la oración **general sin pronombres ni conectores** (esa va primera) y sigue las pistas de referencia («este fenómeno», «dicha propuesta»).

## 2. Puntuación esencial
**Coma**
- Enumeraciones: *compré pan, leche y queso* (no coma antes de «y» en enumeración simple).
- Vocativo: *María, ven acá.*
- Incisos y aposiciones: *Quito, capital del Ecuador, está…*
- Antes de *pero, sino, aunque*.
- Tras conectores como *sin embargo, por lo tanto, además* (y punto y coma o punto antes).
- **Nunca** entre sujeto y verbo.

**Punto y coma:** separa elementos que ya llevan comas y une oraciones muy relacionadas.
**Dos puntos:** antes de enumeraciones, citas textuales y explicaciones.
**Comillas:** citas y sentido irónico. **Paréntesis:** información accesoria.

> La coma cambia vidas: «Vamos a comer, niños» no es lo mismo que «Vamos a comer niños».

## 3. Acentuación
- **Agudas:** tildan si terminan en vocal, *n* o *s* (*café, canción, comás*).
- **Graves/llanas:** tildan si **no** terminan en vocal, *n* ni *s* (*árbol, lápiz*).
- **Esdrújulas y sobresdrújulas:** siempre tildan (*máquina, dígamelo*).
- **Hiato** con vocal cerrada tónica: siempre tilde (*día, raíz, baúl*).
- **Tilde diacrítica:** *tú/tu, él/el, mí/mi, sí/si, sé/se, más/mas, té/te, dé/de, aún(todavía)/aun(incluso)*.
- Interrogativos y exclamativos siempre con tilde: *qué, quién, cómo, cuándo, dónde, cuánto*.

## 4. Concordancia
- **Sujeto-verbo** en número y persona: *La mayoría de los estudiantes **aprobó*** (también se admite *aprobaron*).
- **Sustantivo-adjetivo** en género y número.
- Ojo con sujetos largos: identifica el **núcleo** (*El grupo de alumnos **llega** temprano*).
- **Quesuísmo, dequeismo y queismo:** se dice *estoy seguro **de que*** y *pienso **que*** (no *pienso de que*). Truco: pregunta «¿De qué estoy seguro?» → lleva *de*; «¿Qué pienso?» → sin *de*.

## 5. Errores frecuentes de escritura
- *Haber / a ver*, *hay / ahí / ay*, *echo / hecho*, *sino / si no*, *porque / por qué / porqué / por que*.
- *Halla / haya / aya*, *valla / vaya*, *ha / a*.
- Queda mal: *le dije a los niños* → correcto: ***les*** *dije a los niños*.

## 6. Escribir para convencer
Estructura argumentativa: **introducción con tesis → argumentos con evidencia → contraargumento y refutación → conclusión**.
Tipos de argumento: de autoridad, por datos, por ejemplos, por analogía, por causa-efecto.
Un buen texto argumentativo es **claro, ordenado y respetuoso**: si atacas a la persona en lugar de la idea, caes en falacia.

## 7. Checklist antes de entregar cualquier escrito
1. ¿Hay una idea por párrafo?
2. ¿Los conectores expresan la relación real?
3. ¿Concuerdan sujetos y verbos?
4. ¿Las tildes diacríticas están puestas?
5. ¿Sobra alguna palabra? Casi siempre sí.
## 8. El parrafo: unidad, coherencia y cohesion

- **Unidad:** una sola idea central por parrafo, expresada en la oracion topica.
- **Coherencia:** las ideas se ordenan de forma logica (general a particular, causa a efecto, cronologica).
- **Cohesion:** los mecanismos que enlazan (conectores, sinonimos, pronombres, elipsis).

| Tipo de parrafo | Funcion |
|---|---|
| Introductorio | presenta el tema y anuncia la tesis |
| De desarrollo | explica, ejemplifica o argumenta |
| De transicion | enlaza dos bloques |
| Conclusivo | sintetiza y cierra |

**Ordenar oraciones (item frecuente):** localiza la oracion mas general (va primero), sigue las marcas de referencia ("este proceso", "dicha medida" siempre apuntan a algo ya mencionado) y deja para el final las que empiezan con "en conclusion" o "por eso".

## 9. Puntuacion con reglas claras

| Signo | Se usa para | Ejemplo |
|---|---|---|
| Coma enumerativa | separar elementos de una serie | "compre pan, queso y leche" |
| Coma vocativa | aislar a quien se llama | "Ana, ven aca" |
| Coma explicativa | encerrar aclaraciones | "Quito, capital del Ecuador, esta en los Andes" |
| Coma de conector | tras conectores como "sin embargo" | "Sin embargo, no asistio" |
| Punto y coma | separar elementos que ya llevan comas o ideas muy ligadas | "Vinieron Ana, la medica; Luis, el chofer" |
| Dos puntos | anunciar enumeracion, cita o explicacion | "Hay tres motivos: tiempo, dinero y salud" |
| Comillas | citas textuales y usos irregulares | dijo que era "imposible" |
| Raya o parentesis | incisos | la reunion (la tercera del mes) fue larga |

> [warn] **Nunca** se pone coma entre el sujeto y el verbo: "Los estudiantes de la EPN, rindieron el examen" es incorrecto.

## 10. Acentuacion completa

| Tipo | Silaba tonica | Lleva tilde cuando |
|---|---|---|
| Aguda | ultima | termina en vocal, n o s (cancion, cafe, compas) |
| Grave o llana | penultima | **no** termina en vocal, n ni s (arbol, lapiz, dificil) |
| Esdrujula | antepenultima | **siempre** (matematica, examenes) |
| Sobresdrujula | anterior | **siempre** (digaselo) |

- **Hiato con tilde:** vocal debil tonica junto a fuerte lleva tilde siempre (dia, rio, baul, oido).
- **Tilde diacritica:** el/el, tu/tu, mi/mi, si/si, se/se, mas/mas, te/te, de/de, aun/aun.
- **Interrogativos y exclamativos** siempre con tilde: que, quien, cuando, donde, como, cuanto.

## 11. Concordancia y errores frecuentes

- Sujeto y verbo concuerdan en numero y persona: "la mayoria de los estudiantes **aprobo**" (o "aprobaron", ambas aceptadas, pero manten la eleccion).
- Sustantivo y adjetivo concuerdan en genero y numero: "problemas complejos".
- **Dequeismo:** "pienso *de que* vendra" (incorrecto) por "pienso que vendra".
- **Queismo:** "me alegro *que* vinieras" por "me alegro **de** que vinieras".
- **Laismo/leismo:** "le vi" por "lo vi".
- **Haber impersonal siempre en singular:** "**hubo** muchos problemas", no "hubieron".
- Homofonos que confunden: haber/a ver, hay/ahi/ay, echo/hecho, halla/haya/aya, porque/por que/porque/por que, sino/si no.

## 12. Escribir para convencer

Estructura de un texto argumentativo eficaz:

1. **Introduccion:** contextualiza y enuncia la tesis en una oracion clara.
2. **Desarrollo:** un argumento por parrafo, con evidencia (datos, ejemplos, autoridad) y explicacion de por que esa evidencia apoya la tesis.
3. **Contraargumento y refutacion:** reconoce la objecion mas fuerte y respondela. Esto **aumenta** la credibilidad.
4. **Conclusion:** retoma la tesis con otras palabras y cierra con una proyeccion o llamado.

Registro academico: evita muletillas, coloquialismos y la primera persona excesiva; prefiere oraciones de menos de 25 palabras y voz activa.

## Ejercicios resueltos tipo examen

**1)** Corregir: "Hubieron muchos aspirantes que no llegaron a tiempo" $\to$ "**Hubo** muchos aspirantes que no llegaron a tiempo".

**2)** Cual lleva tilde: examenes, imagenes, jovenes? Todas: son esdrujulas al pasar al plural.

**3)** Puntuar: "Estudie mucho sin embargo no aprobe" $\to$ "Estudie mucho; sin embargo, no aprobe".

**4)** "Me alegro de que hayas venido" es correcto; "me alegro que hayas venido" incurre en queismo.

## Estructura real de la prueba
- **Cuatro áreas:** Matemática, Física, Química y Lenguaje. Selección múltiple, formato digital presencial.
- **210 minutos** en total: **90 minutos de Matemática** (componente **filtro**) y luego **120 minutos** para Física, Química y Lenguaje.
- Calificación sobre **1 000 puntos**.

> Matemática es filtro: si no la superas, el resto no cuenta. Prioriza ahí tu tiempo de estudio.

## Gestión del tiempo
1. **Primera pasada:** responde solo lo que sabes en menos de 60 segundos. Marca las demás con «Marcar pregunta».
2. **Segunda pasada:** vuelve a las marcadas con la cabeza fresca.
3. **Tercera pasada:** nunca dejes una en blanco si no hay penalización por error.

Regla práctica: si llevas más de 2 minutos en una pregunta, márcala y avanza. Una pregunta difícil vale lo mismo que una fácil.

## Técnicas para selección múltiple
- **Reemplaza las opciones** en la ecuación: suele ser más rápido que resolver.
- **Estima**: descarta por orden de magnitud, signo o unidades.
- **Casos particulares**: si la pregunta es general, prueba con $x=0$ o $x=1$.
- Analiza **unidades** en Física y Química: muchas opciones se caen solas.
- Si dudas entre dos, elige la más **específica y moderada**; desconfía de los absolutos.

## Plan de estudio eficiente (método de 3 vueltas)
1. **Vuelta 1 – comprender:** lee el capítulo de «Aprende» del tema y resuelve un simulacro en nivel **Fácil**.
2. **Vuelta 2 – consolidar:** simulacros en nivel **Intermedio** revisando cada explicación, incluso de las que acertaste.
3. **Vuelta 3 – dominar:** niveles **Difícil** y **Experto** con el cronómetro activo y el modo **Simulacro completo**.

**Repaso espaciado:** revisa un tema al día 1, 3, 7 y 15. Es la forma más barata de no olvidar.
**Práctica de recuperación:** intentar responder **antes** de mirar la explicación fija mucho más que releer.

## El día del examen
- Duerme bien: una noche completa rinde más que tres horas extra de repaso.
- Lee el enunciado **completo** antes de mirar las opciones.
- Respira: 4 segundos inhalar, 4 sostener, 4 exhalar. Baja las pulsaciones en un minuto.
- Revisa que no quede ninguna pregunta sin responder antes de enviar.
## Como usar este simulador para aprobar

1. **Diagnostico (dia 1).** Rinde un simulador de cada materia en nivel intermedio sin estudiar. Mira la seccion Estadisticas: te dira exactamente cuales son tus temas debiles.
2. **Ciclo de estudio.** Lee el capitulo que el simulador te recomienda en "Que estudiar ahora", cierra la teoria y rinde un simulador de esa materia. Si superas el 85% en ese tema, pasa al siguiente de la lista.
3. **Sube la dificultad.** Cuando domines el nivel intermedio, cambia a dificil y luego a experto en Configuracion.
4. **Simulacro completo.** Una vez por semana, rinde el modo mezclado con tiempo real para entrenar resistencia y manejo del reloj.
5. **Repaso final.** En la ultima semana revisa solo los intentos con nota baja del historial y los temas marcados en rojo.

## Distribucion oficial de la prueba

| Momento | Area | Tiempo |
|---|---|---|
| Primer bloque | Matematica (filtro) | hasta 90 minutos |
| Segundo bloque | Quimica, Fisica y Lenguaje | hasta 120 minutos |
| Total | 4 areas, seleccion multiple | 210 minutos |

La calificacion es sobre **1.000 puntos** sin decimales, y solo quienes aprueban Matematica rinden las otras tres areas. Por eso el simulador te sugiere priorizar Matematica cuando tu promedio en esa area esta bajo.
